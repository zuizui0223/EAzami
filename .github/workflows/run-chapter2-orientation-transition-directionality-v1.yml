name: Run Chapter 2 orientation transition directionality v1

on:
  pull_request:
    paths:
      - 'data/evidence/chapter2_orientation_transition_directionality_contract_v1.json'
      - 'analysis/run_chapter2_orientation_transition_directionality_v1.py'
      - '.github/workflows/run-chapter2-orientation-transition-directionality-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install --disable-pip-version-check numpy pandas scipy biopython
          python -m pip check
      - name: Verify frozen source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/zuizui0223/EAzami/actions/artifacts/9516784077 --jq .digest)" = "sha256:cb5717c90cbc769398f9ffce38787704a02e34253c1ff16cf8f368ba55aeda96"
          test "$(gh api repos/zuizui0223/EAzami/actions/artifacts/9520157997 --jq .digest)" = "sha256:819936ceeb6008f356c580622fb72972617700402afaa3d3ab125bff2e6d9106"
          test "$(gh api repos/zuizui0223/EAzami/actions/artifacts/9486643703 --jq .digest)" = "sha256:d90f30e4fcc3a2a0296a7d0cfa13d0f3ecc008b36d28298ac9782a001e6f63c5"
      - name: Recover frozen assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p recovered/japan recovered/taiwan recovered/au .tmp/directionality
          gh run download 32716015605 --name fdt4-japan-orientation-niche-v1 --dir recovered/japan
          gh run download 32725842871 --name fdt4-taiwan-orientation-niche-v1 --dir recovered/taiwan
          gh run download 32614839764 --name comp1061-alt-topology-au-32614839764 --dir recovered/au
      - name: Compile analysis
        run: |
          python -m py_compile analysis/run_chapter2_orientation_transition_regime_hypothesis_v1.py
          python -m py_compile analysis/run_chapter2_orientation_transition_directionality_v1.py
      - name: Run H2 directional decomposition
        run: |
          python analysis/run_chapter2_orientation_transition_directionality_v1.py \
            --contract data/evidence/chapter2_orientation_transition_directionality_contract_v1.json \
            --robustness-result data/evidence/chapter2_orientation_transition_regime_robustness_result_v1.json \
            --orientation data/evidence/orientation_comp1061_20tip_source_crosswalk_v1.csv \
            --japan-occurrences recovered/japan/focal_occurrences_environment_complete.csv \
            --taiwan-occurrences recovered/taiwan/focal_occurrences_environment_complete.csv \
            --au-trees recovered/au/au.trees \
            --out-json .tmp/directionality/result.json \
            --out-csv .tmp/directionality/maps.csv
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('.tmp/directionality/result.json').read_text())
          assert x['version']=='chapter2_orientation_transition_directionality_result_v1'
          assert x['h1_reproduction']['status']=='pass'
          assert x['exact_floor_rank']['n_maps']==126
          assert x['classification'] in {
            'bidirectional_reversible_regime_supported',
            'u_to_d_specific_directional_asymmetry',
            'bidirectional_directional_but_not_exceptional',
            'directional_tracking_not_resolved',
          }
          print(json.dumps(x,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chapter2-orientation-transition-directionality-v1
          path: .tmp/directionality/
          if-no-files-found: error
          retention-days: 90
