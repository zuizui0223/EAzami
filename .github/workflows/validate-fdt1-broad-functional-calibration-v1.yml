name: Validate FDT1 broad functional calibration v1

on:
  pull_request:
    paths:
      - "data/evidence/fdt1_broad_functional_calibration_seed_v1.csv"
      - "data/evidence/fdt1_broad_functional_calibration_summary_v1.json"
      - "data/evidence/fdt1_meta_estimand_registry_v1.csv"
      - "data/evidence/fdt1_orientation_net_fitness_extract_v1.csv"
      - "data/evidence/fdt1_orientation_net_fitness_two_study_meta_v1.json"
      - "analysis/summarize_fdt1_broad_functional_calibration_v1.py"
      - "analysis/run_fdt1_orientation_net_fitness_meta_v1.py"
      - "tests/test_fdt1_broad_functional_calibration_v1.py"
      - ".github/workflows/validate-fdt1-broad-functional-calibration-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Recompute frozen summaries
        run: |
          python analysis/summarize_fdt1_broad_functional_calibration_v1.py \
            --input data/evidence/fdt1_broad_functional_calibration_seed_v1.csv \
            --output /tmp/fdt1_summary.json
          python - <<'PY'
          import json
          frozen=json.load(open('data/evidence/fdt1_broad_functional_calibration_summary_v1.json'))
          recomputed=json.load(open('/tmp/fdt1_summary.json'))
          assert frozen == recomputed, (frozen, recomputed)
          PY
          python analysis/run_fdt1_orientation_net_fitness_meta_v1.py \
            --input data/evidence/fdt1_orientation_net_fitness_extract_v1.csv \
            --output /tmp/orientation_meta.json
          python - <<'PY'
          import json, math
          a=json.load(open('data/evidence/fdt1_orientation_net_fitness_two_study_meta_v1.json'))
          b=json.load(open('/tmp/orientation_meta.json'))
          assert a['k']==b['k']==2
          assert a['interpretation']==b['interpretation']
          assert a['claim_boundary']==b['claim_boundary']
          assert [x['study_id'] for x in a['effects']] == [x['study_id'] for x in b['effects']]
          def close(x,y): return math.isclose(float(x),float(y),rel_tol=1e-8,abs_tol=1e-10)
          for ea,eb in zip(a['effects'],b['effects']):
              for key in ['lnRR','se_lnRR','RR']:
                  assert close(ea[key],eb[key]), (key,ea[key],eb[key])
              assert all(close(x,y) for x,y in zip(ea['ci95_RR'],eb['ci95_RR']))
          for section in ['fixed_effect','random_effect_DL','heterogeneity']:
              for key,value in a[section].items():
                  if isinstance(value,list):
                      assert all(close(x,y) for x,y in zip(value,b[section][key]))
                  elif isinstance(value,(int,float)):
                      assert close(value,b[section][key]), (section,key,value,b[section][key])
                  else:
                      assert value==b[section][key]
          PY
      - name: Run unit tests
        run: python -m pytest -q tests/test_fdt1_broad_functional_calibration_v1.py
