name: Validate Japan radiation pre-tree trait-environment coupling

on:
  pull_request:
    paths:
      - "analysis/test_japan_radiation_pre_tree_trait_environment_coupling.py"
      - "tests/test_japan_radiation_pre_tree_trait_environment_coupling.py"
      - "data/evidence/japan_radiation_pre_tree_trait_environment_snapshot_v1.csv"
      - "data/evidence/japan_radiation_pre_tree_trait_environment_coupling_v1.json"
      - ".github/workflows/validate-japan-radiation-pre-tree-trait-environment-coupling.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy
      - name: Compile and test
        run: |
          python -m py_compile analysis/test_japan_radiation_pre_tree_trait_environment_coupling.py
          python -m unittest tests/test_japan_radiation_pre_tree_trait_environment_coupling.py -v
      - name: Rebuild 9999-permutation result
        run: |
          python analysis/test_japan_radiation_pre_tree_trait_environment_coupling.py \
            --snapshot data/evidence/japan_radiation_pre_tree_trait_environment_snapshot_v1.csv \
            --out /tmp/japan_radiation_pre_tree_trait_environment_coupling_v1.json \
            --permutations 9999 --seed 20260816
      - name: Compare semantic result
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          rebuilt=json.loads(Path('/tmp/japan_radiation_pre_tree_trait_environment_coupling_v1.json').read_text())
          frozen=json.loads(Path('data/evidence/japan_radiation_pre_tree_trait_environment_coupling_v1.json').read_text())

          def compare(a, b, path='root'):
              if isinstance(a, dict) and isinstance(b, dict):
                  assert set(a) == set(b), (path, set(a) ^ set(b))
                  for key in a:
                      compare(a[key], b[key], f'{path}.{key}')
              elif isinstance(a, list) and isinstance(b, list):
                  assert len(a) == len(b), (path, len(a), len(b))
                  for i, (x, y) in enumerate(zip(a, b)):
                      compare(x, y, f'{path}[{i}]')
              elif isinstance(a, (int, float)) and isinstance(b, (int, float)) and not isinstance(a, bool) and not isinstance(b, bool):
                  assert math.isclose(float(a), float(b), rel_tol=1e-12, abs_tol=1e-12), (path, a, b)
              else:
                  assert a == b, (path, a, b)

          compare(rebuilt, frozen)
          assert rebuilt['observed_spearman_rho'] < 0
          assert rebuilt['positive_coupling_permutation_p'] > 0.05
          assert rebuilt['leave_one_taxon_out_all_negative'] is True
          print(json.dumps(rebuilt,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: japan-radiation-pre-tree-trait-environment-coupling-${{ github.run_id }}
          path: data/evidence/japan_radiation_pre_tree_trait_environment_coupling_v1.json
          retention-days: 90
