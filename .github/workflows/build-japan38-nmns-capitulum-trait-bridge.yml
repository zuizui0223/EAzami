name: Build Japan-38 NMNS capitulum trait bridge

on:
  pull_request:
    paths:
      - "analysis/build_japan38_nmns_capitulum_trait_bridge.py"
      - "tests/test_build_japan38_nmns_capitulum_trait_bridge.py"
      - "data/evidence/moreyra2025_japan_38_membership_audit_2026-08-10.csv"
      - ".github/workflows/build-japan38-nmns-capitulum-trait-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pandas requests lxml
      - name: Compile and test
        run: |
          python -m py_compile analysis/build_japan38_nmns_capitulum_trait_bridge.py
          python -m unittest tests/test_build_japan38_nmns_capitulum_trait_bridge.py -v
      - name: Build authority trait bridge
        run: |
          python analysis/build_japan38_nmns_capitulum_trait_bridge.py \
            --japan38 data/evidence/moreyra2025_japan_38_membership_audit_2026-08-10.csv \
            --out-dir nmns_bridge
      - name: Validate conservative coverage
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          summary = json.loads(Path("nmns_bridge/japan38_nmns_capitulum_trait_bridge_v1.json").read_text())
          table = pd.read_csv("nmns_bridge/japan38_nmns_capitulum_trait_bridge_v1.csv")
          meta = json.loads(Path("nmns_bridge/nmns_source_metadata.json").read_text())
          assert summary["n_paper_concepts"] == 38
          assert len(table) == 38
          assert meta["n_source_rows"] >= 100
          assert summary["n_authority_matched_concepts"] >= 20
          assert summary["n_orientation_states_recovered"] >= 15
          assert table["paper_japan_member_id"].nunique() == 38
          # infraspecific paper concepts must never be silently matched to a broad species row
          bad = table[
              table["paper_normalized_concept"].str.contains(r"\bvar\.|\bsubsp\.|\bssp\.|\bf\.", regex=True)
              & table["authority_match_status"].eq("unique_binomial_authority_match")
          ]
          assert bad.empty
          print(summary)
          print(meta)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: japan38-nmns-capitulum-trait-bridge-${{ github.run_id }}
          path: nmns_bridge
          if-no-files-found: error
          retention-days: 90
