name: Audit Cirsium nipponicum public genome augmentation

on:
  pull_request:
    paths:
      - "analysis/audit_cirsium_nipponicum_public_genome_augmentation.py"
      - "tests/test_audit_cirsium_nipponicum_public_genome_augmentation.py"
      - ".github/workflows/audit-cirsium-nipponicum-public-genome-augmentation.yml"
  workflow_dispatch:

concurrency:
  group: nipponicum-public-genome-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit-public-article:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and unit test
        run: |
          python -m py_compile analysis/audit_cirsium_nipponicum_public_genome_augmentation.py
          python -m unittest tests/test_audit_cirsium_nipponicum_public_genome_augmentation.py -v
      - name: Recover cited public Figshare metadata
        run: |
          mkdir -p /tmp/nipponicum
          curl --fail --location --retry 3 \
            -H 'Accept: application/json' \
            'https://api.figshare.com/v2/articles/26927092' \
            -o /tmp/nipponicum/figshare_article_26927092.json
          test -s /tmp/nipponicum/figshare_article_26927092.json
      - name: Audit cited public item
        run: |
          python analysis/audit_cirsium_nipponicum_public_genome_augmentation.py \
            --figshare-json /tmp/nipponicum/figshare_article_26927092.json \
            --output-csv /tmp/nipponicum/public_file_manifest.csv \
            --summary /tmp/nipponicum/augmentation_summary.json \
            | tee /tmp/nipponicum/audit.log
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('/tmp/nipponicum/augmentation_summary.json').read_text())
          assert s['taxon']=='Cirsium nipponicum'
          assert s['bioproject']=='PRJNA1127082'
          assert s['figshare_article_id']==26927092
          assert s['file_count'] >= 1
          assert s['stable_public_file_count'] >= 1
          assert s['primary_294_panel_changed'] is False
          assert s['tree_tip_promotion_allowed'] is False
          print(json.dumps(s,indent=2))
          PY
      - name: Discover related public Figshare assets
        run: |
          curl --fail --location --retry 3 \
            -H 'Content-Type: application/json' \
            -X POST \
            --data '{"search_for":"nipponicum","limit":100,"order":"published_date","order_direction":"desc"}' \
            'https://api.figshare.com/v2/articles/search' \
            -o /tmp/nipponicum/figshare_nipponicum_search.json
          mkdir -p /tmp/nipponicum/related_items
          python - <<'PY' > /tmp/nipponicum/related_ids.txt
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/nipponicum/figshare_nipponicum_search.json').read_text())
          for row in rows:
              title=str(row.get('title','')).lower().replace(' ','')
              if 'cirsium' in title or 'c.nipponicum' in title:
                  print(row['id'])
          PY
          while IFS= read -r id; do
            test -n "$id" || continue
            curl --fail --location --retry 3 \
              -H 'Accept: application/json' \
              "https://api.figshare.com/v2/articles/$id" \
              -o "/tmp/nipponicum/related_items/article_${id}.json"
          done < /tmp/nipponicum/related_ids.txt
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path('/tmp/nipponicum/related_items')
          rows=[]
          for path in sorted(root.glob('article_*.json')):
              d=json.loads(path.read_text())
              for f in d.get('files',[]):
                  name=str(f.get('name',''))
                  low=name.lower()
                  payload=low
                  for suf in ('.gz','.bz2','.xz'):
                      if payload.endswith(suf): payload=payload[:-len(suf)]
                  annotation=payload.endswith(('.gff','.gff3','.gtf'))
                  fasta=payload.endswith(('.fa','.fasta','.fna','.ffn','.faa','.fas','.fsa','.cds'))
                  rows.append({
                    'article_id':d.get('id',''),'article_title':d.get('title',''),'article_doi':d.get('doi',''),
                    'file_id':f.get('id',''),'file_name':name,'size_bytes':f.get('size',''),
                    'download_url':f.get('download_url',''),'supplied_md5':f.get('supplied_md5',''),
                    'computed_md5':f.get('computed_md5',''),'fasta_like':str(fasta).lower(),
                    'annotation_only':str(annotation).lower()
                  })
          out=Path('/tmp/nipponicum/related_public_file_manifest.csv')
          fields=['article_id','article_title','article_doi','file_id','file_name','size_bytes','download_url','supplied_md5','computed_md5','fasta_like','annotation_only']
          with out.open('w',newline='',encoding='utf-8') as h:
              w=csv.DictWriter(h,fieldnames=fields);w.writeheader();w.writerows(rows)
          summary={
            'related_article_count':len({r['article_id'] for r in rows}),
            'related_file_count':len(rows),
            'fasta_like_file_count':sum(r['fasta_like']=='true' for r in rows),
            'annotation_only_file_count':sum(r['annotation_only']=='true' for r in rows),
            'article_ids':sorted({r['article_id'] for r in rows}),
            'file_names':[r['file_name'] for r in rows],
          }
          Path('/tmp/nipponicum/related_search_summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cirsium-nipponicum-public-genome-augmentation-${{ github.run_id }}
          path: /tmp/nipponicum
          if-no-files-found: warn
