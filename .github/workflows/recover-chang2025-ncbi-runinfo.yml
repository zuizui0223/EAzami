name: Recover Chang 2025 NCBI runinfo

on:
  pull_request:
    paths:
      - "analysis/recover_ncbi_project_runs.py"
      - "data/evidence/chang2025_nipponocirsium_accession_audit_2026-08-10.csv"
      - ".github/workflows/recover-chang2025-ncbi-runinfo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recover public BioProject run metadata
        env:
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          : > /tmp/no_focal_taxa.txt
          rm -rf /tmp/chang2025_ncbi
          python analysis/recover_ncbi_project_runs.py \
            --bioproject PRJNA1158676 \
            --focal-taxa /tmp/no_focal_taxa.txt \
            --outdir /tmp/chang2025_ncbi \
            --enrich-biosample
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path('/tmp/chang2025_ncbi')
          p=root/'PRJNA1158676_runinfo.csv'
          rows=list(csv.DictReader(p.open(encoding='utf-8-sig',newline='')))
          print('run_rows',len(rows))
          print('unique_runs',len({r['Run'] for r in rows}))
          print('unique_biosamples',len({r['BioSample'] for r in rows}))
          print('unique_scientific_names',len({r['ScientificName'] for r in rows}))
          for r in rows:
              print('RUN',r.get('Run'),r.get('BioSample'),r.get('ScientificName'),r.get('LibraryName'),r.get('SampleName'),r.get('geographic_location'))
          if not rows:
              raise SystemExit('No PRJNA1158676 public runs recovered')
          if len({r['Run'] for r in rows}) != len(rows):
              raise SystemExit('Duplicate run rows recovered')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chang2025-ncbi-runinfo-${{ github.run_id }}
          path: /tmp/chang2025_ncbi
          if-no-files-found: error
