name: Run Japan38 all-continuous phenotype history v1

on:
  pull_request:
    paths:
      - 'analysis/run_japan38_all_continuous_history_v1.py'
      - 'tests/test_japan38_all_continuous_history_v1.py'
      - 'docs/chapter2/TIME_AXIS_MAINLINE_V3.md'
      - 'docs/chapter2/META_SIM_DISPOSITION_V1.md'
      - 'data/evidence/chapter2_analysis_disposition_v1.csv'
      - '.github/workflows/run-japan38-all-continuous-history-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: japan38-all-continuous-history-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HYPOTHESIS_ID: H-CH2HIST1
      AZAMI_BRIDGE_COMMIT: 4e7992e63432704535623d11aa27ecc22cfc753a
      AZAMI_BRIDGE_PATH: data/evidence/eazami_handoff_compute/japan38_continuous_trait_bridge_v1.csv
      AZAMI_BRIDGE_SUMMARY_PATH: data/evidence/eazami_handoff_compute/japan38_continuous_trait_bridge_summary_v1.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'pandas>=2.2,<4' 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'biopython>=1.83,<2' pytest
      - name: Compile and unit-test analysis
        run: |
          python -m py_compile analysis/run_japan38_all_continuous_history_v1.py
          python -m pytest -q tests/test_japan38_all_continuous_history_v1.py
      - name: Download pinned all-continuous bridge from Azami compute branch
        run: |
          set -euo pipefail
          mkdir -p source output
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 3 \
            "https://raw.githubusercontent.com/zuizui0223/azami/${AZAMI_BRIDGE_COMMIT}/${AZAMI_BRIDGE_PATH}" \
            --output source/japan38_continuous_trait_bridge_v1.csv
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 3 \
            "https://raw.githubusercontent.com/zuizui0223/azami/${AZAMI_BRIDGE_COMMIT}/${AZAMI_BRIDGE_SUMMARY_PATH}" \
            --output source/japan38_continuous_trait_bridge_summary_v1.json
          python - <<'PY'
          import json
          import pandas as pd
          x=json.load(open('source/japan38_continuous_trait_bridge_summary_v1.json'))
          b=pd.read_csv('source/japan38_continuous_trait_bridge_v1.csv')
          assert x['eligible_endpoints']==18
          assert x['exact_japan38_concepts_with_any_continuous_trait']==14
          assert b['endpoint_id'].nunique()==18
          assert b['paper_japan_member_id'].nunique()==14
          PY
      - name: Run phenotype × evolutionary-history analysis
        run: |
          python analysis/run_japan38_all_continuous_history_v1.py \
            --bridge source/japan38_continuous_trait_bridge_v1.csv \
            --tree data/evidence/japan38_comp1061_primary_tree_v1.nwk \
            --concept-map data/evidence/japan38_comp1061_concept_map_v1.csv \
            --out-dir output \
            --permutations 10000 \
            --seed 20260827
      - name: Validate scope and claim boundaries
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from decimal import Decimal
          from pathlib import Path
          x=json.loads(Path('output/japan38_all_continuous_history_summary_v1.json').read_text())
          u=pd.read_csv('output/continuous_primary_phylogenetic_structure_v1.csv')
          c=pd.read_csv('output/candidate_continuous_history_coverage.csv')
          assert x['primary_threshold_n_observations']==2
          assert x['high_depth_threshold_n_observations']==5
          assert set(x['primary_units_executed_n2'])=={
            'orientation_image_vertical_angle','corolla_lab_lightness','corolla_lab_chroma','corolla_hue',
            'capitulum_outline_aspect_ratio','capitulum_outline_circularity',
            'capitulum_outline_solidity','capitulum_width_profile_cv'
          }
          assert set(x['primary_units_executed_n5'])==set(x['primary_units_executed_n2'])
          assert len(u[u.threshold==2])==8
          assert len(u[u.threshold==5])==8
          assert c['n2'].max() <= 2
          assert x['candidate_endpoint_decision']=='coverage_audit_only_not_promoted_to_phylogenetic_history'
          assert x['tree_semantics']=='substitutions/site; not absolute time'
          assert x['branch_change_shared_lability']['common_concepts'] >= 6
          assert all(len(Decimal(token).normalize().as_tuple().digits) <= 10
                     for token in Path('output/continuous_primary_branch_change_magnitudes_v1.csv').read_text().splitlines()[1].split(',')[3:])
          print(json.dumps(x,indent=2))
          PY
      - name: Record provenance and source bridge
        run: |
          cp source/japan38_continuous_trait_bridge_v1.csv output/source_japan38_continuous_trait_bridge_v1.csv
          cp source/japan38_continuous_trait_bridge_summary_v1.json output/source_japan38_continuous_trait_bridge_summary_v1.json
          printf '%s\n' "$AZAMI_BRIDGE_COMMIT" > output/azami_bridge_commit.txt
          printf '%s\n' "$GITHUB_SHA" > output/eazami_analysis_trigger_sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: japan38-all-continuous-history-${{ github.run_id }}
          path: output
          if-no-files-found: error
          retention-days: 90
      - name: Persist canonical compute outputs on PR branch
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          dest=data/evidence/chapter2_time_axis_compute
          mkdir -p "$dest"
          cp output/continuous_primary_phylogenetic_structure_v1.csv "$dest/"
          cp output/candidate_continuous_history_coverage.csv "$dest/"
          cp output/continuous_primary_branch_change_magnitudes_v1.csv "$dest/"
          cp output/continuous_primary_branch_change_coupling_v1.csv "$dest/"
          cp output/continuous_primary_branch_change_summary_v1.json "$dest/"
          cp output/japan38_all_continuous_history_summary_v1.json "$dest/"
          cp output/source_japan38_continuous_trait_bridge_v1.csv "$dest/"
          cp output/source_japan38_continuous_trait_bridge_summary_v1.json "$dest/"
          cp output/azami_bridge_commit.txt "$dest/"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$dest"
          if git diff --cached --quiet; then
            echo 'No compute outputs changed.'
            exit 0
          fi
          git commit -m 'Capture Japan38 all-continuous history results'
          git push origin HEAD:${{ github.head_ref }}
