name: Run Japan38 TA01 chronos sensitivity v1
on:
  push:
    branches: [main]
    paths:
      - "analysis/run_japan38_ta01_chronos_sensitivity_v1.R"
      - "data/evidence/japan38_comp1061_primary_tree_v1.nwk"
      - ".github/workflows/run-japan38-ta01-chronos-sensitivity-v1.yml"
  pull_request:
    paths:
      - "analysis/run_japan38_ta01_chronos_sensitivity_v1.R"
      - "data/evidence/japan38_comp1061_primary_tree_v1.nwk"
      - ".github/workflows/run-japan38-ta01-chronos-sensitivity-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chronos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - run: Rscript -e 'install.packages("ape", repos="https://cloud.r-project.org")'
      - run: Rscript analysis/run_japan38_ta01_chronos_sensitivity_v1.R --tree data/evidence/japan38_comp1061_primary_tree_v1.nwk --outdir results/japan38_ta01_chronos_v1
      - uses: actions/upload-artifact@v4
        with:
          name: japan38-ta01-chronos-${{ github.run_id }}
          path: results/japan38_ta01_chronos_v1
          if-no-files-found: error
