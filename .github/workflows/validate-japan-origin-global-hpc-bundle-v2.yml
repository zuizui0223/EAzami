name: Validate Japan-origin global HPC bundle v2

on:
  pull_request:
    paths:
      - "analysis/build_japan_origin_global_public_panel_v2.py"
      - "analysis/materialize_frozen_moreyra_reconciliation.py"
      - "analysis/build_japan_origin_global_hpc_bundle_v2.py"
      - "analysis/japan_origin_global_hpc_primitives.py"
      - "analysis/summarize_japan_origin_global_comp1061_qc.py"
      - "analysis/prepare_japan_origin_global_comp1061_tree_inputs.py"
      - "analysis/validate_japan_origin_global_tree.py"
      - "data/evidence/japan_origin_global_public_panel_contract_v2.json"
      - "data/evidence/chang2025_public_run_manifest_v1.csv"
      - "data/evidence/chang2026_public_run_manifest_v1.csv"
      - "data/evidence/moreyra2025_japan_38_membership_audit_2026-08-10.csv"
      - "data/evidence/moreyra2025_cirsium_reconciliation_v1/**"
      - ".github/workflows/validate-japan-origin-global-hpc-bundle-v2.yml"
  workflow_dispatch:

concurrency:
  group: japan-origin-global-hpc-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-real-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile builders
        run: |
          python -m py_compile analysis/build_japan_origin_global_public_panel_v2.py
          python -m py_compile analysis/materialize_frozen_moreyra_reconciliation.py
          python -m py_compile analysis/japan_origin_global_hpc_primitives.py
          python -m py_compile analysis/build_japan_origin_global_hpc_bundle_v2.py
          python -m unittest tests/test_build_japan_origin_global_public_panel_v2.py -v
      - name: Materialize durable frozen Moreyra reconciliation
        run: |
          mkdir -p /tmp/moreyra/moreyra_sample_audit_output /tmp/panel /tmp/bundle
          python analysis/materialize_frozen_moreyra_reconciliation.py \
            --output /tmp/moreyra/moreyra_sample_audit_output/moreyra2025_all_sample_reconciliation.csv
          echo "cf3af71a1a77eee5bd177cef9cf8106b749b949eaacc0ad82bbb331978084505  /tmp/moreyra/moreyra_sample_audit_output/moreyra2025_all_sample_reconciliation.csv" | sha256sum -c -
      - name: Build real 294-tip panel and execution bundle
        run: |
          python analysis/build_japan_origin_global_public_panel_v2.py \
            --moreyra-reconciliation /tmp/moreyra/moreyra_sample_audit_output/moreyra2025_all_sample_reconciliation.csv \
            --outdir /tmp/panel
          python analysis/build_japan_origin_global_hpc_bundle_v2.py \
            --panel /tmp/panel/japan_origin_global_public_panel_v2.csv \
            --outdir /tmp/bundle
      - name: Validate generated bundle offline
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          b=Path('/tmp/bundle')
          m=json.loads((b/'execution_manifest.json').read_text())
          rows=list(csv.DictReader((b/'sample_manifest.csv').open()))
          species=list(csv.DictReader((b/'astral_species_map.csv').open()))
          assert m['biological_samples']==294
          assert m['public_runs']==295
          assert m['source_preserving_taxon_labels']==270
          assert m['cross_paper_read_duplicates_removed']==8
          assert len(rows)==294 and len({r['tip_id'] for r in rows})==294
          runs=[x for r in rows for x in r['run_accessions'].split('|') if x]
          assert len(runs)==295 and len(set(runs))==295
          assert len(species)==270
          assert sum(r['analysis_taxon_label']=='Cirsium brevicaule' for r in rows)==3
          assert sum(r['analysis_taxon_label']=='Cirsium irumtiense' for r in rows)==3
          assert sum(r['shared_cross_paper_sample']=='true' for r in rows)==8
          fetch=(b/'01_fetch_trim_slurm.sh').read_text()
          bwa=(b/'02_hybpiper_bwa_slurm.sh').read_text()
          treeprep=(b/'04_prepare_tree_inputs_slurm.sh').read_text()
          astral=(b/'08_astral_species_tree_slurm.sh').read_text()
          submit=(b/'submit_tree_chain.sh').read_text()
          env=(b/'env.yml').read_text()
          assert '--array=0-293%20' in fetch and '0-301' not in fetch
          assert '--array=0-293%16' in bwa and '0-301' not in bwa
          assert 'results/japan_origin_global_v2' in fetch
          assert '302 public biological samples / 303 runs' not in fetch
          assert '$BUNDLE_DIR/helpers/summarize_japan_origin_global_comp1061_qc_v2.py' in treeprep
          assert '$BUNDLE_DIR/helpers/prepare_japan_origin_global_comp1061_tree_inputs_v2.py' in treeprep
          assert 'astral -Xmx90G' in astral
          assert '08_astral_species_tree_slurm.sh' in submit and '09_accept_trees_slurm.sh' in submit
          assert 'astral-tree=5.7.8' in env
          assert (b/'helpers/validate_japan_origin_global_tree_v2.py').is_file()
          assert (b/'helpers/validate_japan_origin_astral_tree_v2.py').is_file()
          print(json.dumps(m,indent=2))
          PY
          python -m py_compile /tmp/bundle/helpers/*.py
          for f in /tmp/bundle/*.sh; do bash -n "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: japan-origin-global-hpc-bundle-v2-${{ github.run_id }}
          path: |
            /tmp/panel
            /tmp/bundle
          if-no-files-found: error
