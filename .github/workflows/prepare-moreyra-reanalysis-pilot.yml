name: Prepare Moreyra East Asia reanalysis pilot

on:
  pull_request:
    paths:
      - "analysis/recover_moreyra_author_repository.py"
      - "analysis/summarize_moreyra_locus_filter.py"
      - "analysis/export_moreyra_locus_manifests.py"
      - "analysis/build_moreyra_reanalysis_pilot.py"
      - "tests/test_recover_moreyra_author_repository.py"
      - "tests/test_summarize_moreyra_locus_filter.py"
      - "tests/test_export_moreyra_locus_manifests.py"
      - "tests/test_build_moreyra_reanalysis_pilot.py"
      - "data/evidence/moreyra2025_east_ne_asia_sample_audit_*.csv"
      - ".github/workflows/prepare-moreyra-reanalysis-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and run offline tests
        run: |
          python -m py_compile \
            analysis/recover_moreyra_author_repository.py \
            analysis/summarize_moreyra_locus_filter.py \
            analysis/export_moreyra_locus_manifests.py \
            analysis/build_moreyra_reanalysis_pilot.py
          python -m unittest \
            tests/test_recover_moreyra_author_repository.py \
            tests/test_summarize_moreyra_locus_filter.py \
            tests/test_export_moreyra_locus_manifests.py \
            tests/test_build_moreyra_reanalysis_pilot.py \
            -v

      - name: Recover public author-repository matrices
        run: |
          python analysis/recover_moreyra_author_repository.py \
            --outdir data/evidence/generated/moreyra_author_repository \
            --force
          python analysis/summarize_moreyra_locus_filter.py \
            --audit-dir data/evidence/generated/moreyra_author_repository

      - name: Export reproducible public locus manifests
        run: |
          python analysis/export_moreyra_locus_manifests.py \
            --input data/evidence/generated/moreyra_author_repository/paralog_locus_filter_reconstruction.csv \
            --outdir data/evidence/generated/moreyra_author_repository/locus_sets

      - name: Build deterministic East Asia sample/run pilot
        run: |
          python analysis/build_moreyra_reanalysis_pilot.py \
            --input data/evidence/moreyra2025_east_ne_asia_sample_audit_2026-08-10.csv \
            --outdir data/evidence/generated/moreyra_reanalysis_pilot

      - name: Validate pilot contract
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          locus_dir = Path("data/evidence/generated/moreyra_author_repository/locus_sets")
          pilot_dir = Path("data/evidence/generated/moreyra_reanalysis_pilot")

          with (locus_dir / "locus_set_manifest.csv").open(
              encoding="utf-8", newline=""
          ) as handle:
              locus_rows = list(csv.DictReader(handle))
          locus_counts = {
              row["set_key"]: int(row["locus_count"]) for row in locus_rows
          }
          expected_locus_counts = {
              "public_1061": 1061,
              "reproducible_531": 531,
              "conservative_241": 241,
              "manual_review_290": 290,
          }
          if locus_counts != expected_locus_counts:
              raise SystemExit(
                  f"Unexpected exported locus counts: {locus_counts}"
              )

          with (pilot_dir / "moreyra_east_asia_12_sample_pilot.csv").open(
              encoding="utf-8", newline=""
          ) as handle:
              samples = list(csv.DictReader(handle))
          summary = json.loads(
              (pilot_dir / "pilot_summary.json").read_text(encoding="utf-8")
          )
          runs = [
              line.strip()
              for line in (pilot_dir / "moreyra_east_asia_12_sample_runs.txt")
              .read_text(encoding="utf-8")
              .splitlines()
              if line.strip()
          ]

          expected_regions = {
              "China": 3,
              "Japan": 4,
              "Mongolia": 1,
              "Russian_Far_East": 2,
              "Russian_Inner_NE_Asia": 2,
          }
          expected_tree_codes = {
              "Cirsium domonii",
              "Cirsium dipsacolepis",
              "Cirsium lineare",
              "Cirsium yezoense",
              "Cirsium argyracanthum",
              "Cirsium fanjingshanense",
              "Cirsium fargesii",
              "Cirsium kamtschaticum",
              "Cirsium coryletorum",
              "Cirsium pendulum",
              "Cirsium serratuloides",
              "Cirsium vlassovianum",
          }

          print(f"pilot_samples={len(samples)}")
          print(f"pilot_runs={len(runs)}")
          print(f"pilot_regions={summary['region_counts']}")
          print(
              "name_reconciliation_samples="
              + str(len(summary["samples_requiring_name_reconciliation"]))
          )
          print(f"locus_sets={locus_counts}")

          if len(samples) != 12 or summary["biological_samples"] != 12:
              raise SystemExit("Expected 12 biological pilot samples")
          if len(runs) != 12 or len(set(runs)) != 12:
              raise SystemExit("Expected 12 unique public SRA runs")
          if summary["region_counts"] != expected_regions:
              raise SystemExit(
                  f"Unexpected regional composition: {summary['region_counts']}"
              )
          if {row["tree_code"] for row in samples} != expected_tree_codes:
              raise SystemExit("Pilot tree-code membership changed")
          if len(summary["samples_requiring_name_reconciliation"]) != 1:
              raise SystemExit("Expected one deliberate name-reconciliation sample")
          if not any(
              row["tree_code"] == "Cirsium coryletorum"
              and row["name_reconciliation_required"] == "true"
              for row in samples
          ):
              raise SystemExit("C. coryletorum reconciliation test is missing")
          if summary["raw_reads_downloaded_in_ci"]:
              raise SystemExit("Pull-request CI must not download the raw-read cohort")
          if summary["full_published_analysis_reproduced"]:
              raise SystemExit("Pilot must not claim full published-analysis reproduction")
          PY

      - name: Upload reanalysis pilot package
        uses: actions/upload-artifact@v4
        with:
          name: moreyra-east-asia-reanalysis-pilot-${{ github.run_id }}
          path: |
            data/evidence/generated/moreyra_author_repository/source_provenance.csv
            data/evidence/generated/moreyra_author_repository/locus_filter_reconstruction_summary.json
            data/evidence/generated/moreyra_author_repository/locus_sets/
            data/evidence/generated/moreyra_reanalysis_pilot/
          if-no-files-found: error
          retention-days: 90
