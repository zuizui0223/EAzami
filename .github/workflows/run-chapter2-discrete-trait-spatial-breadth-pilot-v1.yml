name: Run Chapter 2 discrete-trait spatial breadth pilot v1

on:
  pull_request:
    paths:
      - "analysis/run_chapter2_discrete_trait_spatial_breadth_pilot_v1.py"
      - "data/evidence/japan38_nmns_capitulum_trait_seed_v1.csv"
      - "data/evidence/japan38_nmns_capitulum_trait_seed_extension_v2.csv"
      - "data/evidence/chapter2_space_breadth_time_depth_contract_v1.json"
      - ".github/workflows/run-chapter2-discrete-trait-spatial-breadth-pilot-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests
          python -m py_compile analysis/run_chapter2_discrete_trait_spatial_breadth_pilot_v1.py
      - name: Run environment-free spatial breadth pilot
        run: |
          mkdir -p /tmp/ch2_space
          python analysis/run_chapter2_discrete_trait_spatial_breadth_pilot_v1.py \
            --seed data/evidence/japan38_nmns_capitulum_trait_seed_v1.csv \
            --extension data/evidence/japan38_nmns_capitulum_trait_seed_extension_v2.csv \
            --min-thinned-occurrences 3 \
            --thin-degrees 0.1 \
            --permutations 9999 \
            --out-json /tmp/ch2_space/chapter2_discrete_trait_spatial_breadth_pilot_v1.json \
            --out-taxa /tmp/ch2_space/chapter2_discrete_trait_spatial_breadth_taxa_v1.csv \
            --out-traits /tmp/ch2_space/chapter2_discrete_trait_spatial_breadth_traits_v1.csv \
            | tee /tmp/ch2_space/run_summary.log
      - name: Validate output boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/ch2_space/chapter2_discrete_trait_spatial_breadth_pilot_v1.json').read_text())
          assert x['scope'].startswith('internal environment-free')
          assert {r['trait'] for r in x['traits']} == {'orientation','phyllary','stickiness'}
          assert x['minimum_thinned_occurrences_per_taxon'] == 3
          assert x['permutations'] == 9999
          assert any('need not appear in the final manuscript' in s for s in x['claim_boundary'])
          print(json.dumps(x,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chapter2-discrete-spatial-breadth-${{ github.run_id }}
          path: /tmp/ch2_space/
          if-no-files-found: error
          retention-days: 90
