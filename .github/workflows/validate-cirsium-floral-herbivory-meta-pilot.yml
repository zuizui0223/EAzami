name: Validate Cirsium floral-herbivory quantitative meta pilot

on:
  pull_request:
    paths:
      - "analysis/meta_analyze_cirsium_floral_herbivory.py"
      - "tests/test_meta_analyze_cirsium_floral_herbivory.py"
      - "data/evidence/cirsium_floral_herbivory_experimental_effects_v1.csv"
      - "data/evidence/cirsium_floral_herbivory_meta_pilot_v1.json"
      - "docs/AIM2_CIRSIUM_FLORAL_HERBIVORY_META_PILOT_2026-08-19.md"
      - ".github/workflows/validate-cirsium-floral-herbivory-meta-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild quantitative pilot and run tests
        run: |
          python -m py_compile analysis/meta_analyze_cirsium_floral_herbivory.py
          python -m unittest tests/test_meta_analyze_cirsium_floral_herbivory.py -v
          python analysis/meta_analyze_cirsium_floral_herbivory.py \
            --input data/evidence/cirsium_floral_herbivory_experimental_effects_v1.csv \
            --output /tmp/cirsium_floral_herbivory_meta_pilot_v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          obs=json.loads(Path('/tmp/cirsium_floral_herbivory_meta_pilot_v1.json').read_text())
          frozen=json.loads(Path('data/evidence/cirsium_floral_herbivory_meta_pilot_v1.json').read_text())
          assert obs==frozen
          assert obs['coverage']['independent_study_clusters']==4
          assert obs['random_effects']['pooled_r'] > 0
          assert obs['random_effects']['ci95_r'][0] > 0
          assert obs['publication_gate']['status']=='pilot_quantitative_meta_not_publication_grade'
          assert all(x['pooled_r'] > 0 for x in obs['leave_one_study_out'])
          print('cirsium_quantitative_meta_pilot_valid=true')
          print('pooled_r=', obs['random_effects']['pooled_r'])
          print('I2_percent=', obs['random_effects']['I2_percent'])
          PY
