name: Retry frozen saff-root Comp1061 IQ-TREE

on:
  pull_request:
    paths:
      - ".github/workflows/retry-comp1061-saff-root-iqtree.yml"
      - "data/evidence/full20_comp1061_saff_root_153_loci_v1.txt"
      - "analysis/validate_colour_atlas_branch_length_tree.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: retry-comp1061-saff-root-iqtree-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_FAILED_RUN_ID: "32575064385"
  SOURCE_FAILED_ARTIFACT: "comp1061-saff-root-primary-tree-32575064385"
  SOURCE_FAILED_ARTIFACT_DIGEST: "sha256:d6dce360848c92fb4cadea83ce20add23dc4d8bddb166ef21bb5ca650b715afa"
  SOURCE_FULL20_RUN_ID: "32555473197"
  SOURCE_PANEL_ARTIFACT: "comp1061-panel-inputs-32555473197"
  FROZEN_TREE_LOCI: "data/evidence/full20_comp1061_saff_root_153_loci_v1.txt"
  FROZEN_TREE_LOCI_SHA256: "1106051eca8bfa699f16e05d92024573cb358d7dbd151b89768e76c3d56cde82"

jobs:
  retry-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned IQ-TREE
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: comp1061-iqtree
          create-args: >-
            python=3.11
            iqtree=3.1.3
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          init-shell: none
          generate-run-shell: true
          cache-environment: true
          cache-downloads: true
          post-cleanup: all

      - name: Download immutable successful pre-tree artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_FAILED_ARTIFACT }}
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_FAILED_RUN_ID }}

      - name: Download frozen panel metadata
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_PANEL_ARTIFACT }}
          path: panel_source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_FULL20_RUN_ID }}

      - name: Verify immutable pre-tree gates before retry
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          cmp tree_inputs/eligible_loci.txt "$FROZEN_TREE_LOCI"
          test "$(grep -cve '^[[:space:]]*$' "$FROZEN_TREE_LOCI")" -eq 153
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          loci=Path(os.environ['FROZEN_TREE_LOCI'])
          assert hashlib.sha256(loci.read_bytes()).hexdigest() == os.environ['FROZEN_TREE_LOCI_SHA256']
          aln=json.load(open('tree/alignment_qc/alignment_qc_summary.json'))
          concat=json.load(open('tree/concat/concat_summary.json'))
          assert aln['alignment_qc_passed'] is True
          assert aln['passed_loci'] == 153 and aln['failed_loci'] == 0
          assert aln['posthoc_signal_filtering_applied'] is False
          assert concat['loci'] == 153
          assert concat['tree_tip_count'] == 21
          assert concat['root_outgroups'] == ['OUTGROUP_saff']
          assert concat['reference_tips'] == ['OUTGROUP_saff']
          assert Path('tree/concat/concat.fasta').is_file()
          PY

      - name: Resolve IQ-TREE 3 executable and infer primary tree
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          IQTREE_BIN=""
          for candidate in iqtree3 iqtree iqtree2; do
            if command -v "$candidate" >/dev/null 2>&1; then
              IQTREE_BIN="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$IQTREE_BIN"
          VERSION="$($IQTREE_BIN --version 2>&1 | head -1)"
          printf 'resolved_iqtree=%s\nversion=%s\n' "$IQTREE_BIN" "$VERSION" | tee tree/iqtree_retry_tool.txt
          printf '%s\n' "$VERSION" | grep -Eq 'IQ-TREE.*3\.1\.3|version 3\.1\.3|Version 3\.1\.3'
          "$IQTREE_BIN" \
            -s tree/concat/concat.fasta \
            -m MFP \
            -B 1000 \
            -alrt 1000 \
            -T AUTO \
            -o OUTGROUP_saff \
            --prefix tree/concat/colour_rate_comp1061_concat
          test -s tree/concat/colour_rate_comp1061_concat.treefile

      - name: Build provenance and apply tree acceptance gate
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          PRIMARY_RUNS="panel_source/panel_bundle/primary_runs.csv"
          test -s "$PRIMARY_RUNS"
          python - <<'PY'
          import csv, hashlib, json, os
          from pathlib import Path
          tree=Path('tree/concat/colour_rate_comp1061_concat.treefile')
          primary=Path('panel_source/panel_bundle/primary_runs.csv')
          rows=list(csv.DictReader(primary.open(encoding='utf-8-sig')))
          assert len(rows) == 20
          with open('tree/tip_map.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=['tree_tip','accepted_taxon','mapping_status'])
              w.writeheader()
              w.writerows({'tree_tip':r['tip_id'],'accepted_taxon':r['accepted_taxon'],'mapping_status':'exact'} for r in rows)
          tree_sha=hashlib.sha256(tree.read_bytes()).hexdigest()
          tool=Path('tree/iqtree_retry_tool.txt').read_text().strip().replace('\n','; ')
          prov={
              'tree_route':'compatibility_reanalysis',
              'tree_sha256':tree_sha,
              'analysis_name':'EAzami 20-tip frozen-153 Comp1061 Carthamus-rooted concatenated ML tree',
              'branch_length_interpretation':'IQ-TREE maximum-likelihood substitutions per site on the concatenated frozen 153-locus coding-sequence alignment',
              'rooting_definition':'IQ-TREE rooted using sole retained OUTGROUP_saff (Carthamus, Cardueae); lettuce and sunflower were audited upstream but excluded from tree inference',
              'required_outgroup_tips':['OUTGROUP_saff'],
              'required_reference_tips':['OUTGROUP_saff'],
              'support_metric_definition':'IQ-TREE ultrafast bootstrap 1000 plus SH-aLRT 1000 on the concatenated matrix',
              'source_or_pipeline_provenance':f"full20 run {os.environ['SOURCE_FULL20_RUN_ID']}; immutable pre-tree artifact run {os.environ['SOURCE_FAILED_RUN_ID']} digest {os.environ['SOURCE_FAILED_ARTIFACT_DIGEST']}; frozen 153 locus SHA256 {os.environ['FROZEN_TREE_LOCI_SHA256']}; alignment structural QC 153/153 PASS; IQ-TREE tool {tool}",
              'topology_uncertainty_status':'single_tree_with_explicit_limitation'
          }
          Path('tree/tree_provenance.json').write_text(json.dumps(prov,indent=2)+'\n')
          PY
          python analysis/validate_colour_atlas_branch_length_tree.py \
            --tree tree/concat/colour_rate_comp1061_concat.treefile \
            --atlas data/evidence/cirsium_flower_colour_atlas_v0_3.csv \
            --tip-map tree/tip_map.csv \
            --provenance tree/tree_provenance.json \
            --output tree/tree_acceptance.json
          python - <<'PY'
          import json
          from pathlib import Path
          accept=json.load(open('tree/tree_acceptance.json'))
          aln=json.load(open('tree/alignment_qc/alignment_qc_summary.json'))
          concat=json.load(open('tree/concat/concat_summary.json'))
          assert accept['tree_gate_ready'] is True
          assert accept['tree_tip_count'] == 21
          assert accept['required_outgroup_tips'] == ['OUTGROUP_saff']
          assert accept['required_reference_tips'] == ['OUTGROUP_saff']
          summary={
              'contract_version':'full20_comp1061_primary_tree_execution_v1',
              'source_full20_run_id':32555473197,
              'source_pre_tree_run_id':32575064385,
              'frozen_tree_loci':153,
              'alignment_qc':aln,
              'concatenation':concat,
              'tree_acceptance':accept,
              'primary_branch_length_tree_completed':True,
              'topology_sensitivity_completed':False,
              'rate_fit_execution_allowed':False,
              'next_gate':'topology/gene-tree concordance sensitivity before any flower-colour Mk fitting',
              'claim_limit':'This artifact establishes one accepted 21-tip Carthamus-rooted concatenated branch-length tree. Rate fitting remains blocked until topology sensitivity is completed.'
          }
          Path('tree/tree_execution_summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          PY

      - name: Upload accepted primary tree evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comp1061-saff-root-primary-tree-retry-${{ github.run_id }}
          path: |
            current_qc_check/current_qc_summary.json
            tree_inputs/tree_input_summary.json
            tree_inputs/locus_manifest.csv
            tree_inputs/eligible_loci.txt
            tree/alignment_qc
            tree/concat/concat.fasta
            tree/concat/partitions.csv
            tree/concat/concat_summary.json
            tree/concat/colour_rate_comp1061_concat.*
            tree/iqtree_retry_tool.txt
            tree/tip_map.csv
            tree/tree_provenance.json
            tree/tree_acceptance.json
            tree/tree_execution_summary.json
          if-no-files-found: warn
          retention-days: 30
