name: Validate JPN38 iNaturalist GBIF source audit v1

on:
  pull_request:
    paths:
      - "analysis/audit_jpn38_inat_gbif_japan_sources_v1.py"
      - "tests/test_jpn38_inat_gbif_japan_sources_v1.py"
      - ".github/workflows/validate-jpn38-inat-gbif-source-audit-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-jpn38-inat-gbif-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and unit test
        run: |
          python -m py_compile analysis/audit_jpn38_inat_gbif_japan_sources_v1.py
          python -m unittest tests/test_jpn38_inat_gbif_japan_sources_v1.py -v
      - name: Audit live iNaturalist and GBIF metadata
        run: |
          set -euo pipefail
          mkdir -p result
          python analysis/audit_jpn38_inat_gbif_japan_sources_v1.py \
            --csv-output result/jpn38_inat_gbif_japan_source_audit_v1.csv \
            --json-output result/jpn38_inat_gbif_japan_source_audit_v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('result/jpn38_inat_gbif_japan_source_audit_v1.json').read_text())
          assert x['contract_version']=='jpn38_inat_gbif_japan_source_audit_v1'
          assert set(x['sources'])=={'iNaturalist','GBIF'}
          for key in [
            'combined_media_rows','cross_source_unique_open_reusable_records',
            'cross_source_open_reusable_specimen_records','cross_source_open_reusable_live_records',
            'conservative_independent_open_reusable_live_records',
            'conservative_independent_open_reusable_live_locality_cells_0_05deg',
            'license_blocked_noncommercial_independent_live_records',
            'license_blocked_noncommercial_independent_live_locality_cells_0_05deg',
          ]:
              assert x[key] >= 0, (key,x[key])
          assert isinstance(x['automated_measurement_candidates'], list)
          assert isinstance(x['permission_or_license_change_candidates'], list)
          if x['conservative_independent_open_reusable_live_records'] > 0:
              assert x['automated_measurement_candidates']
              for row in x['automated_measurement_candidates']:
                  assert row['media_url']
                  assert row['media_license']
                  assert row['basis_of_record'] in {'HUMAN_OBSERVATION','OBSERVATION','MACHINE_OBSERVATION'}
          if x['license_blocked_noncommercial_independent_live_records'] > 0:
              assert x['permission_or_license_change_candidates']
              for row in x['permission_or_license_change_candidates']:
                  assert row['media_license_class']=='noncommercial_only'
                  assert row['basis_of_record'] in {'HUMAN_OBSERVATION','OBSERVATION','MACHINE_OBSERVATION'}
          print(json.dumps(x,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jpn38-inat-gbif-source-audit-${{ github.run_id }}
          path: |
            result/jpn38_inat_gbif_japan_source_audit_v1.csv
            result/jpn38_inat_gbif_japan_source_audit_v1.json
          if-no-files-found: error
          retention-days: 90
