name: Validate FDT1 targeted search seed

on:
  pull_request:
    paths:
      - "data/evidence/fdt1_targeted_literature_screen_seed_v1.csv"
      - "docs/FDT1_TARGETED_SYSTEMATIC_REVIEW_PROTOCOL_2026-08-24.md"
      - "tests/test_fdt1_targeted_literature_screen_seed_v1.py"
      - ".github/workflows/validate-fdt1-targeted-search-v1.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_fdt1_targeted_literature_screen_seed_v1.py
