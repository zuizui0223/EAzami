name: Validate FDT1 targeted search seed

on:
  pull_request:
    paths:
      - "data/evidence/fdt1_targeted_literature_screen_seed_v1.csv"
      - "data/evidence/fdt1_tierA_effect_extraction_seed_v1.csv"
      - "analysis/summarize_fdt1_tierA_effect_extraction_seed_v1.py"
      - "docs/FDT1_TARGETED_SYSTEMATIC_REVIEW_PROTOCOL_2026-08-24.md"
      - "tests/test_fdt1_targeted_literature_screen_seed_v1.py"
      - "tests/test_summarize_fdt1_tierA_effect_extraction_seed_v1.py"
      - ".github/workflows/validate-fdt1-targeted-search-v1.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Summarize first Tier-A exact effects
        run: |
          python analysis/summarize_fdt1_tierA_effect_extraction_seed_v1.py --output /tmp/fdt1-tierA-effect-extraction-seed-v1.json
          cat /tmp/fdt1-tierA-effect-extraction-seed-v1.json
      - name: Validate targeted review seed and Tier-A extractions
        run: |
          python -m pytest -q tests/test_fdt1_targeted_literature_screen_seed_v1.py
          python -m pytest -q tests/test_summarize_fdt1_tierA_effect_extraction_seed_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: fdt1-targeted-review-tierA-v1
          path: /tmp/fdt1-tierA-effect-extraction-seed-v1.json
