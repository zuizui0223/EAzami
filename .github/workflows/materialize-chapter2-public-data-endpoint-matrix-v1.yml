name: Materialize Chapter 2 public-data endpoint matrix v1

on:
  pull_request:
    paths:
      - "analysis/build_chapter2_public_data_endpoint_matrix_v1.py"
      - ".github/workflows/materialize-chapter2-public-data-endpoint-matrix-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ch2-public-data-endpoint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build endpoint matrix
        run: |
          set -euo pipefail
          python -m py_compile analysis/build_chapter2_public_data_endpoint_matrix_v1.py
          python analysis/build_chapter2_public_data_endpoint_matrix_v1.py \
            --out-csv data/evidence/chapter2_public_data_endpoint_matrix_v1.csv \
            --out-json data/evidence/chapter2_public_data_endpoint_matrix_v1.json \
            --out-md docs/chapter2/PUBLIC_DATA_ENDPOINT_MATRIX_V1.md
      - name: Validate endpoint classes and claim ceilings
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          j=json.loads(Path('data/evidence/chapter2_public_data_endpoint_matrix_v1.json').read_text())
          rows=j['rows']
          assert j['n_trait_modules']==5
          assert [r['priority_rank'] for r in rows]==['1','2','3','4','5']
          by={r['trait_module']:r for r in rows}
          assert by['orientation']['depth_recurrence'].startswith('ML minimum 6')
          assert by['flower_colour']['final_result_class']=='strong_present_space_candidate_historical_driver_not_evaluable'
          assert by['phyllary_posture']['final_result_class']=='history_resolved_cause_unidentified'
          assert by['stickiness']['final_result_class']=='rapid_history_resolved_biotic_driver_unidentified'
          assert by['outline_and_involucre_architecture']['final_result_class']=='present_breadth_resolved_evolutionary_depth_not_evaluable'
          assert all(r['causal_claim_allowed']=='no' for r in rows)
          assert all(r['chapter3_test'] for r in rows)
          allowed_orientation={
            'multi_layer_concordant_candidate',
            'present_sorting_historical_origin_decoupled',
            'history_resolved_origin_driver_unidentified_at_public_resolution'
          }
          assert by['orientation']['final_result_class'] in allowed_orientation
          with Path('data/evidence/chapter2_public_data_endpoint_matrix_v1.csv').open(newline='',encoding='utf-8') as f:
              csv_rows=list(csv.DictReader(f))
          assert len(csv_rows)==5
          md=Path('docs/chapter2/PUBLIC_DATA_ENDPOINT_MATRIX_V1.md').read_text(encoding='utf-8')
          assert 'Chapter 3' in md and 'Orientation origin-envelope decision' in md
          print(json.dumps({
            'status':'ok',
            'orientation_origin':j['orientation_origin_envelope_classification'],
            'orientation_endpoint':by['orientation']['final_result_class'],
            'classes':{r['trait_module']:r['final_result_class'] for r in rows}
          },indent=2))
          PY
      - name: Commit generated endpoint package
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/evidence/chapter2_public_data_endpoint_matrix_v1.csv \
            data/evidence/chapter2_public_data_endpoint_matrix_v1.json \
            docs/chapter2/PUBLIC_DATA_ENDPOINT_MATRIX_V1.md
          if git diff --cached --quiet; then
            echo 'Endpoint package unchanged.'
          else
            git commit -m 'Materialize Chapter 2 public-data endpoint matrix v1'
            git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
          fi
