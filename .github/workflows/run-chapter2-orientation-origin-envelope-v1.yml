name: Run Chapter 2 orientation origin envelope v1

on:
  pull_request:
    paths:
      - "analysis/run_chapter2_orientation_origin_envelope_v1.py"
      - "data/evidence/chapter2_orientation_origin_envelope_contract_v1.json"
      - ".github/workflows/run-chapter2-orientation-origin-envelope-v1.yml"
  workflow_dispatch:

concurrency:
  group: ch2-orientation-origin-envelope-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  origin-envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas xarray netCDF4
          python -m py_compile analysis/run_chapter2_orientation_origin_envelope_v1.py
      - name: Download public PALEO-PGEM shared state-space panel
        run: |
          set -euo pipefail
          mkdir -p /tmp/paleo
          base="https://zenodo.org/records/21327244/files"
          for f in \
            PALEO-PGEM-Series_bio1_mean.nc \
            PALEO-PGEM-Series_bio4_mean.nc \
            PALEO-PGEM-Series_bio12_mean.nc \
            PALEO-PGEM-Series_bio15_mean.nc; do
            curl --fail --location --retry 5 --retry-delay 5 "${base}/${f}?download=1" -o "/tmp/paleo/${f}"
          done
          echo '570e4b746e0b9c0cf82a2a5f85a6cff9  /tmp/paleo/PALEO-PGEM-Series_bio1_mean.nc' | md5sum -c -
          echo 'b6f90b330e4161b983d735b7f9f7a01f  /tmp/paleo/PALEO-PGEM-Series_bio4_mean.nc' | md5sum -c -
          echo 'b029ef3f40d666e3d96ec1d9f42bef54  /tmp/paleo/PALEO-PGEM-Series_bio12_mean.nc' | md5sum -c -
          echo 'f4c8d91815816f42959b90d512ac8b8e  /tmp/paleo/PALEO-PGEM-Series_bio15_mean.nc' | md5sum -c -
      - name: Run chronology and paleolocation envelope
        run: |
          mkdir -p /tmp/result
          python analysis/run_chapter2_orientation_origin_envelope_v1.py \
            --contract data/evidence/chapter2_orientation_origin_envelope_contract_v1.json \
            --bio1 /tmp/paleo/PALEO-PGEM-Series_bio1_mean.nc \
            --bio4 /tmp/paleo/PALEO-PGEM-Series_bio4_mean.nc \
            --bio12 /tmp/paleo/PALEO-PGEM-Series_bio12_mean.nc \
            --bio15 /tmp/paleo/PALEO-PGEM-Series_bio15_mean.nc \
            --out /tmp/result/chapter2_orientation_origin_envelope_v1.json \
            | tee /tmp/result/origin_envelope.log
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/result/chapter2_orientation_origin_envelope_v1.json').read_text())
          assert x['chronology']['n_valid_age_pairs'] >= 50
          assert set(x['region_summaries']) == {'taiwan','ryukyu_corridor','southern_japan','east_asia_core_corridor'}
          assert x['cross_scenario_summary']['n_region_by_chronology_scenarios'] >= 200
          assert x['cross_scenario_summary']['classification'] in {
              'robust_state_trajectory_concordance_under_scenario_envelope',
              'robust_state_trajectory_discordance_under_scenario_envelope',
              'origin_trajectory_unresolved_under_public_chronology_and_paleolocation_uncertainty'
          }
          for r in x['region_summaries'].values():
              assert r['n_grid_cells'] > 0
              assert r['n_chronology_scenarios'] == x['chronology']['n_valid_age_pairs']
          print(json.dumps(x['cross_scenario_summary'], indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chapter2-orientation-origin-envelope-${{ github.run_id }}
          path: /tmp/result
          if-no-files-found: error
