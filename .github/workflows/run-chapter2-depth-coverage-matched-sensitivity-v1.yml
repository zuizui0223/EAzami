name: Run Chapter 2 depth coverage-matched sensitivity v1

on:
  pull_request:
    paths:
      - "analysis/run_chapter2_depth_coverage_matched_sensitivity_v1.py"
      - "data/evidence/chapter2_depth_coverage_matched_sensitivity_contract_v1.json"
      - ".github/workflows/run-chapter2-depth-coverage-matched-sensitivity-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chapter2-depth-coverage-matched-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TREE_RUN_ID: "32923076873"
  TREE_ARTIFACT: "japan38-comp1061-frozen-tree-retry-32923076873"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen topology runtime
        run: python -m pip install --disable-pip-version-check biopython==1.85
      - name: Compile sensitivity analysis
        run: python -m py_compile analysis/run_chapter2_depth_coverage_matched_sensitivity_v1.py
      - name: Download frozen accepted Japan38 tree ensemble
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TREE_ARTIFACT }}
          path: frozen_current
          run-id: ${{ env.TREE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Run coverage-matched missing-state sensitivity
        run: |
          set -euo pipefail
          mkdir -p .tmp/chapter2-depth-coverage-matched
          python analysis/run_chapter2_depth_coverage_matched_sensitivity_v1.py \
            --sensitivity-contract data/evidence/chapter2_depth_coverage_matched_sensitivity_contract_v1.json \
            --source-contract data/evidence/chapter2_relative_event_depth_contract_v1.json \
            --tree frozen_current/tree_result/japan38_comp1061.treefile \
            --bootstrap-trees frozen_current/tree_result/japan38_comp1061.ufboot \
            --concept-map data/evidence/japan38_comp1061_concept_map_v1.csv \
            --base-trait-seed data/evidence/japan38_nmns_capitulum_trait_seed_v1.csv \
            --trait-extension data/evidence/japan38_nmns_capitulum_trait_seed_extension_v2.csv \
            --output-json .tmp/chapter2-depth-coverage-matched/result.json \
            --output-csv .tmp/chapter2-depth-coverage-matched/topology_summary.csv
      - name: Validate output shape and frozen design
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('.tmp/chapter2-depth-coverage-matched/result.json').read_text())
          assert x['version']=='chapter2_depth_coverage_matched_sensitivity_result_v1'
          v=x['input_verification']
          assert len(v['selected_topology_indices'])==200
          assert v['selected_topology_indices'][0]==1
          assert v['selected_topology_indices'][-1]==1000
          assert v['orientation_masks']==256
          assert v['stickiness_5_5_masks']==126
          assert v['stickiness_6_4_masks']==105
          assert x['source_state_counts']['orientation']=={'D':6,'U':14}
          assert x['source_state_counts']['phyllary_resolved']==10
          assert x['source_state_counts']['stickiness']=={'nonsticky':6,'sticky':7}
          assert len(x['comparison_results'])==6
          assert x['overall_classification'] in {
              'unequal_depth_retained_under_strict_coverage_matching',
              'unequal_depth_retained_against_matched_medians_but_strict_tail_overlap_remains',
              'unequal_depth_materially_sensitive_to_observed_state_coverage',
          }
          print(json.dumps(x,indent=2))
          PY
      - name: Upload sensitivity outputs
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-depth-coverage-matched-sensitivity-v1
          path: .tmp/chapter2-depth-coverage-matched/
          if-no-files-found: error
