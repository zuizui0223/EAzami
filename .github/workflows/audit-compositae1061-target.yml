name: Audit Compositae1061 target FASTA

on:
  pull_request:
    paths:
      - "analysis/recover_moreyra_author_repository.py"
      - "analysis/summarize_moreyra_locus_filter.py"
      - "analysis/export_moreyra_locus_manifests.py"
      - "analysis/recover_compositae1061_target.py"
      - "analysis/url_safe_download.py"
      - "analysis/run_compositae1061_target_audit.py"
      - "tests/test_recover_moreyra_author_repository.py"
      - "tests/test_summarize_moreyra_locus_filter.py"
      - "tests/test_export_moreyra_locus_manifests.py"
      - "tests/test_recover_compositae1061_target.py"
      - "tests/test_run_compositae1061_target_audit.py"
      - ".github/workflows/audit-compositae1061-target.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and run offline tests
        run: |
          python -m py_compile \
            analysis/recover_moreyra_author_repository.py \
            analysis/summarize_moreyra_locus_filter.py \
            analysis/export_moreyra_locus_manifests.py \
            analysis/recover_compositae1061_target.py \
            analysis/url_safe_download.py \
            analysis/run_compositae1061_target_audit.py
          python -m unittest \
            tests/test_recover_moreyra_author_repository.py \
            tests/test_summarize_moreyra_locus_filter.py \
            tests/test_export_moreyra_locus_manifests.py \
            tests/test_recover_compositae1061_target.py \
            tests/test_run_compositae1061_target_audit.py \
            -v

      - name: Rebuild public Moreyra locus universe
        run: |
          python analysis/recover_moreyra_author_repository.py \
            --outdir data/evidence/generated/moreyra_author_repository \
            --force
          python analysis/summarize_moreyra_locus_filter.py \
            --audit-dir data/evidence/generated/moreyra_author_repository
          python analysis/export_moreyra_locus_manifests.py \
            --input data/evidence/generated/moreyra_author_repository/paralog_locus_filter_reconstruction.csv \
            --outdir data/evidence/generated/moreyra_author_repository/locus_sets

      - name: Discover and audit public target FASTA candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python analysis/run_compositae1061_target_audit.py \
            --moreyra-loci data/evidence/generated/moreyra_author_repository/locus_sets/moreyra_public_1061_loci.txt \
            --outdir data/evidence/generated/compositae1061_target_audit

      - name: Validate audit contract
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          outdir = Path("data/evidence/generated/compositae1061_target_audit")
          summary = json.loads((outdir / "audit_summary.json").read_text(encoding="utf-8"))

          def rows(name):
              with (outdir / name).open(encoding="utf-8-sig", newline="") as handle:
                  return list(csv.DictReader(handle))

          requests = rows("source_request_log.csv")
          discovered = rows("discovered_files.csv")
          fasta = rows("fasta_candidate_audit.csv")

          print(f"audit_status={summary['audit_status']}")
          print(f"source_requests={summary['source_requests']}")
          print(f"successful_source_requests={summary['successful_source_requests']}")
          print(f"discovered_files={summary['discovered_files']}")
          print(f"download_attempts={summary['download_attempts']}")
          print(f"fasta_candidates={summary['fasta_candidates']}")
          print(f"high_confidence_candidates={summary['high_confidence_candidates']}")
          print(f"compatible_candidates={summary['compatible_candidates']}")
          if summary.get("best_candidate"):
              best = summary["best_candidate"]
              print(
                  "best=" + best["container_filename"] + "::" + best["archive_member"]
                  + " overlap=" + best["normalized_overlap_fraction"]
                  + " sha256=" + best["sha256"]
              )

          if summary["moreyra_locus_ids"] != 1061:
              raise SystemExit("Expected comparison against 1,061 Moreyra public locus IDs")
          if not requests:
              raise SystemExit("Source request log is empty")
          required_source_prefixes = {
              "mendeley_cardueae",
              "mendeley_processing",
              "dryad_mandel",
              "datacite_",
              "github_code_",
          }
          source_keys = {row["source_key"] for row in requests}
          for prefix in required_source_prefixes:
              if not any(key.startswith(prefix) for key in source_keys):
                  raise SystemExit(f"Required source class missing from request log: {prefix}")
          if summary["discovered_files"] != len(discovered):
              raise SystemExit("Discovered-file summary and table disagree")
          if summary["fasta_candidates"] != len(fasta):
              raise SystemExit("FASTA summary and table disagree")
          if summary["exact_target_frozen"]:
              raise SystemExit(
                  "The workflow must not freeze an exact target without explicit method/source confirmation"
              )
          for row in fasta:
              if len(row["sha256"]) != 64:
                  raise SystemExit("Audited FASTA candidate lacks SHA256")
              overlap = float(row["normalized_overlap_fraction"])
              if not 0.0 <= overlap <= 1.0:
                  raise SystemExit("Invalid overlap fraction")
          PY

      - name: Update target-audit issue
        uses: actions/github-script@v7
        env:
          AUDIT_SUMMARY: data/evidence/generated/compositae1061_target_audit/audit_summary.json
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- compositae1061-target-audit -->';
            const summary = JSON.parse(fs.readFileSync(process.env.AUDIT_SUMMARY, 'utf8'));
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const issue = issues.find(item =>
              !item.pull_request && item.title === 'Recover, validate and freeze the exact Compositae1061 HybPiper target FASTA'
            );
            if (!issue) {
              core.warning('Target-audit issue was not found; skipping issue comment.');
              return;
            }
            let best = 'none';
            if (summary.best_candidate) {
              const b = summary.best_candidate;
              best = `\`${b.container_filename}${b.archive_member ? ' :: ' + b.archive_member : ''}\` — normalized overlap ${b.normalized_overlap_fraction}, SHA256 \`${b.sha256}\`, status \`${b.candidate_status}\``;
            }
            const body = `${marker}
            ## Automated Compositae1061 target audit

            - audit status: \`${summary.audit_status}\`
            - successful source requests: **${summary.successful_source_requests} / ${summary.source_requests}**
            - discovered file candidates: **${summary.discovered_files}**
            - candidate downloads attempted: **${summary.download_attempts}**
            - FASTA candidates audited: **${summary.fasta_candidates}**
            - high-confidence candidates needing method confirmation: **${summary.high_confidence_candidates}**
            - compatible, non-exact candidates: **${summary.compatible_candidates}**
            - best current candidate: ${best}
            - exact target frozen: **${summary.exact_target_frozen}**

            Sequence overlap alone is not accepted as proof of the exact Moreyra target/version. The workflow artifact contains URL-normalized request logs, candidate provenance, checksums and overlap diagnostics.

            Workflow run: \`${context.runId}\`.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
            }

      - name: Upload target audit
        uses: actions/upload-artifact@v4
        with:
          name: compositae1061-target-audit-${{ github.run_id }}
          path: |
            data/evidence/generated/compositae1061_target_audit/
            data/evidence/generated/moreyra_author_repository/locus_sets/locus_set_manifest.csv
            data/evidence/generated/moreyra_author_repository/locus_sets/locus_set_manifest.json
          if-no-files-found: error
          retention-days: 90
