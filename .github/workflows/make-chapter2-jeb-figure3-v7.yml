name: Make Chapter 2 JEB Figure 3 V7

on:
  pull_request:
    paths:
      - "analysis/make_chapter2_jeb_figure3_v7.py"
      - "data/evidence/chapter2_jeb_v7_figure3_contract_v2.json"
      - "data/evidence/chapter2_orientation_environment_scale_partition_v1.json"
      - "data/evidence/chapter2_orientation_environment_counterfactual_result_v1.json"
      - "data/evidence/chapter2_current_claims_h1_h4_v1.json"
      - "data/evidence/chapter2_orientation_transition_regime_hypothesis_result_v1.json"
      - "data/evidence/chapter2_orientation_transition_regime_robustness_result_v1.json"
      - "data/evidence/chapter2_orientation_transition_regime_single_deletion_result_v1.json"
      - "data/evidence/chapter2_orientation_transition_regime_geography_residual_result_v1.json"
      - "data/evidence/chapter2_orientation_transition_regime_internal_edge_result_v1.json"
      - "data/evidence/chapter2_orientation_transition_regime_combined_stress_result_v1.json"
      - "docs/chapter2/JEB_V7_FIGURE_MAP.md"
      - ".github/workflows/make-chapter2-jeb-figure3-v7.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install plotting runtime
        run: python -m pip install --disable-pip-version-check matplotlib numpy
      - name: Compile generator
        run: python -m py_compile analysis/make_chapter2_jeb_figure3_v7.py
      - name: Generate validated Figure 3
        run: python analysis/make_chapter2_jeb_figure3_v7.py --output-dir .tmp/figure3_v7
      - name: Verify outputs
        run: |
          test -s .tmp/figure3_v7/figure3_v7_transition_regime_ecology.png
          test -s .tmp/figure3_v7/figure3_v7_transition_regime_ecology.pdf
          test -s .tmp/figure3_v7/figure3_v7_transition_regime_ecology_manifest.json
      - name: Upload Figure 3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-jeb-v7-figure3-transition-regime
          path: .tmp/figure3_v7/
          if-no-files-found: error
