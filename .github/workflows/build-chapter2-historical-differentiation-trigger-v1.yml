name: Build Chapter 2 historical differentiation trigger v1

on:
  pull_request:
    paths:
      - "analysis/summarize_chapter2_historical_differentiation_trigger_v1.py"
      - "data/evidence/chapter2_historical_differentiation_trigger_contract_v1.json"
      - "data/evidence/chapter2_public_trait_event_recovery_audit_v2.csv"
      - ".github/workflows/build-chapter2-historical-differentiation-trigger-v1.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas
          python -m py_compile analysis/summarize_chapter2_historical_differentiation_trigger_v1.py
      - name: Recover frozen orientation chronology x paleolocation source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ch2_trigger/source /tmp/ch2_trigger/out
          curl -L --fail-with-body \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9762830184/zip \
            -o /tmp/ch2_trigger/source/orientation.zip
          unzip -q /tmp/ch2_trigger/source/orientation.zip -d /tmp/ch2_trigger/source/orientation
          test -s /tmp/ch2_trigger/source/orientation/chapter2_orientation_origin_envelope_v1.json
      - name: Re-summarize differentiation event without present-day prior
        run: |
          set -euo pipefail
          python analysis/summarize_chapter2_historical_differentiation_trigger_v1.py \
            --contract data/evidence/chapter2_historical_differentiation_trigger_contract_v1.json \
            --orientation-source /tmp/ch2_trigger/source/orientation/chapter2_orientation_origin_envelope_v1.json \
            --event-audit data/evidence/chapter2_public_trait_event_recovery_audit_v2.csv \
            --out-json /tmp/ch2_trigger/out/chapter2_historical_differentiation_trigger_v1.json \
            --out-variable-csv /tmp/ch2_trigger/out/chapter2_historical_differentiation_trigger_variables_v1.csv \
            --out-event-ledger /tmp/ch2_trigger/out/chapter2_historical_differentiation_event_ledger_v1.csv \
            | tee /tmp/ch2_trigger/out/run_summary.log
      - name: Validate differentiation-only contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/ch2_trigger/out/chapter2_historical_differentiation_trigger_v1.json')
          x=json.loads(p.read_text())
          assert x['analysis_scope'].startswith('historical differentiation only')
          o=x['orientation_event']
          assert o['chronology_scenarios']==94
          assert o['n_region_by_chronology_scenarios']==376
          assert set(o['variable_summary'])=={'BIO1','BIO4','BIO12','BIO15'}
          assert o['repeated_trigger_status']=='not_evaluable_single_dated_transition_event'
          for var, r in o['variable_summary'].items():
              assert set(r['per_region'])=={'taiwan','ryukyu_corridor','southern_japan','east_asia_core_corridor'}
              assert r['cross_region_direction'] in {'robust_increase','robust_decrease','direction_unresolved'}
              assert r['cross_region_matched_window_position'] in {'consistently_above_matched_windows','consistently_below_matched_windows','matched_window_position_unresolved'}
          text=p.read_text().lower()
          assert 'cosine_similarity' not in text
          assert 'direction_agreement' not in text
          assert x['identifiability_summary']['calendar_paleolocation_environment_evaluable_transition_envelopes']==1
          print(json.dumps({
              'event_direction_class':o['event_direction_class'],
              'robust_variables':o['variables_with_robust_cross_region_delta_direction'],
              'matched_window_variables':o['variables_with_consistent_matched_window_position'],
              'repeated_trigger_status':o['repeated_trigger_status'],
              'identifiability':x['identifiability_summary'],
          },indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chapter2-historical-differentiation-trigger-${{ github.run_id }}
          path: /tmp/ch2_trigger/out/
          if-no-files-found: error
          retention-days: 90
