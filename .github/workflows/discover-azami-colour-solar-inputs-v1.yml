name: Discover Azami colour-solar inputs v1

on:
  pull_request:
    paths:
      - "analysis/discover_azami_colour_solar_inputs_v1.py"
      - "data/evidence/chapter2_space_time_public_data_contract_v1.json"
      - ".github/workflows/discover-azami-colour-solar-inputs-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/azami
          ref: main
          path: public_azami_repo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyarrow
          python -m pip check

      - name: Freeze inspected Azami commit
        run: |
          mkdir -p output/colour_solar_discovery
          git -C public_azami_repo rev-parse HEAD | tee output/colour_solar_discovery/azami_main_commit.txt

      - name: Discover reusable tables
        run: |
          set -euo pipefail
          python -m py_compile analysis/discover_azami_colour_solar_inputs_v1.py
          python analysis/discover_azami_colour_solar_inputs_v1.py \
            --root public_azami_repo \
            --out-dir output/colour_solar_discovery

      - name: Validate discovery structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          manifest=json.loads(Path('output/colour_solar_discovery/azami_colour_solar_input_discovery_v1.json').read_text())
          inventory=pd.read_csv('output/colour_solar_discovery/azami_colour_solar_input_inventory_v1.csv')
          assert manifest['contract_version']=='azami_colour_solar_input_discovery_v1'
          assert Path('output/colour_solar_discovery/azami_main_commit.txt').read_text().strip()
          expected={
              'path','score','readiness','colour_lightness_columns','colour_chroma_columns',
              'colour_hue_pigment_columns','solar_columns','latitude_columns',
              'longitude_columns','taxon_columns','date_columns','image_source_columns'
          }
          assert expected <= set(inventory.columns)
          print(json.dumps(manifest, indent=2, ensure_ascii=False))
          print(inventory.head(100).to_string(index=False, max_colwidth=180))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: azami-colour-solar-input-discovery-v1
          path: output/colour_solar_discovery
          if-no-files-found: error
          retention-days: 90
