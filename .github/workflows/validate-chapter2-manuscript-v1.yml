name: Validate Chapter 2 legacy JEB audit package

on:
  pull_request:
    paths:
      - "README.md"
      - "PROJECT_STATUS.md"
      - "docs/chapter2/**"
      - "docs/RESEARCH_PLAN.md"
      - "docs/archive/RESEARCH_PLAN_FLOWER_COLOUR_LEGACY_2026-08-27.md"
      - "data/evidence/chapter2_claim_registry_v1.csv"
      - "data/evidence/chapter2_result_role_map_v2.csv"
      - "data/evidence/chapter2_jeb_main_result_table_v1.csv"
      - "data/evidence/chapter2_jeb_reframe_contract_v1.json"
      - "data/evidence/chapter2_time_axis_compute/japan38_branch_change_reconstruction_null_v1.json"
      - "data/evidence/chapter2_provenance_sensitivity_compute/**"
      - "analysis/make_chapter2_jeb_figures_v1.py"
      - "analysis/make_chapter2_jeb_supplementary_figures_v1.py"
      - "analysis/build_chapter2_jeb_docx_v1.py"
      - "analysis/validate_chapter2_manuscript_v1.py"
      - "tests/test_make_chapter2_jeb_figures_v1.py"
      - "tests/test_make_chapter2_jeb_supplementary_figures_v1.py"
      - ".github/workflows/validate-chapter2-manuscript-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install figure and validation dependencies
        run: python -m pip install 'matplotlib>=3.8,<4' 'pandas>=2.2,<4' 'numpy>=1.26,<3' pytest
      - name: Compile and test figure package
        run: |
          python -m py_compile analysis/make_chapter2_jeb_figures_v1.py analysis/make_chapter2_jeb_supplementary_figures_v1.py analysis/build_chapter2_jeb_docx_v1.py analysis/validate_chapter2_manuscript_v1.py
          python -m pytest -q tests/test_make_chapter2_jeb_figures_v1.py tests/test_make_chapter2_jeb_supplementary_figures_v1.py
      - name: Rebuild figures from frozen evidence
        run: |
          python analysis/make_chapter2_jeb_figures_v1.py
          python analysis/make_chapter2_jeb_supplementary_figures_v1.py
      - name: Validate frozen JEB V3 audit package and active entry-point boundary
        run: python analysis/validate_chapter2_manuscript_v1.py
