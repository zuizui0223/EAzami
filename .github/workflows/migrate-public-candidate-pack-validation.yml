name: Migrate candidate validation to durable packs

on:
  pull_request:
    paths:
      - ".github/workflows/migrate-public-candidate-pack-validation.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Replace expiring artifact downloads with durable materialization
        run: |
          python - <<'PY'
          from pathlib import Path

          def add_paths(text: str) -> str:
              anchor='      - "analysis/materialize_frozen_moreyra_reconciliation.py"\n'
              insert=(anchor+
                      '      - "analysis/materialize_frozen_public_candidate_locus_pack.py"\n'
                      '      - "data/evidence/public_candidate_locus_packs_v1/**"\n'
                      '      - "tests/test_materialize_frozen_public_candidate_locus_pack.py"\n')
              if 'analysis/materialize_frozen_public_candidate_locus_pack.py' not in text:
                  if anchor not in text: raise RuntimeError('workflow path anchor missing')
                  text=text.replace(anchor,insert,1)
              return text

          def add_compile_and_test(text: str) -> str:
              old='            analysis/materialize_frozen_moreyra_reconciliation.py\n'
              new=('            analysis/materialize_frozen_moreyra_reconciliation.py \\\n'
                   '            analysis/materialize_frozen_public_candidate_locus_pack.py\n'
                   '          python -m unittest tests/test_materialize_frozen_public_candidate_locus_pack.py -v\n')
              if 'python -m unittest tests/test_materialize_frozen_public_candidate_locus_pack.py -v' not in text:
                  if old not in text: raise RuntimeError('compile anchor missing')
                  text=text.replace(old,new,1)
              return text

          ea=Path('.github/workflows/validate-east-asia-public-augmentation-gate.yml')
          text=ea.read_text()
          text=add_paths(text)
          text=text.replace('  actions: read\n','')
          text=add_compile_and_test(text)
          start=text.index('      - name: Recover successful EA01 and EA02 candidate packs\n')
          end=text.index('      - name: Validate frozen pilot evidence and joint candidate locus set\n',start)
          replacement='''      - name: Materialize durable EA01 and EA02 candidate packs
        run: |
          mkdir -p /tmp/EA01 /tmp/EA02
          python analysis/materialize_frozen_public_candidate_locus_pack.py \\
            --candidate EA01 --output /tmp/EA01
          python analysis/materialize_frozen_public_candidate_locus_pack.py \\
            --candidate EA02 --output /tmp/EA02
          python - <<'PY2'
          import json
          from pathlib import Path
          e1=json.loads(Path('/tmp/EA01/durable_materialization.json').read_text())
          e2=json.loads(Path('/tmp/EA02/durable_materialization.json').read_text())
          assert e1['source_artifact_id']==9175870949 and e1['strict_locus_count']==236
          assert e2['source_artifact_id']==9175876315 and e2['strict_locus_count']==239
          assert e1['source_artifact_expiry_no_longer_runtime_dependency'] is True
          assert e2['source_artifact_expiry_no_longer_runtime_dependency'] is True
          assert e1['all_per_locus_source_fasta_checksums_verified'] is True
          assert e2['all_per_locus_source_fasta_checksums_verified'] is True
          PY2
'''
          text=text[:start]+replacement+text[end:]
          if '/actions/artifacts/' in text or 'GH_TOKEN' in text or 'actions: read' in text:
              raise RuntimeError('EA workflow still contains Actions artifact runtime dependency')
          ea.write_text(text)

          cn=Path('.github/workflows/validate-cirsium-nipponicum-public-genome-gate.yml')
          text=cn.read_text()
          text=add_paths(text)
          text=text.replace('  actions: read\n','')
          text=add_compile_and_test(text)
          start=text.index('      - name: Recover frozen Ulleung genome locus pack\n')
          end=text.index('      - name: Validate frozen compact genome result and gate\n',start)
          replacement='''      - name: Materialize durable Ulleung genome locus pack
        run: |
          mkdir -p /tmp/cnipg_pack
          python analysis/materialize_frozen_public_candidate_locus_pack.py \\
            --candidate CNIPG --output /tmp/cnipg_pack
          python - <<'PY2'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/cnipg_pack/durable_materialization.json').read_text())
          assert d['source_artifact_id']==9174758977
          assert d['strict_locus_count']==180
          assert d['source_artifact_expiry_no_longer_runtime_dependency'] is True
          assert d['all_per_locus_source_fasta_checksums_verified'] is True
          PY2
'''
          text=text[:start]+replacement+text[end:]
          if '/actions/artifacts/' in text or 'GH_TOKEN' in text or 'actions: read' in text:
              raise RuntimeError('CNIPG workflow still contains Actions artifact runtime dependency')
          cn.write_text(text)
          PY
      - name: Validate migration invariants
        run: |
          set -euo pipefail
          python -m py_compile analysis/materialize_frozen_public_candidate_locus_pack.py
          python -m unittest tests/test_materialize_frozen_public_candidate_locus_pack.py -v
          for f in .github/workflows/validate-east-asia-public-augmentation-gate.yml .github/workflows/validate-cirsium-nipponicum-public-genome-gate.yml; do
            grep -q 'materialize_frozen_public_candidate_locus_pack.py' "$f"
            grep -q 'public_candidate_locus_packs_v1' "$f"
            ! grep -q '/actions/artifacts/' "$f"
            ! grep -q 'GH_TOKEN' "$f"
            ! grep -q 'actions: read' "$f"
          done
      - name: Retire one-shot migration workflows and commit
        run: |
          set -euo pipefail
          git rm -f .github/workflows/freeze-public-candidate-locus-packs.yml
          git rm -f .github/workflows/migrate-public-candidate-pack-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-east-asia-public-augmentation-gate.yml \
                  .github/workflows/validate-cirsium-nipponicum-public-genome-gate.yml
          git commit -m "Use durable public candidate locus packs in CI"
          git push origin HEAD:${GITHUB_HEAD_REF}
