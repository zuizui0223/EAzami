name: Run FDT4 Japan orientation niche v1

on:
  pull_request:
    paths:
      - "data/evidence/fdt4_existing_material_join_audit_v1.csv"
      - "data/evidence/fdt4_existing_material_join_audit_v1.json"
      - "data/evidence/fdt4_japan_orientation_niche_config_v1.json"
      - ".github/workflows/run-fdt4-japan-orientation-niche-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate FDT4 input audit
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          audit=json.loads(Path('data/evidence/fdt4_existing_material_join_audit_v1.json').read_text())
          assert audit['panel']['comp1061_focal_tips']==20
          assert audit['panel']['orientation_resolved_binary_tips']==17
          assert audit['panel']['resolved_orientation_tips_with_existing_focal_occurrence_niche_asset']==2
          assert audit['panel']['resolved_orientation_tips_missing_equivalent_niche_asset']==15
          assert audit['decision']['full_branchwise_orientation_niche_history_runnable_now'] is False

          rows=list(csv.DictReader(Path('data/evidence/fdt4_existing_material_join_audit_v1.csv').open()))
          assert len(rows)==20
          assert sum(r['orientation_resolved']=='true' for r in rows)==17
          assert sum(r['current_niche_asset']=='yes' and r['orientation_resolved']=='true' for r in rows)==2

          cfg=json.loads(Path('data/evidence/fdt4_japan_orientation_niche_config_v1.json').read_text())
          taxa={x['scientific_name'] for x in cfg['taxa']}
          expected={
            'Cirsium alpicola','Cirsium brevicaule','Cirsium gyojanum','Cirsium irumtiense',
            'Cirsium japonicum var. japonicum','Cirsium kamtschaticum','Cirsium kujuense',
            'Cirsium nippoense','Cirsium suffultum','Cirsium yezoense'
          }
          assert taxa==expected
          assert cfg['gbif']['country']=='JP'
          print('FDT4 contract PASS; Japan phase taxa=', len(taxa))
          PY

  live_niche:
    needs: validate_contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests scikit-learn rasterio
          python -m pip check
      - name: Run source-name-guarded Japan tip niche extraction
        env:
          GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
          CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif,.tiff
          GDAL_HTTP_TIMEOUT: "120"
          GDAL_HTTP_MAX_RETRY: "4"
          GDAL_HTTP_RETRY_DELAY: "3"
        run: |
          python analysis/run_focal_occurrence_niche_sample_information_source_guard_v1.py \
            --config data/evidence/fdt4_japan_orientation_niche_config_v1.json \
            --out-dir fdt4_japan_orientation_niche_live
      - name: Summarize usable FDT4 tip coverage
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          out=Path('fdt4_japan_orientation_niche_live')
          rows=list(csv.DictReader((out/'focal_niche_sampling_summary.csv').open()))
          cfg=json.loads(Path('data/evidence/fdt4_japan_orientation_niche_config_v1.json').read_text())
          expected={x['scientific_name'] for x in cfg['taxa']}
          by={r['taxon']:r for r in rows}
          represented=set(by)
          usable=[]
          sparse=[]
          missing=[]
          for taxon in sorted(expected):
              if taxon not in by:
                  missing.append(taxon)
                  continue
              n=int(float(by[taxon].get('n_environment_complete',0) or 0))
              if n>=10:
                  usable.append({'taxon':taxon,'n_environment_complete':n})
              else:
                  sparse.append({'taxon':taxon,'n_environment_complete':n})
          result={
            'contract_version':'fdt4_japan_orientation_niche_live_summary_v1',
            'expected_taxa':len(expected),
            'represented_taxa':len(represented & expected),
            'usable_n_ge_10':len(usable),
            'usable_taxa':usable,
            'sparse_taxa':sparse,
            'missing_taxa':missing,
            'decision':'tip-level niche inputs only; branch-wise trait-niche coupling remains blocked until phylogenetic join and broader East-Asian phase'
          }
          (out/'fdt4_japan_orientation_niche_live_summary_v1.json').write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(result,indent=2,ensure_ascii=False))
          PY
      - name: Upload FDT4 Japan niche artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdt4-japan-orientation-niche-v1
          path: fdt4_japan_orientation_niche_live
          if-no-files-found: warn
          retention-days: 90
