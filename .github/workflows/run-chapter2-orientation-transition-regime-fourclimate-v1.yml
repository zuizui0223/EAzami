name: EAzami Chapter 2 original CTMC U to D transitions BIO18 BIO5 RSDS elevation
on:
  workflow_dispatch:
  push:
    branches: [codex/ch2-transition-BIO18-BIO5-RSDS-elevation]
    paths:
      - 'analysis/run_chapter2_orientation_transition_regime_fourclimate_v1.py'
      - 'tests/test_chapter2_orientation_transition_regime_fourclimate_v1.py'
      - 'data/evidence/chapter2_fourclimate_s1s2_source_identity_v1.json'
      - '.github/workflows/run-chapter2-orientation-transition-regime-fourclimate-v1.yml'
permissions:
  contents: read
  actions: read
jobs:
  original-six-AU-nuclear-CTMC-Brownian-EAzami-UD:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original Chapter2 tree and climate source packages
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' \
            'biopython>=1.83,<2' 'rasterio>=1.4,<2' 'pytest>=8,<10'
          python -m pip check
      - name: Unit test source and identical original CTMC edge posterior with Brownian branch shifts
        run: |
          python -m pytest -q \
            tests/test_chapter2_orientation_transition_regime_fourclimate_v1.py
      - name: Authenticate ORIGINAL EAzami nine-taxon and twelve-taxon niche sources
        run: |
          set -euo pipefail
          mkdir -p work/ch2/occ/japan work/ch2/occ/taiwan work/ch2/env work/ch2/rsds work/ch2/out
          test "$(gh api repos/zuizui0223/EAzami/actions/artifacts/9516784077 --jq .digest)" = \
            'sha256:cb5717c90cbc769398f9ffce38787704a02e34253c1ff16cf8f368ba55aeda96'
          test "$(gh api repos/zuizui0223/EAzami/actions/artifacts/9520157997 --jq .digest)" = \
            'sha256:819936ceeb6008f356c580622fb72972617700402afaa3d3ab125bff2e6d9106'
          gh run download 32716015605 --repo zuizui0223/EAzami \
            --name fdt4-japan-orientation-niche-v1 --dir work/ch2/occ/japan
          gh run download 32725842871 --repo zuizui0223/EAzami \
            --name fdt4-taiwan-orientation-niche-v1 --dir work/ch2/occ/taiwan
          test -s work/ch2/occ/japan/focal_occurrences_environment_complete.csv
          test -s work/ch2/occ/taiwan/focal_occurrences_environment_complete.csv
          test "$(git hash-object data/evidence/comp1061_six_au_nonrejected_trees_v1.nwk)" = \
            'd7f8c0b96ee9c257c815db06a5a0aa9fdae4841e'
      - name: Get exactly the four S1 S2 environmental raster sources at ORIGINAL EAzami occurrences
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --retry-delay 3 --max-time 400 \
            'https://os.unil.cloud.switch.ch/chelsa02/chelsa/global/bioclim/bio05/1981-2010/CHELSA_bio05_1981-2010_V.2.1.tif' \
            --output work/ch2/env/CHELSA_bio05_1981-2010_V.2.1.tif
          curl --fail --location --silent --show-error --retry 3 --retry-delay 3 --max-time 400 \
            'https://os.unil.cloud.switch.ch/chelsa02/chelsa/global/bioclim/bio18/1981-2010/CHELSA_bio18_1981-2010_V.2.1.tif' \
            --output work/ch2/env/CHELSA_bio18_1981-2010_V.2.1.tif
          curl --fail --location --silent --show-error --retry 3 --retry-delay 3 --max-time 400 \
            'https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_30s_elev.zip' \
            --output work/ch2/env/wc2.1_30s_elev.zip
          echo '90078d99eeb0b08dd1a115a5ffa60b7c19e5849686854db950283cbac9d3817d  work/ch2/env/CHELSA_bio05_1981-2010_V.2.1.tif' | sha256sum -c -
          echo '68b0b1cb905cdf6972364e947e137f714a68d287f38863b1516161a2a4bbd7ec  work/ch2/env/CHELSA_bio18_1981-2010_V.2.1.tif' | sha256sum -c -
          echo '8b9ac1eddbb1e51ea4aa860f637a5ec30096e1668a85303febe0d91abf901017  work/ch2/env/wc2.1_30s_elev.zip' | sha256sum -c -
          unzip -p work/ch2/env/wc2.1_30s_elev.zip wc2.1_30s_elev.tif \
            > work/ch2/env/wc2.1_30s_elev.tif
          echo '1d57ce9fd3584cea6a227396bc75ef88522fd5346e8487c17370885c0499716e  work/ch2/env/wc2.1_30s_elev.tif' | sha256sum -c -
      - name: Restore unchanged original S1 S2 SHA-verified one-km RSDS raster cache
        run: |
          set -euo pipefail
          mkdir -p work/ch2/rsds/chelsa_rsds_mean
          gh api repos/zuizui0223/azami/actions/artifacts/12242917323/zip \
            > work/ch2/rsds/source.zip
          echo '2193bd04b979f6684f7bce7c670074af63072d270a20c4dc2fd0bd5934862df4  work/ch2/rsds/source.zip' | sha256sum -c -
          unzip -q work/ch2/rsds/source.zip -d work/ch2/rsds/chelsa_rsds_mean
      - name: Run ORIGINAL EAzami six-tree U-to-D posterior transition regime method with four new present-day niches
        run: |
          python -m analysis.run_chapter2_orientation_transition_regime_fourclimate_v1 \
            --original-contract data/evidence/chapter2_orientation_transition_regime_hypothesis_contract_v1.json \
            --coverage data/evidence/chapter2_orientation_occurrence_coverage_audit_result_v1.json \
            --legacy data/evidence/fdt4_branchwise_niche_transition_concordance_v1.json \
            --orientation data/evidence/orientation_comp1061_20tip_source_crosswalk_v1.csv \
            --japan work/ch2/occ/japan/focal_occurrences_environment_complete.csv \
            --taiwan work/ch2/occ/taiwan/focal_occurrences_environment_complete.csv \
            --trees data/evidence/comp1061_six_au_nonrejected_trees_v1.nwk \
            --rasters work/ch2/env \
            --rsds-cache work/ch2/rsds/chelsa_rsds_mean \
            --rsds-metadata data/evidence/chapter2_fourclimate_s1s2_source_identity_v1.json \
            --AU-blob-sha d7f8c0b96ee9c257c815db06a5a0aa9fdae4841e \
            --out work/ch2/out/EAzami_ORIGINAL_U_D_TRANSITION_BIO18_BIO5_RSDS_ELEVATION.json
          git rev-parse HEAD > work/ch2/out/SOURCE_COMMIT.txt
      - name: Enforce same original discrete H1 method and completed all count-preserving map nulls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('work/ch2/out')
          d=json.loads((root/'EAzami_ORIGINAL_U_D_TRANSITION_BIO18_BIO5_RSDS_ELEVATION.json').read_text())
          assert d['method_reproduces_frozen_original_BIO15_plus_BIO1_n10']['status']=='pass'
          assert d['original_EAzami_categorical_U_D_used_as_original_transition_response']
          assert not d['not_S1_photo_image_angle_response_or_S1_to_T2_PGLS'] is False
          assert d['original_AU_six_true_multilocus_nuclear_trees_not_plastid']
          assert len(d['per_panel_four_environment_transition_regime_results'])==3
          panels=d['per_panel_four_environment_transition_regime_results']
          assert panels['n5_primary']['n_state_maps']==792
          assert panels['n3_sensitivity']['n_state_maps']==1716
          assert panels['n10_strict']['n_state_maps']==126
          assert panels['n5_primary']['region_frequency_preserving_exact_null_336']['n_maps']==336
          assert set(panels['n5_primary']['observed_mean_Brownian_branch_shifts_x_CTMC_posterior'])=={'chelsa_bio18','chelsa_bio05','chelsa_rsds_mean','elevation_m'}
          assert d['n_new_independent_U_D_biological_state_assignments']==0
          assert not d['one_sided_prediction_cannot_be_selected_posthoc'] is False
          assert {p.name for p in root.iterdir()}=={
            'EAzami_ORIGINAL_U_D_TRANSITION_BIO18_BIO5_RSDS_ELEVATION.json','SOURCE_COMMIT.txt'}
          print('VERIFIED_EAZAMI_ORIGINAL_CTMC_UD_BROWNIAN_6_NUCLEAR_4_NEW_AXES_FULL_FINITE_MAP_NULL')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eazami-real-original-H1-CTMC-UD-six-nuclear-BIO18-BIO5-RSDS-DEM
          path: work/ch2/out/
          if-no-files-found: warn
          retention-days: 90
