name: Validate Chapter 2 space-time public-data closure

on:
  pull_request:
    paths:
      - "docs/chapter2/README.md"
      - "docs/chapter2/SPACE_TIME_PUBLIC_DATA_SYNTHESIS_V1.md"
      - "data/evidence/chapter2_space_time_public_data_closure_v1.csv"
      - "data/evidence/chapter2_trait_function_history_table_v1.csv"
      - "data/evidence/chapter2_time_axis_compute/japan38_all_continuous_history_summary_v1.json"
      - "data/evidence/chapter2_time_axis_compute/continuous_primary_phylogenetic_structure_v1.csv"
      - "analysis/validate_chapter2_space_time_public_data_closure_v1.py"
      - ".github/workflows/validate-chapter2-space-time-public-data-closure-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile closure validator
        run: python -m py_compile analysis/validate_chapter2_space_time_public_data_closure_v1.py
      - name: Validate paired breadth-depth synthesis and claim boundaries
        run: python analysis/validate_chapter2_space_time_public_data_closure_v1.py
