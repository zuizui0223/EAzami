name: Validate Chang 2026 restartable transcriptome pilot

on:
  pull_request:
    paths:
      - "analysis/run_chang2026_restartable_transcriptome_assembly.py"
      - "analysis/summarize_chang2026_transcriptome_qc.py"
      - "analysis/build_chang2026_hpc_pilot_bundle.py"
      - "analysis/run_chang2026_layout_aware_transcriptome_assembly.py"
      - "analysis/build_chang2026_resource_plan.py"
      - "tests/test_run_chang2026_restartable_transcriptome_assembly.py"
      - "tests/test_summarize_chang2026_transcriptome_qc.py"
      - "tests/test_build_chang2026_hpc_pilot_bundle.py"
      - ".github/workflows/validate-chang2026-restartable-pilot.yml"
  workflow_dispatch:

concurrency:
  group: validate-chang2026-restartable-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and run offline tests
        run: |
          python -m py_compile \
            analysis/run_chang2026_restartable_transcriptome_assembly.py \
            analysis/summarize_chang2026_transcriptome_qc.py \
            analysis/build_chang2026_hpc_pilot_bundle.py
          python -m unittest \
            tests/test_run_chang2026_restartable_transcriptome_assembly.py \
            tests/test_summarize_chang2026_transcriptome_qc.py \
            tests/test_build_chang2026_hpc_pilot_bundle.py \
            -v

      - name: Rebuild source-backed panel and resource plan
        env:
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          python analysis/recover_chang2026_published_runinfo.py \
            --bioproject PRJNA1311153 \
            --supplement data/evidence/chang2026_east_asia_accession_audit_2026-08-10.csv \
            --outdir /tmp/chang2026_ncbi
          runinfo=$(find /tmp/chang2026_ncbi -name '*_published_complete_runinfo.csv' -print -quit)
          test -n "$runinfo"
          python analysis/reconcile_chang2026_complete_runs.py \
            --runinfo "$runinfo" \
            --outdir /tmp/chang2026_reconciliation
          python analysis/audit_chang2026_public_transcriptome_assemblies.py \
            --manifest /tmp/chang2026_reconciliation/chang2026_sample_run_reconciliation.csv \
            --outdir /tmp/chang2026_public_assemblies
          mkdir -p /tmp/chang2026_gene_tree_panel
          python analysis/normalize_chang2026_panel_taxa.py \
            --input /tmp/chang2026_reconciliation/chang2026_sample_run_reconciliation.csv \
            --output /tmp/chang2026_gene_tree_panel/chang2026_panel_taxon_normalized_reconciliation.csv \
            --summary /tmp/chang2026_gene_tree_panel/chang2026_panel_taxon_normalization_summary.json
          python analysis/build_chang2026_gene_tree_panel.py \
            --reconciliation /tmp/chang2026_gene_tree_panel/chang2026_panel_taxon_normalized_reconciliation.csv \
            --assembly-audit /tmp/chang2026_public_assemblies/chang2026_public_transcriptome_assembly_audit.csv \
            --outdir /tmp/chang2026_gene_tree_panel
          python analysis/build_chang2026_resource_plan.py \
            --panel /tmp/chang2026_gene_tree_panel/chang2026_sinocirsium_gene_tree_panel.csv \
            --runinfo "$runinfo" \
            --outdir /tmp/chang2026_resource_plan

      - name: Dry-run six samples and first-sample restart contract
        run: |
          python analysis/run_chang2026_restartable_transcriptome_assembly.py \
            --panel /tmp/chang2026_gene_tree_panel/chang2026_takaoense6_assembly_pilot.csv \
            --expected-panel-samples 6 \
            --outdir /tmp/chang2026_restartable_six \
            --jobs 1 \
            --dry-run
          python analysis/run_chang2026_restartable_transcriptome_assembly.py \
            --panel /tmp/chang2026_gene_tree_panel/chang2026_takaoense6_assembly_pilot.csv \
            --expected-panel-samples 6 \
            --sample-id NH_ccy3835 \
            --outdir /tmp/chang2026_restartable_NH \
            --jobs 1 \
            --dry-run
          python analysis/build_chang2026_hpc_pilot_bundle.py \
            --pilot-panel /tmp/chang2026_gene_tree_panel/chang2026_takaoense6_assembly_pilot.csv \
            --resource-plan /tmp/chang2026_resource_plan/chang2026_sample_resource_plan.csv \
            --outdir /tmp/chang2026_hpc_bundle

      - name: Validate heavy-run command and pilot selection
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          six = list(csv.DictReader(Path('/tmp/chang2026_restartable_six/restartable_command_plan.csv').open()))
          one = list(csv.DictReader(Path('/tmp/chang2026_restartable_NH/restartable_command_plan.csv').open()))
          bundle = json.loads(Path('/tmp/chang2026_hpc_bundle/pilot_execution_manifest.json').read_text())
          resources = list(csv.DictReader(Path('/tmp/chang2026_resource_plan/chang2026_sample_resource_plan.csv').open()))
          focal = [r for r in resources if r['execution_group'] == 'takaoense6_pilot']

          if len(six) != 6 or len(one) != 1:
              raise SystemExit('Unexpected dry-run sample count')
          if one[0]['sample_id'] != 'NH_ccy3835' or one[0]['run'] != 'SRR35152735':
              raise SystemExit(f"Unexpected first sample: {one[0]}")
          if bundle['selected_sample']['sample_id'] != 'NH_ccy3835':
              raise SystemExit('Bundle did not mechanically select NH_ccy3835')
          if bundle['selected_sample']['minimum_free_disk_gib_for_first_run'] != 50:
              raise SystemExit('NH preflight disk gate changed without review')
          if len(focal) != 6:
              raise SystemExit('Resource plan lost six focal samples')

          cmd = one[0]
          if 'prefetch SRR35152735' not in cmd['prefetch_command'] or '--max-size u' not in cmd['prefetch_command']:
              raise SystemExit('Restartable prefetch contract missing')
          if 'vdb-validate' not in cmd['vdb_validate_command']:
              raise SystemExit('vdb-validate stage missing')
          if ' --split-files ' not in (' ' + cmd['fasterq_command'] + ' '):
              raise SystemExit('fasterq split-files missing')
          if ' -e ' not in (' ' + cmd['fasterq_command'] + ' ') or ' -t ' not in (' ' + cmd['fasterq_command'] + ' '):
              raise SystemExit('fasterq thread/scratch contract missing')
          if '--threads' in cmd['fasterq_command'] or '--skip-technical' in cmd['fasterq_command']:
              raise SystemExit('Legacy fastq-dump options leaked into fasterq command')
          if '--full_cleanup' in cmd['trinity_command']:
              raise SystemExit('Trinity full_cleanup would break restart/output-path contract')
          if '--output' not in cmd['trinity_command'] or '/trinity' not in cmd['trinity_command']:
              raise SystemExit('Trinity output directory missing')
          local = Path('/tmp/chang2026_hpc_bundle/run_first_sample_local.sh').read_text()
          if '--preflight-only' not in local or 'summarize_chang2026_transcriptome_qc.py' not in local:
              raise SystemExit('Execution bundle lost preflight/QC')
          if '--delete-raw-after-success' in local or '--delete-sra-after-success' in local:
              raise SystemExit('First pilot must preserve SRA and raw reads')

          print('first_sample=NH_ccy3835')
          print('first_run=SRR35152735')
          print('first_sample_min_free_disk_gib=50')
          print('restartable_prefetch=true')
          print('vdb_validate=true')
          print('fasterq_explicit_scratch=true')
          print('trinity_full_cleanup=false')
          PY

      - name: Upload restartable pilot package
        uses: actions/upload-artifact@v4
        with:
          name: chang2026-restartable-pilot-${{ github.run_id }}
          path: |
            /tmp/chang2026_hpc_bundle/
            /tmp/chang2026_restartable_NH/
            /tmp/chang2026_restartable_six/
            /tmp/chang2026_resource_plan/
          if-no-files-found: error
          retention-days: 90
