name: Run Chapter 2 orientation geography causal boundary v1

on:
  pull_request:
    paths:
      - "analysis/run_chapter2_orientation_geography_causal_boundary_v1.py"
      - "data/evidence/chapter2_orientation_geography_causal_boundary_contract_v1.json"
      - ".github/workflows/run-chapter2-orientation-geography-causal-boundary-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis runtime
        run: |
          python -m pip install --disable-pip-version-check numpy pandas scipy biopython
          python -m pip check
      - name: Verify frozen source artifacts
        run: |
          set -euo pipefail
          test "$(gh api repos/zuizui0223/EAzami/actions/artifacts/9516784077 --jq .digest)" = "sha256:cb5717c90cbc769398f9ffce38787704a02e34253c1ff16cf8f368ba55aeda96"
          test "$(gh api repos/zuizui0223/EAzami/actions/artifacts/9520157997 --jq .digest)" = "sha256:819936ceeb6008f356c580622fb72972617700402afaa3d3ab125bff2e6d9106"
          test "$(gh api repos/zuizui0223/EAzami/actions/artifacts/9486643703 --jq .digest)" = "sha256:d90f30e4fcc3a2a0296a7d0cfa13d0f3ecc008b36d28298ac9782a001e6f63c5"
      - name: Recover frozen occurrence and topology assets
        run: |
          mkdir -p recovered/japan recovered/taiwan recovered/au .tmp/geography
          gh run download 32716015605 --name fdt4-japan-orientation-niche-v1 --dir recovered/japan
          gh run download 32725842871 --name fdt4-taiwan-orientation-niche-v1 --dir recovered/taiwan
          gh run download 32614839764 --name comp1061-alt-topology-au-32614839764 --dir recovered/au
      - name: Compile analyses
        run: |
          python -m py_compile analysis/run_chapter2_orientation_environment_counterfactual_v1.py
          python -m py_compile analysis/run_chapter2_orientation_geography_causal_boundary_v1.py
      - name: Reproduce frozen base counterfactual assignments
        run: |
          python analysis/run_chapter2_orientation_environment_counterfactual_v1.py \
            --contract data/evidence/chapter2_orientation_environment_counterfactual_contract_v1.json \
            --occurrences recovered/japan/focal_occurrences_environment_complete.csv recovered/taiwan/focal_occurrences_environment_complete.csv \
            --orientation data/evidence/orientation_comp1061_20tip_source_crosswalk_v1.csv \
            --au-trees recovered/au/au.trees \
            --frozen-ecology data/evidence/chapter2_ecological_explanatory_reach_v1.json \
            --out-json .tmp/geography/base_counterfactual.json \
            --out-csv .tmp/geography/base_assignments.csv
      - name: Run geography-conditioned causal-boundary tests
        run: |
          python analysis/run_chapter2_orientation_geography_causal_boundary_v1.py \
            --contract data/evidence/chapter2_orientation_geography_causal_boundary_contract_v1.json \
            --counterfactual-result .tmp/geography/base_counterfactual.json \
            --counterfactual-assignments .tmp/geography/base_assignments.csv \
            --japan-occurrences recovered/japan/focal_occurrences_environment_complete.csv \
            --taiwan-occurrences recovered/taiwan/focal_occurrences_environment_complete.csv \
            --au-trees recovered/au/au.trees \
            --out-json .tmp/geography/result.json \
            --out-csv .tmp/geography/assignments_geography.csv
      - name: Validate output structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('.tmp/geography/result.json').read_text())
          assert x['version']=='chapter2_orientation_geography_causal_boundary_result_v1'
          assert x['classification'] in {
              'bio15_persists_beyond_coarse_geography_and_history',
              'bio15_persists_regionally_but_not_beyond_joint_history_geography',
              'bio15_correspondence_geographically_fragile',
          }
          assert x['japan_only']['chelsa_bio15']['n_taxa']==7
          assert x['counterfactual_geography']['recurrence_matched_n']==40
          assert x['counterfactual_geography']['quartile_n']==10
          print(json.dumps(x, indent=2))
          PY
      - name: Upload geography causal-boundary outputs
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-orientation-geography-causal-boundary-v1
          path: .tmp/geography/
          if-no-files-found: error
          retention-days: 90
