name: Run public-candidate empirical quartet

on:
  pull_request:
    paths:
      - "analysis/build_matched_baseline_comp1061_pack.py"
      - "analysis/prepare_public_candidate_empirical_quartet.py"
      - "analysis/prepare_public_candidate_empirical_quartet_tree_inputs.py"
      - "analysis/summarize_public_candidate_empirical_quartet.py"
      - "analysis/build_public_sra_comp1061_candidate_pack.py"
      - "analysis/materialize_frozen_moreyra_reconciliation.py"
      - "analysis/materialize_frozen_public_candidate_locus_pack.py"
      - "analysis/build_japan_origin_global_public_panel_v2.py"
      - "analysis/recover_comp1061_original_hybpiper_reference.py"
      - "analysis/recover_moreyra_author_repository.py"
      - "analysis/summarize_moreyra_locus_filter.py"
      - "analysis/export_moreyra_locus_manifests.py"
      - "data/evidence/public_candidate_locus_packs_v1/**"
      - "data/evidence/moreyra2025_cirsium_reconciliation_v1/**"
      - ".github/workflows/run-public-candidate-empirical-quartet.yml"
  workflow_dispatch:

concurrency:
  group: public-candidate-empirical-quartet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and test empirical quartet code
        run: |
          python -m py_compile \
            analysis/build_matched_baseline_comp1061_pack.py \
            analysis/prepare_public_candidate_empirical_quartet.py \
            analysis/prepare_public_candidate_empirical_quartet_tree_inputs.py \
            analysis/summarize_public_candidate_empirical_quartet.py \
            analysis/build_public_sra_comp1061_candidate_pack.py
          python -m unittest \
            tests/test_summarize_public_candidate_empirical_quartet.py \
            tests/test_build_public_sra_comp1061_candidate_pack.py \
            -v

      - name: Rebuild 294 panel and resolve exact matched baseline samples
        run: |
          set -euo pipefail
          mkdir -p /tmp/quartet/panel /tmp/quartet/reference_bundle
          python analysis/materialize_frozen_moreyra_reconciliation.py \
            --output /tmp/quartet/moreyra2025_all_sample_reconciliation.csv
          python analysis/build_japan_origin_global_public_panel_v2.py \
            --moreyra-reconciliation /tmp/quartet/moreyra2025_all_sample_reconciliation.csv \
            --outdir /tmp/quartet/panel
          python - <<'PY'
          import csv
          from pathlib import Path
          panel=Path('/tmp/quartet/panel/japan_origin_global_public_panel_v2.csv')
          rows=list(csv.DictReader(panel.open(encoding='utf-8-sig',newline='')))
          expected={
              'YOSHINOI':{
                  'taxon':'Cirsium nipponicum var. yoshinoi',
                  'tip_id':'MRY_YOSHINOI',
                  'run':'SRR30887222',
                  'biosample':'SAMN44017955',
              },
              'SAIRAMENSE':{
                  'taxon':'Cirsium sairamense',
                  'tip_id':'MRY_SAIRAMENSE',
                  'run':'SRR25265647',
                  'biosample':'SAMN34240330',
              },
          }
          out=[]
          for pair_id,e in expected.items():
              hits=[r for r in rows if r['analysis_taxon_label']==e['taxon']]
              if len(hits)!=1:
                  raise SystemExit(f"{e['taxon']}: expected one exact 294-baseline row, observed {len(hits)}")
              r=hits[0]
              observed={
                  'run':r['run_accessions'],
                  'biosample':r['biosample'],
                  'assay':r['assay'],
                  'run_count':r['run_count'],
              }
              if observed != {
                  'run':e['run'],
                  'biosample':e['biosample'],
                  'assay':'Compositae1061_target_capture',
                  'run_count':'1',
              }:
                  raise SystemExit(f'{pair_id}: matched baseline provenance drift: {observed}')
              out.append({
                  'pair_id':pair_id,
                  'tip_id':e['tip_id'],
                  'scientific_name':e['taxon'],
                  'panel_id':r['panel_id'],
                  'biosample':r['biosample'],
                  'run':r['run_accessions'],
                  'voucher':r['voucher'],
                  'japan38_member_ids':r['japan38_member_ids'],
              })
          dest=Path('/tmp/quartet/reference_bundle/matched_baseline_manifest.csv')
          with dest.open('w',encoding='utf-8',newline='') as h:
              w=csv.DictWriter(h,fieldnames=list(out[0])); w.writeheader(); w.writerows(out)
          print('matched_baseline_samples=2')
          for row in out: print(row)
          PY

      - name: Recover pinned reference and conservative 241-locus set
        run: |
          set -euo pipefail
          mkdir -p /tmp/quartet/reference /tmp/quartet/moreyra_author_repo /tmp/quartet/locus_sets
          python analysis/recover_comp1061_original_hybpiper_reference.py \
            --outdir /tmp/quartet/reference
          python analysis/recover_moreyra_author_repository.py \
            --outdir /tmp/quartet/moreyra_author_repo --force
          python analysis/summarize_moreyra_locus_filter.py \
            --audit-dir /tmp/quartet/moreyra_author_repo \
            --output /tmp/quartet/moreyra_author_repo/paralog_locus_filter_reconstruction.csv \
            --summary /tmp/quartet/moreyra_author_repo/locus_filter_reconstruction_summary.json \
            --sample-difference /tmp/quartet/moreyra_author_repo/sample_matrix_membership_difference.csv
          python analysis/export_moreyra_locus_manifests.py \
            --input /tmp/quartet/moreyra_author_repo/paralog_locus_filter_reconstruction.csv \
            --outdir /tmp/quartet/locus_sets
          test -s /tmp/quartet/reference/comp1061_hybpiper_reference.fasta
          echo '77d510ef101d08a7a23a4df391d077d3b7f75482c66f7f4bea6d32cf290ced2c  /tmp/quartet/reference/comp1061_hybpiper_reference.fasta' | sha256sum -c -
          test "$(wc -l < /tmp/quartet/locus_sets/moreyra_conservative_241_no_warning_loci.txt)" -eq 241
          cp /tmp/quartet/reference/comp1061_hybpiper_reference.fasta /tmp/quartet/reference_bundle/
          cp /tmp/quartet/locus_sets/moreyra_conservative_241_no_warning_loci.txt /tmp/quartet/reference_bundle/
          sha256sum /tmp/quartet/reference_bundle/* > /tmp/quartet/reference_bundle/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: public-candidate-quartet-reference-${{ github.run_id }}
          path: /tmp/quartet/reference_bundle
          if-no-files-found: error
          retention-days: 30

  recover-baseline:
    needs: prepare-reference
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pair_id: [YOSHINOI, SAIRAMENSE]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: public-candidate-quartet-reference-${{ github.run_id }}
          path: /tmp/quartet/reference_bundle

      - name: Resolve matched baseline metadata
        env:
          PAIR_ID: ${{ matrix.pair_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, os
          rows=list(csv.DictReader(open('/tmp/quartet/reference_bundle/matched_baseline_manifest.csv',encoding='utf-8-sig')))
          hits=[r for r in rows if r['pair_id']==os.environ['PAIR_ID']]
          if len(hits)!=1: raise SystemExit(f"{os.environ['PAIR_ID']}: expected one matched row")
          r=hits[0]
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as out:
              for env,field in [
                  ('TIP_ID','tip_id'),('SCIENTIFIC_NAME','scientific_name'),('PANEL_ID','panel_id'),
                  ('RUN_ACCESSION','run'),('BIOSAMPLE','biosample')
              ]:
                  out.write(f'{env}={r[field]}\n')
          print(r)
          PY

      - name: Create pinned HybPiper environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: quartet-hybpiper
          create-args: >-
            python=3.11
            hybpiper=2.3.4
            sra-tools
            fastp
            pigz
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          init-shell: none
          generate-run-shell: true
          cache-environment: true
          cache-downloads: true
          post-cleanup: all

      - name: Download and trim real baseline public reads
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          ROOT="/tmp/quartet/${TIP_ID}"
          mkdir -p "$ROOT"/{sra,raw,trimmed,scratch,hybpiper,retrieved,pack/diagnostics}
          prefetch "$RUN_ACCESSION" --max-size u --output-directory "$ROOT/sra"
          SRA=$(find "$ROOT/sra" -name "${RUN_ACCESSION}.sra" -print -quit)
          test -s "$SRA"
          vdb-validate "$SRA"
          fasterq-dump "$SRA" \
            --split-files \
            -e 4 \
            -t "$ROOT/scratch" \
            -O "$ROOT/raw"
          test -s "$ROOT/raw/${RUN_ACCESSION}_1.fastq"
          test -s "$ROOT/raw/${RUN_ACCESSION}_2.fastq"
          fastp \
            -i "$ROOT/raw/${RUN_ACCESSION}_1.fastq" \
            -I "$ROOT/raw/${RUN_ACCESSION}_2.fastq" \
            -o "$ROOT/trimmed/${TIP_ID}.R1.fastq.gz" \
            -O "$ROOT/trimmed/${TIP_ID}.R2.fastq.gz" \
            --thread 4 \
            --detect_adapter_for_pe \
            --json "$ROOT/trimmed/fastp.json" \
            --html "$ROOT/trimmed/fastp.html"
          test -s "$ROOT/trimmed/${TIP_ID}.R1.fastq.gz"
          test -s "$ROOT/trimmed/${TIP_ID}.R2.fastq.gz"
          rm -rf "$ROOT/raw" "$ROOT/sra" "$ROOT/scratch"

      - name: Recover real Compositae1061 loci with HybPiper BWA
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          ROOT="/tmp/quartet/${TIP_ID}"
          TARGET=/tmp/quartet/reference_bundle/comp1061_hybpiper_reference.fasta
          cd "$ROOT/hybpiper"
          hybpiper assemble \
            -t_dna "$TARGET" \
            -r "$ROOT/trimmed/${TIP_ID}.R1.fastq.gz" "$ROOT/trimmed/${TIP_ID}.R2.fastq.gz" \
            --prefix "$TIP_ID" \
            --cpu 4 \
            --bwa \
            --no_intronerate \
            2>&1 | tee "$ROOT/pack/diagnostics/assemble.stdout.log"
          printf '%s\n' "$TIP_ID" > sample_names.txt
          hybpiper retrieve_sequences dna \
            -t_dna "$TARGET" \
            --sample_names sample_names.txt \
            --hybpiper_dir . \
            --fasta_dir "$ROOT/retrieved" \
            --cpu 4 \
            2>&1 | tee "$ROOT/pack/diagnostics/retrieve.stdout.log"
          hybpiper paralog_retriever sample_names.txt \
            -t_dna "$TARGET" \
            --hybpiper_dir . \
            --fasta_dir_all "$ROOT/paralogs_all" \
            --paralog_report_filename "$ROOT/paralog_report" \
            --paralogs_above_threshold_report_filename "$ROOT/paralog_loci_any" \
            --paralogs_list_threshold_percentage 0 \
            --no_heatmap \
            --cpu 4 \
            2>&1 | tee "$ROOT/pack/diagnostics/paralog.stdout.log"
          cd - >/dev/null
          test -s "$ROOT/paralog_report.tsv"

      - name: Build strict matched-baseline pack
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          ROOT="/tmp/quartet/${TIP_ID}"
          python analysis/build_matched_baseline_comp1061_pack.py \
            --tip-id "$TIP_ID" \
            --scientific-name "$SCIENTIFIC_NAME" \
            --biosample "$BIOSAMPLE" \
            --run "$RUN_ACCESSION" \
            --panel-id "$PANEL_ID" \
            --locus-list /tmp/quartet/reference_bundle/moreyra_conservative_241_no_warning_loci.txt \
            --retrieved-dir "$ROOT/retrieved" \
            --paralog-report "$ROOT/paralog_report.tsv" \
            --outdir "$ROOT/pack"
          cp "$ROOT/trimmed/fastp.json" "$ROOT/pack/fastp.json"
          cp "$ROOT/paralog_report.tsv" "$ROOT/pack/paralog_report.tsv"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('/tmp/quartet')/os.environ['TIP_ID']/'pack/matched_baseline_pack_summary.json'
          s=json.loads(p.read_text())
          print(json.dumps(s,indent=2))
          if not s['empirical_pilot_pack_ready'] or s['strict_no_warning_recovered_loci'] < 100:
              raise SystemExit('matched baseline recovered fewer than 100 strict loci')
          if s['tree_tip_promotion_allowed'] or s['accepted_294_panel_changed']:
              raise SystemExit('matched-baseline pilot illegally changed the accepted tree')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: public-candidate-quartet-baseline-${{ matrix.pair_id }}-${{ github.run_id }}
          path: /tmp/quartet/${{ env.TIP_ID }}/pack
          if-no-files-found: error
          retention-days: 30

  infer-quartet:
    needs: recover-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: public-candidate-quartet-reference-${{ github.run_id }}
          path: /tmp/quartet/reference_bundle
      - uses: actions/download-artifact@v4
        with:
          name: public-candidate-quartet-baseline-YOSHINOI-${{ github.run_id }}
          path: /tmp/quartet/baseline/YOSHINOI
      - uses: actions/download-artifact@v4
        with:
          name: public-candidate-quartet-baseline-SAIRAMENSE-${{ github.run_id }}
          path: /tmp/quartet/baseline/SAIRAMENSE

      - name: Materialize frozen real candidate locus packs
        run: |
          set -euo pipefail
          python analysis/materialize_frozen_public_candidate_locus_pack.py \
            --candidate EA01 --output /tmp/quartet/candidates/EA01
          python analysis/materialize_frozen_public_candidate_locus_pack.py \
            --candidate EA02 --output /tmp/quartet/candidates/EA02
          test "$(wc -l < /tmp/quartet/candidates/EA01/strict_recovered_loci.txt)" -eq 236
          test "$(wc -l < /tmp/quartet/candidates/EA02/strict_recovered_loci.txt)" -eq 239

      - name: Create MAFFT and IQ-TREE environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: quartet-tree
          create-args: >-
            python=3.12
            mafft
            iqtree
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          init-shell: none
          generate-run-shell: true
          cache-environment: true
          cache-downloads: true
          post-cleanup: all

      - name: Build exact four-way strict-locus intersection
        run: |
          set -euo pipefail
          mkdir -p /tmp/quartet/analysis/{aligned,gene_trees,concat,result}
          python analysis/prepare_public_candidate_empirical_quartet.py \
            --locus-universe /tmp/quartet/reference_bundle/moreyra_conservative_241_no_warning_loci.txt \
            --baseline-yoshinoi /tmp/quartet/baseline/YOSHINOI \
            --ea01 /tmp/quartet/candidates/EA01 \
            --baseline-sairamense /tmp/quartet/baseline/SAIRAMENSE \
            --ea02 /tmp/quartet/candidates/EA02 \
            --outdir /tmp/quartet/analysis/inputs

      - name: Align all common loci and prepare empirical tree inputs
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          while IFS= read -r locus; do
            mafft --auto --thread 1 "/tmp/quartet/analysis/inputs/loci_unaligned/${locus}.fasta" \
              > "/tmp/quartet/analysis/aligned/${locus}.aln.fasta" 2> /dev/null
          done < /tmp/quartet/analysis/inputs/four_way_common_strict_loci.txt
          python analysis/prepare_public_candidate_empirical_quartet_tree_inputs.py \
            --common-loci /tmp/quartet/analysis/inputs/four_way_common_strict_loci.txt \
            --alignment-dir /tmp/quartet/analysis/aligned \
            --outdir /tmp/quartet/analysis/tree_inputs
          test -s /tmp/quartet/analysis/tree_inputs/informative_loci.txt

      - name: Infer real per-locus and concatenated ML quartet trees
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          while IFS= read -r locus; do
            iqtree2 \
              -s "/tmp/quartet/analysis/aligned/${locus}.aln.fasta" \
              -m JC \
              -T 1 \
              --quiet \
              --redo \
              --prefix "/tmp/quartet/analysis/gene_trees/${locus}"
            test -s "/tmp/quartet/analysis/gene_trees/${locus}.treefile"
          done < /tmp/quartet/analysis/tree_inputs/informative_loci.txt
          iqtree2 \
            -s /tmp/quartet/analysis/tree_inputs/concat.fasta \
            -m MFP \
            -B 1000 \
            --alrt 1000 \
            -T 2 \
            --redo \
            --prefix /tmp/quartet/analysis/concat/quartet_concat
          test -s /tmp/quartet/analysis/concat/quartet_concat.treefile

      - name: Summarize real-read quartet signal
        run: |
          set -euo pipefail
          python analysis/summarize_public_candidate_empirical_quartet.py \
            --common-loci /tmp/quartet/analysis/inputs/four_way_common_strict_loci.txt \
            --gene-tree-loci /tmp/quartet/analysis/tree_inputs/informative_loci.txt \
            --gene-tree-dir /tmp/quartet/analysis/gene_trees \
            --concat-tree /tmp/quartet/analysis/concat/quartet_concat.treefile \
            --output /tmp/quartet/analysis/result/empirical_quartet_summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('/tmp/quartet/analysis/result/empirical_quartet_summary.json').read_text())
          print('EMPIRICAL_QUARTET_RESULT')
          print(json.dumps({k:v for k,v in s.items() if k!='per_locus'},indent=2,ensure_ascii=False))
          if s['full_294_tip_promotion_allowed_from_this_pilot']:
              raise SystemExit('pilot must never authorize full promotion')
          PY

      - name: Preserve empirical products
        run: |
          set -euo pipefail
          cp /tmp/quartet/baseline/YOSHINOI/matched_baseline_pack_summary.json /tmp/quartet/analysis/result/baseline_yoshinoi_pack_summary.json
          cp /tmp/quartet/baseline/SAIRAMENSE/matched_baseline_pack_summary.json /tmp/quartet/analysis/result/baseline_sairamense_pack_summary.json
          cp /tmp/quartet/analysis/inputs/input_summary.json /tmp/quartet/analysis/result/
          cp /tmp/quartet/analysis/tree_inputs/tree_input_summary.json /tmp/quartet/analysis/result/
          cp /tmp/quartet/analysis/tree_inputs/locus_information.csv /tmp/quartet/analysis/result/
          cp /tmp/quartet/analysis/inputs/four_way_common_strict_loci.txt /tmp/quartet/analysis/result/
          cp /tmp/quartet/analysis/tree_inputs/informative_loci.txt /tmp/quartet/analysis/result/
          cp /tmp/quartet/reference_bundle/matched_baseline_manifest.csv /tmp/quartet/analysis/result/
          cp /tmp/quartet/analysis/concat/quartet_concat.treefile /tmp/quartet/analysis/result/
          cp /tmp/quartet/analysis/concat/quartet_concat.iqtree /tmp/quartet/analysis/result/
          cp /tmp/quartet/analysis/concat/quartet_concat.log /tmp/quartet/analysis/result/

      - uses: actions/upload-artifact@v4
        with:
          name: public-candidate-empirical-quartet-${{ github.run_id }}
          path: /tmp/quartet/analysis/result
          if-no-files-found: error
          retention-days: 90
