name: Run Chapter 2 lineage differentiation environment atlas v1

on:
  pull_request:
    paths:
      - "analysis/extract_chapter2_paleopgem_regional_series_v1.py"
      - "analysis/run_chapter2_lineage_differentiation_environment_atlas_v1.py"
      - "data/evidence/chapter2_lineage_differentiation_environment_atlas_contract_v1.json"
      - ".github/workflows/run-chapter2-lineage-differentiation-environment-atlas-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {bio: 1, md5: "570e4b746e0b9c0cf82a2a5f85a6cff9"}
          - {bio: 4, md5: "b6f90b330e4161b983d735b7f9f7a01f"}
          - {bio: 5, md5: "b3b306381246b6d424e29fa7cca48223"}
          - {bio: 6, md5: "99da22a9bb45bcda5a20da0060ca3354"}
          - {bio: 7, md5: "97a13b32ff74e3ee317ccc8a914c87f8"}
          - {bio: 8, md5: "203283ff78e17edf8c8eae2a2bb9aca8"}
          - {bio: 9, md5: "3b0138cc3cad6a3afdabdac50e4f6b9d"}
          - {bio: 10, md5: "4aaa4af51acaaf97f380f03f1d8bad76"}
          - {bio: 11, md5: "e8a516fedea51a2073a382c3c170357f"}
          - {bio: 12, md5: "b029ef3f40d666e3d96ec1d9f42bef54"}
          - {bio: 13, md5: "93ac729f11e953a3b15946cf0ffe66ff"}
          - {bio: 14, md5: "8f5b5b2a2668086d11dfe547c2ed9332"}
          - {bio: 15, md5: "f4c8d91815816f42959b90d512ac8b8e"}
          - {bio: 16, md5: "67b15bf2325a615a3d30fc4ca84aa9c2"}
          - {bio: 17, md5: "898c4d6564e09164f20082fe59618b55"}
          - {bio: 18, md5: "5200b68faeb9a9910627f3928776cc2b"}
          - {bio: 19, md5: "c99c1d8dc289f9ff365631346c390c98"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install extraction dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas xarray netCDF4
          python -m py_compile analysis/extract_chapter2_paleopgem_regional_series_v1.py
      - name: Download frozen PALEO-PGEM BIO${{ matrix.bio }} mean field
        run: |
          set -euo pipefail
          mkdir -p /tmp/paleo /tmp/out
          f="PALEO-PGEM-Series_bio${{ matrix.bio }}_mean.nc"
          curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors \
            "https://zenodo.org/records/21327244/files/${f}?download=1" \
            -o "/tmp/paleo/${f}"
          echo "${{ matrix.md5 }}  /tmp/paleo/${f}" | md5sum -c -
      - name: Extract predeclared regional median series
        run: |
          set -euo pipefail
          f="PALEO-PGEM-Series_bio${{ matrix.bio }}_mean.nc"
          python analysis/extract_chapter2_paleopgem_regional_series_v1.py \
            --input "/tmp/paleo/${f}" \
            --variable "BIO${{ matrix.bio }}" \
            --contract data/evidence/chapter2_lineage_differentiation_environment_atlas_contract_v1.json \
            --out "/tmp/out/BIO${{ matrix.bio }}.csv"
          test -s "/tmp/out/BIO${{ matrix.bio }}.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: ch2-lineage-bio-${{ matrix.bio }}-${{ github.run_id }}
          path: /tmp/out/BIO${{ matrix.bio }}.csv
          if-no-files-found: error
          retention-days: 30

  combine:
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas
          python -m py_compile analysis/run_chapter2_lineage_differentiation_environment_atlas_v1.py
      - name: Download all regional-series artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ch2-lineage-bio-*-${{ github.run_id }}
          path: /tmp/series
          merge-multiple: true
      - name: Validate 17-variable extraction set
        run: |
          set -euo pipefail
          test "$(find /tmp/series -maxdepth 1 -name 'BIO*.csv' | wc -l)" -eq 17
          ls -lh /tmp/series
      - name: Run lineage-differentiation climate atlas
        run: |
          set -euo pipefail
          mkdir -p /tmp/result
          python analysis/run_chapter2_lineage_differentiation_environment_atlas_v1.py \
            --series-dir /tmp/series \
            --contract data/evidence/chapter2_lineage_differentiation_environment_atlas_contract_v1.json \
            --out-json /tmp/result/chapter2_lineage_differentiation_environment_atlas_v1.json \
            --out-long-csv /tmp/result/chapter2_lineage_differentiation_environment_atlas_long_v1.csv \
            --out-event-csv /tmp/result/chapter2_lineage_differentiation_environment_event_classes_v1.csv \
            | tee /tmp/result/run_summary.log
      - name: Fail closed on scope and independence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/result/chapter2_lineage_differentiation_environment_atlas_v1.json')
          x=json.loads(p.read_text())
          assert x['n_variables']==17
          assert x['n_events']==6
          assert len(x['representative_events'])==3
          assert set(x['representative_clade_groups'])=={'nipponocirsium','arenicola','sinocirsium'}
          assert x['decision'] in {
              'one_or_more_recurring_lineage_differentiation_context_candidates_detected',
              'no_recurring_lineage_differentiation_context_survives_age_region_background_gates'
          }
          assert len(x['event_univariate_classes'])==6*17*3
          assert len(x['event_multivariate_classes'])==6*3
          text=p.read_text().lower()
          assert 'azami' not in text
          assert x['analysis_scope'].startswith('lineage-diversification context only')
          print(json.dumps({
              'decision':x['decision'],
              'representative_clade_groups':x['representative_clade_groups'],
              'n_recurring_context_candidates':len(x['recurring_context_candidates']),
              'recurring_context_candidates':x['recurring_context_candidates']
          },indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chapter2-lineage-differentiation-environment-atlas-${{ github.run_id }}
          path: /tmp/result
          if-no-files-found: error
          retention-days: 90
