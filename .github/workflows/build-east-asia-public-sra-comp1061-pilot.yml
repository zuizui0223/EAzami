name: Build East Asia public SRA Compositae1061 pilot

on:
  pull_request:
    paths:
      - "data/evidence/east_asia_public_sra_augmentation_candidates_v1.csv"
      - "analysis/build_public_sra_comp1061_candidate_pack.py"
      - "tests/test_build_public_sra_comp1061_candidate_pack.py"
      - "analysis/recover_comp1061_original_hybpiper_reference.py"
      - "analysis/recover_moreyra_author_repository.py"
      - "analysis/summarize_moreyra_locus_filter.py"
      - "analysis/export_moreyra_locus_manifests.py"
      - ".github/workflows/build-east-asia-public-sra-comp1061-pilot.yml"
  workflow_dispatch:

concurrency:
  group: east-asia-public-sra-comp1061-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and unit test candidate pack builder
        run: |
          python -m py_compile analysis/build_public_sra_comp1061_candidate_pack.py
          python -m unittest tests/test_build_public_sra_comp1061_candidate_pack.py -v
      - name: Recover frozen reference and 241-locus universe
        run: |
          set -euo pipefail
          mkdir -p /tmp/eapilot/reference /tmp/eapilot/moreyra_author_repo /tmp/eapilot/locus_sets /tmp/eapilot/reference_bundle
          python analysis/recover_comp1061_original_hybpiper_reference.py --outdir /tmp/eapilot/reference
          python analysis/recover_moreyra_author_repository.py --outdir /tmp/eapilot/moreyra_author_repo --force
          python analysis/summarize_moreyra_locus_filter.py \
            --audit-dir /tmp/eapilot/moreyra_author_repo \
            --output /tmp/eapilot/moreyra_author_repo/paralog_locus_filter_reconstruction.csv \
            --summary /tmp/eapilot/moreyra_author_repo/locus_filter_reconstruction_summary.json \
            --sample-difference /tmp/eapilot/moreyra_author_repo/sample_matrix_membership_difference.csv
          python analysis/export_moreyra_locus_manifests.py \
            --input /tmp/eapilot/moreyra_author_repo/paralog_locus_filter_reconstruction.csv \
            --outdir /tmp/eapilot/locus_sets
          test -s /tmp/eapilot/reference/comp1061_hybpiper_reference.fasta
          echo '77d510ef101d08a7a23a4df391d077d3b7f75482c66f7f4bea6d32cf290ced2c  /tmp/eapilot/reference/comp1061_hybpiper_reference.fasta' | sha256sum -c -
          test "$(wc -l < /tmp/eapilot/locus_sets/moreyra_conservative_241_no_warning_loci.txt)" -eq 241
          cp /tmp/eapilot/reference/comp1061_hybpiper_reference.fasta /tmp/eapilot/reference_bundle/
          cp /tmp/eapilot/locus_sets/moreyra_conservative_241_no_warning_loci.txt /tmp/eapilot/reference_bundle/
          cp data/evidence/east_asia_public_sra_augmentation_candidates_v1.csv /tmp/eapilot/reference_bundle/
          sha256sum /tmp/eapilot/reference_bundle/* > /tmp/eapilot/reference_bundle/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: east-asia-public-sra-comp1061-reference-${{ github.run_id }}
          path: /tmp/eapilot/reference_bundle
          if-no-files-found: error

  recover-candidate:
    needs: prepare-reference
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        candidate_id: [EA01, EA02, EA03, EA04, EA05]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: east-asia-public-sra-comp1061-reference-${{ github.run_id }}
          path: /tmp/eapilot/reference_bundle
      - name: Resolve frozen candidate metadata
        env:
          CANDIDATE_ID: ${{ matrix.candidate_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, os
          from pathlib import Path
          cid=os.environ['CANDIDATE_ID']
          path=Path('/tmp/eapilot/reference_bundle/east_asia_public_sra_augmentation_candidates_v1.csv')
          with path.open(encoding='utf-8-sig',newline='') as h:
              hits=[r for r in csv.DictReader(h) if r['candidate_id']==cid]
          if len(hits)!=1: raise SystemExit(f'{cid}: expected one manifest row, found {len(hits)}')
          r=hits[0]
          if r['pilot_execute'].strip().lower()!='true': raise SystemExit(f'{cid}: pilot_execute is not true')
          if r['library_layout'].strip().upper()!='PAIRED': raise SystemExit(f'{cid}: bounded pilot currently requires PAIRED')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as out:
              for key,field in [('TIP_ID','tip_id'),('RUN_ACCESSION','run'),('BIOSAMPLE','biosample'),('BIOPROJECT','bioproject')]:
                  value=r[field].strip()
                  if not value: raise SystemExit(f'{cid}: missing {field}')
                  out.write(f'{key}={value}\n')
          print({k:r[k] for k in ('candidate_id','tip_id','scientific_name','biosample','run','library_strategy','size_mb')})
          PY
      - name: Create pinned HybPiper/Bioconda execution environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: hybpiper-pilot
          create-args: >-
            python=3.11
            hybpiper=2.3.4
            sra-tools
            fastp
            pigz
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          init-shell: none
          generate-run-shell: true
          cache-environment: true
          cache-downloads: true
          post-cleanup: all
      - name: Verify pinned SRA and HybPiper toolchain
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          hybpiper --version
          prefetch --version
          fasterq-dump --version
          fastp --version
          bwa 2>&1 | head -n 2 || true
          samtools --version | head -n 1
          blastx -version | head -n 1
          spades.py --version
          command -v exonerate
      - name: Download, validate and trim public reads
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p /tmp/eapilot/${TIP_ID}/{sra,raw,trimmed,scratch,hybpiper,retrieved,pack}
          prefetch "$RUN_ACCESSION" --output-directory "/tmp/eapilot/${TIP_ID}/sra"
          SRA=$(find "/tmp/eapilot/${TIP_ID}/sra" -name "${RUN_ACCESSION}.sra" -print -quit)
          test -s "$SRA"
          vdb-validate "$SRA"
          fasterq-dump "$SRA" \
            --split-files \
            --threads 4 \
            --temp "/tmp/eapilot/${TIP_ID}/scratch" \
            --outdir "/tmp/eapilot/${TIP_ID}/raw"
          test -s "/tmp/eapilot/${TIP_ID}/raw/${RUN_ACCESSION}_1.fastq"
          test -s "/tmp/eapilot/${TIP_ID}/raw/${RUN_ACCESSION}_2.fastq"
          fastp \
            -i "/tmp/eapilot/${TIP_ID}/raw/${RUN_ACCESSION}_1.fastq" \
            -I "/tmp/eapilot/${TIP_ID}/raw/${RUN_ACCESSION}_2.fastq" \
            -o "/tmp/eapilot/${TIP_ID}/trimmed/${TIP_ID}.R1.fastq.gz" \
            -O "/tmp/eapilot/${TIP_ID}/trimmed/${TIP_ID}.R2.fastq.gz" \
            --thread 4 \
            --json "/tmp/eapilot/${TIP_ID}/trimmed/fastp.json" \
            --html "/tmp/eapilot/${TIP_ID}/trimmed/fastp.html"
          test -s "/tmp/eapilot/${TIP_ID}/trimmed/${TIP_ID}.R1.fastq.gz"
          test -s "/tmp/eapilot/${TIP_ID}/trimmed/${TIP_ID}.R2.fastq.gz"
          rm -rf "/tmp/eapilot/${TIP_ID}/raw" "/tmp/eapilot/${TIP_ID}/sra" "/tmp/eapilot/${TIP_ID}/scratch"
      - name: Recover Compositae1061 loci with HybPiper BWA
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          TARGET=/tmp/eapilot/reference_bundle/comp1061_hybpiper_reference.fasta
          R1="/tmp/eapilot/${TIP_ID}/trimmed/${TIP_ID}.R1.fastq.gz"
          R2="/tmp/eapilot/${TIP_ID}/trimmed/${TIP_ID}.R2.fastq.gz"
          cd "/tmp/eapilot/${TIP_ID}/hybpiper"
          hybpiper assemble \
            -t_dna "$TARGET" \
            -r "$R1" "$R2" \
            --prefix "$TIP_ID" \
            --cpu 4 \
            --bwa \
            --no_intronerate
          printf '%s\n' "$TIP_ID" > sample_names.txt
          hybpiper retrieve_sequences dna \
            -t_dna "$TARGET" \
            --sample_names sample_names.txt \
            --hybpiper_dir . \
            --fasta_dir "/tmp/eapilot/${TIP_ID}/retrieved" \
            --cpu 4
          hybpiper paralog_retriever sample_names.txt \
            -t_dna "$TARGET" \
            --hybpiper_dir . \
            --fasta_dir_all "/tmp/eapilot/${TIP_ID}/paralogs_all" \
            --paralog_report_filename "/tmp/eapilot/${TIP_ID}/paralog_report" \
            --paralogs_above_threshold_report_filename "/tmp/eapilot/${TIP_ID}/paralog_loci_any" \
            --paralogs_list_threshold_percentage 0 \
            --no_heatmap \
            --cpu 4
          cd - >/dev/null
          test -d "/tmp/eapilot/${TIP_ID}/retrieved"
          test -s "/tmp/eapilot/${TIP_ID}/paralog_report"
      - name: Build strict frozen-241 candidate pack
        shell: micromamba-shell {0}
        env:
          CANDIDATE_ID: ${{ matrix.candidate_id }}
        run: |
          set -euo pipefail
          python analysis/build_public_sra_comp1061_candidate_pack.py \
            --candidate-manifest /tmp/eapilot/reference_bundle/east_asia_public_sra_augmentation_candidates_v1.csv \
            --candidate-id "$CANDIDATE_ID" \
            --locus-list /tmp/eapilot/reference_bundle/moreyra_conservative_241_no_warning_loci.txt \
            --retrieved-dir "/tmp/eapilot/${TIP_ID}/retrieved" \
            --paralog-report "/tmp/eapilot/${TIP_ID}/paralog_report" \
            --outdir "/tmp/eapilot/${TIP_ID}/pack"
          cp "/tmp/eapilot/${TIP_ID}/trimmed/fastp.json" "/tmp/eapilot/${TIP_ID}/pack/"
          cp "/tmp/eapilot/${TIP_ID}/paralog_report" "/tmp/eapilot/${TIP_ID}/pack/paralog_report.tsv"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('/tmp/eapilot')/os.environ['TIP_ID']/'pack/candidate_pack_summary.json'
          s=json.loads(p.read_text())
          print(f"candidate={s['candidate_id']} strict_loci={s['strict_no_warning_recovered_loci']} ready={s['pilot_locus_pack_ready']}")
          assert s['tree_tip_promotion_allowed'] is False
          assert s['primary_294_panel_changed'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: east-asia-public-sra-pack-${{ matrix.candidate_id }}-${{ github.run_id }}
          path: /tmp/eapilot/${{ env.TIP_ID }}/pack
          if-no-files-found: warn

  aggregate:
    if: always()
    needs: [prepare-reference, recover-candidate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: east-asia-public-sra-pack-*-${{ github.run_id }}
          path: /tmp/eapilot/packs
          merge-multiple: false
      - name: Aggregate recovered candidate evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path('/tmp/eapilot/packs')
          summaries=[]
          for p in sorted(root.glob('*/candidate_pack_summary.json')):
              summaries.append(json.loads(p.read_text()))
          out=Path('/tmp/eapilot/aggregate')
          out.mkdir(parents=True,exist_ok=True)
          fields=['candidate_id','tip_id','scientific_name','biosample','run','bioproject','library_strategy','frozen_candidate_loci','recovered_frozen_loci','paralog_warning_loci','strict_no_warning_recovered_loci','pilot_locus_pack_ready','tree_tip_promotion_allowed']
          with (out/'candidate_pack_summary.csv').open('w',encoding='utf-8',newline='') as h:
              w=csv.DictWriter(h,fieldnames=fields)
              w.writeheader()
              for s in summaries: w.writerow({k:s.get(k,'') for k in fields})
          ready=[s['candidate_id'] for s in summaries if s.get('pilot_locus_pack_ready')]
          result={
              'contract_version':'east_asia_public_sra_comp1061_pilot_v1',
              'expected_candidates':['EA01','EA02','EA03','EA04','EA05'],
              'completed_candidate_packs':len(summaries),
              'candidate_packs_ready_ge_100_strict_loci':ready,
              'automatic_tree_tip_promotion_allowed':False,
              'primary_294_panel_changed':False,
              'new_china_sampling_freeze_allowed':False,
              'next_gate':'Intersect each ready pack with the empirically accepted 294-tip current strict loci and run paired baseline-versus-augmentation trees on identical loci.'
          }
          (out/'pilot_summary.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: east-asia-public-sra-comp1061-pilot-summary-${{ github.run_id }}
          path: /tmp/eapilot/aggregate
          if-no-files-found: error
