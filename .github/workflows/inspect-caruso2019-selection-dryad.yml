name: Inspect Caruso 2019 selection Dryad data

on:
  pull_request:
    paths:
      - "analysis/inspect_caruso2019_selection_dryad.py"
      - ".github/workflows/inspect-caruso2019-selection-dryad.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pandas xlrd openpyxl
      - name: Download Dryad dataset through v2 API
        run: |
          mkdir -p data/external/dryad
          curl -fL --retry 3 --retry-delay 2 \
            -H 'Accept: application/zip,application/octet-stream,*/*' \
            -A 'EAzami-reproducibility-audit/1.0' \
            'https://datadryad.org/api/v2/datasets/doi%3A10.5061%2Fdryad.2v8c5g0/download' \
            -o data/external/caruso2019_dryad.zip
          unzip -l data/external/caruso2019_dryad.zip
          unzip -j data/external/caruso2019_dryad.zip '*Exp_stud_NOTdup_Dryad.xls' -d data/external/dryad
          ls -lh data/external/dryad/Exp_stud_NOTdup_Dryad.xls
      - name: Inspect schema and coding
        run: python analysis/inspect_caruso2019_selection_dryad.py data/external/dryad/Exp_stud_NOTdup_Dryad.xls
      - uses: actions/upload-artifact@v4
        with:
          name: caruso2019-dryad-schema
          path: results/caruso2019_dryad_schema.json
