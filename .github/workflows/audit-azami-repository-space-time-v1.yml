name: Audit Azami repository for Chapter 2 space-time v1

on:
  pull_request:
    paths:
      - "analysis/audit_chapter2_space_time_public_data_v1.py"
      - "data/evidence/chapter2_space_time_public_data_contract_v1.json"
      - ".github/workflows/audit-azami-repository-space-time-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit_azami:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/azami
          ref: main
          path: public_azami_repo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas
          python -m pip check
      - name: Freeze inspected Azami commit
        run: |
          mkdir -p output/azami_repo_audit
          git -C public_azami_repo rev-parse HEAD | tee output/azami_repo_audit/azami_main_commit.txt
          git -C public_azami_repo status --short
      - name: Audit all structured/text result surfaces
        run: |
          set -euo pipefail
          python analysis/audit_chapter2_space_time_public_data_v1.py \
            --azami-root public_azami_repo \
            --azami-path data/evidence/source/azami_capitulum_space_eazami_targets_run33035785120.csv \
            --eazami-ecology data/evidence/chapter2_ecological_explanatory_reach_v1.json \
            --space-time-contract data/evidence/chapter2_space_time_public_data_contract_v1.json \
            --out-dir output/azami_repo_audit
      - name: Summarize candidate density
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          p=json.loads(Path('output/azami_repo_audit/chapter2_space_time_public_data_audit_v1.json').read_text())
          c=pd.read_csv('output/azami_repo_audit/chapter2_space_time_azami_candidate_records_v1.csv')
          assert p['azami_files_scanned']>0
          print(Path('output/azami_repo_audit/azami_main_commit.txt').read_text().strip())
          print(json.dumps(p,indent=2,ensure_ascii=False))
          for question, q in c.groupby('question', sort=True):
              print('\n###',question,'n=',len(q))
              print(q.head(100).to_string(index=False,max_colwidth=180))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter2-azami-repository-space-time-audit-v1
          path: output/azami_repo_audit
          if-no-files-found: error
          retention-days: 90
