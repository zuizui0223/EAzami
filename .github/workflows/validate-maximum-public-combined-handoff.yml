name: Validate maximum public combined-tree handoff

on:
  pull_request:
    paths:
      - "analysis/build_maximum_public_combined_hpc_bundle.py"
      - "analysis/prepare_maximum_public_combined_tree_inputs.py"
      - "analysis/summarize_maximum_public_combined_sensitivities.py"
      - "analysis/build_maximum_public_nuclear_hpc_handoff.py"
      - "workflow/public_nuclear_maximum/prepare_combined_after_independent_pass.sh"
      - "tests/test_build_maximum_public_combined_hpc_bundle.py"
      - "tests/test_prepare_maximum_public_combined_tree_inputs.py"
      - "data/evidence/public_candidate_locus_packs_v1/**"
      - ".github/workflows/validate-maximum-public-combined-handoff.yml"
  workflow_dispatch:

concurrency:
  group: maximum-public-combined-handoff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and run post-admission tests
        run: |
          bash -n workflow/public_nuclear_maximum/prepare_combined_after_independent_pass.sh
          python -m py_compile \
            analysis/build_maximum_public_combined_hpc_bundle.py \
            analysis/prepare_maximum_public_combined_tree_inputs.py \
            analysis/summarize_maximum_public_combined_sensitivities.py
          python -m unittest \
            tests/test_build_maximum_public_combined_hpc_bundle.py \
            tests/test_prepare_maximum_public_combined_tree_inputs.py \
            -v

      - name: Build maximum-public base handoff and dormant combined bundle
        run: |
          python analysis/build_maximum_public_nuclear_hpc_handoff.py \
            --outdir /tmp/maximum_public_nuclear_handoff
          PREPARE_ONLY=1 bash workflow/public_nuclear_maximum/prepare_combined_after_independent_pass.sh \
            /tmp/maximum_public_nuclear_handoff \
            /tmp/maximum_public_combined_bundle
          while IFS= read -r -d '' f; do bash -n "$f"; done < <(find /tmp/maximum_public_combined_bundle -type f -name '*.sh' -print0)

      - name: Validate dormant bundle contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          b=Path('/tmp/maximum_public_combined_bundle')
          m=json.loads((b/'execution_manifest.json').read_text())
          assert m['bundle_version']=='maximum_public_combined_hpc_bundle_v1'
          assert m['prerequisite_independent_gate_contract']=='maximum_public_nuclear_independent_gate_summary_v1'
          assert m['independent_candidates_required_to_pass']==['EA01','EA02','CNIPG']
          assert m['baseline_focal_tips']==294
          assert m['scenario_count']==8
          assert m['scenarios']==[
            'baseline294','ea01_295','ea02_295','cnipg_295',
            'ea01_ea02_296','ea01_cnipg_296','ea02_cnipg_296','ea01_ea02_cnipg_297'
          ]
          assert m['mapping_modes']==['bwa','blastx']
          assert m['minimum_four_way_common_loci']==100
          assert m['all_scenarios_same_locus_set_within_mode'] is True
          assert m['bwa_candidate_packs_frozen_in_bundle'] is True
          assert m['blastx_ea01_ea02_packs_from_independent_heavy_run'] is True
          assert m['cnipg_pack_fixed_across_mapping_modes'] is True
          assert m['combined_297_acceptance_pre_authorized'] is False
          assert m['new_analysis_taxon_labels_added']==0
          assert m['new_china_sampling_freeze_allowed'] is False
          submit=(b/'submit_combined_after_independent_pass.sh').read_text()
          assert "independent_candidate_gate_results']=={'EA01':True,'EA02':True,'CNIPG':True}" in submit
          assert 'submit_mode bwa' in submit and 'submit_mode blastx' in submit
          assert 'combined_cross_mapping_summary' in submit
          print(json.dumps(m,indent=2))
          PY

      - name: Prove submission gate rejects incomplete independent admission
        run: |
          mkdir -p /tmp/mock_max_fail
          cat > /tmp/mock_max_fail/independent_gate_summary.json <<'JSON'
          {
            "contract_version": "maximum_public_nuclear_independent_gate_summary_v1",
            "independent_candidate_gate_results": {"EA01": true, "EA02": false, "CNIPG": true},
            "all_three_independent_gates_passed": false,
            "combined_296_or_297_tree_accepted": false,
            "combined_common_paired_locus_tree_required": false,
            "new_china_sampling_freeze_allowed": false
          }
          JSON
          set +e
          MAXIMUM_PUBLIC_ROOT=/tmp/mock_max_fail \
            bash /tmp/maximum_public_combined_bundle/submit_combined_after_independent_pass.sh \
            >/tmp/submit_fail.out 2>/tmp/submit_fail.err
          status=$?
          set -e
          test "$status" -ne 0
          echo "incomplete_independent_admission_submission_blocked=true"

      - name: Exercise all-pass combined sensitivity summarizer
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0,'analysis')
          import summarize_maximum_public_combined_sensitivities as s
          root=Path('/tmp/combined_synthetic_pass')
          for mode,n in [('bwa',120),('blastx',110)]:
              paired=root/mode/'paired_inputs'; ev=root/mode/'evaluation'; paired.mkdir(parents=True,exist_ok=True); ev.mkdir(parents=True,exist_ok=True)
              (paired/'combined_input_summary.json').write_text(json.dumps({
                'contract_version':'maximum_public_combined_tree_inputs_v1',
                'independent_gate_prerequisite_passed':True,
                'four_way_common_paired_loci':n,
                'minimum_four_way_common_loci':100,
                'all_eight_scenarios_use_identical_locus_set':True,
                'scenario_count':8,
                'combined_tree_acceptance_pre_authorized':False,
              }))
              for scenario,candidates in s.SCENARIOS.items():
                  for cid in candidates:
                      (ev/f'{scenario}_{cid}_concat.json').write_text(json.dumps({
                        'shared_baseline_focal_tips':294,
                        'unrooted_rf_distance_on_shared_baseline_tips':0,
                        'exact_shared_tip_backbone_invariance':True,
                        'same_taxon_among_nearest_baseline_tips':True,
                        'candidate_nearest_baseline_tip_ids':['JOG0001'],
                      }))
                  (ev/f'{scenario}_astral_backbone.json').write_text(json.dumps({
                    'unrooted_rf_distance_on_shared_species':0,
                    'exact_shared_species_backbone_invariance':True,
                  }))
          result=s.summarize(root)
          assert result['all_modes_all_subset_scenarios_passed'] is True
          assert result['combined_297_sample_tree_acceptance_allowed'] is True
          assert result['resulting_sample_level_tip_count_if_accepted']==297
          assert result['new_analysis_taxon_labels_added_if_accepted']==0
          assert result['new_china_sampling_freeze_allowed'] is False
          assert result['flower_colour_history_claim_changed_by_this_gate'] is False
          print(json.dumps(result,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: maximum-public-combined-handoff-${{ github.run_id }}
          path: /tmp/maximum_public_combined_bundle/
          if-no-files-found: error
          retention-days: 30
