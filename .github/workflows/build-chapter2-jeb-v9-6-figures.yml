name: Build Chapter 2 JEB V9.6 main figures

on:
  pull_request:
    paths:
      - "analysis/make_chapter2_jeb_figures_v9_6.py"
      - "docs/chapter2/V9_6_FIGURE_MAP_AND_CLAIM_ARCHITECTURE.md"
      - ".github/workflows/build-chapter2-jeb-v9-6-figures.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install plotting runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install matplotlib numpy
          python -m py_compile analysis/make_chapter2_jeb_figures_v9_6.py
      - name: Generate V9.6 main figures
        run: |
          mkdir -p /tmp/v9_6_figures
          python analysis/make_chapter2_jeb_figures_v9_6.py --out /tmp/v9_6_figures
          for f in \
            figure1_v9_6_repeated_components.png figure1_v9_6_repeated_components.pdf \
            figure2_v9_6_unequal_depth.png figure2_v9_6_unequal_depth.pdf \
            figure3_v9_6_shared_localization.png figure3_v9_6_shared_localization.pdf \
            figure4_v9_6_scale_conditioned_ecology.png figure4_v9_6_scale_conditioned_ecology.pdf \
            v9_6_main_figure_manifest.json; do
            test -s "/tmp/v9_6_figures/$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: chapter2-jeb-v9-6-main-figures
          path: /tmp/v9_6_figures/
          if-no-files-found: error
          retention-days: 90
