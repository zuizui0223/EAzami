name: Recover Chang 2026 takaoense Figure 1

on:
  pull_request:
    paths:
      - "analysis/recover_chang2026_takaoense_figure.py"
      - "analysis/download_chang2026_figure1_image.py"
      - "tests/test_recover_chang2026_takaoense_figure.py"
      - "tests/test_download_chang2026_figure1_image.py"
      - ".github/workflows/recover-chang2026-takaoense-figure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image reader
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Compile and run offline tests
        run: |
          python -m py_compile \
            analysis/recover_chang2026_takaoense_figure.py \
            analysis/download_chang2026_figure1_image.py
          python -m unittest \
            tests/test_recover_chang2026_takaoense_figure.py \
            tests/test_download_chang2026_figure1_image.py \
            -v

      - name: Recover official full-size Figure 1 image
        run: |
          python analysis/download_chang2026_figure1_image.py \
            --outdir data/evidence/generated/chang2026_takaoense_figure \
            --force

      - name: Create six-voucher review table without geographic inference
        run: |
          python - <<'PY'
          from pathlib import Path
          from analysis.recover_chang2026_takaoense_figure import (
              OUTPUT_FIELDS,
              build_tip_rows,
              write_csv,
          )

          outdir = Path("data/evidence/generated/chang2026_takaoense_figure")
          write_csv(
              outdir / "takaoense_tip_morph_recovery.csv",
              build_tip_rows({}),
              OUTPUT_FIELDS,
          )
          PY

      - name: Validate evidence package
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          outdir = Path("data/evidence/generated/chang2026_takaoense_figure")
          summary = json.loads(
              (outdir / "figure1_image_summary.json").read_text(encoding="utf-8")
          )
          image = Path(summary["image_path"])
          with (outdir / "takaoense_tip_morph_recovery.csv").open(
              encoding="utf-8-sig", newline=""
          ) as handle:
              rows = list(csv.DictReader(handle))

          print(f"image_width_px={summary['image_width_px']}")
          print(f"image_height_px={summary['image_height_px']}")
          print(f"image_size_bytes={summary['image_size_bytes']}")
          print(f"image_sha256={summary['image_sha256']}")
          print(f"selected_url={summary['selected_url']}")
          print(f"tip_rows={len(rows)}")
          print("review_statuses=" + "|".join(sorted({row['review_status'] for row in rows})))

          if not image.is_file() or image.stat().st_size == 0:
              raise SystemExit("Official Figure 1 image was not recovered")
          if image.read_bytes()[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit("Recovered Figure 1 is not a PNG")
          if summary['image_width_px'] < 600 or summary['image_height_px'] < 400:
              raise SystemExit("Recovered Figure 1 resolution is unexpectedly small")
          if len(rows) != 6:
              raise SystemExit(f"Expected six takaoense vouchers, observed {len(rows)}")
          if {row['voucher'] for row in rows} != {
              'ccy3559', 'ccy3807', 'ccy3835', 'ccy3560', 'ccy3629', 'ccy3839'
          }:
              raise SystemExit("Voucher membership changed")
          if any(row['published_figure_label'] for row in rows):
              raise SystemExit(
                  "Pre-review table must remain unresolved until the recovered figure is read"
              )
          PY

      - name: Upload Figure 1 evidence package
        uses: actions/upload-artifact@v4
        with:
          name: chang2026-takaoense-figure-evidence-${{ github.run_id }}
          path: data/evidence/generated/chang2026_takaoense_figure
          if-no-files-found: error
          retention-days: 90
