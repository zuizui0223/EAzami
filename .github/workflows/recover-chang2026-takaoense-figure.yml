name: Recover Chang 2026 takaoense Figure 1

on:
  pull_request:
    paths:
      - "analysis/recover_chang2026_takaoense_figure.py"
      - "analysis/download_chang2026_figure1_image.py"
      - "analysis/recover_chang2026_takaoense_preprint.py"
      - "analysis/validate_chang2026_takaoense_voucher_evidence.py"
      - "tests/test_recover_chang2026_takaoense_figure.py"
      - "tests/test_download_chang2026_figure1_image.py"
      - "tests/test_recover_chang2026_takaoense_preprint.py"
      - "tests/test_validate_chang2026_takaoense_voucher_evidence.py"
      - "data/evidence/chang2026_takaoense_voucher_morph_evidence_*.csv"
      - "data/evidence/chang2026_takaoense_ncbi_*"
      - ".github/workflows/recover-chang2026-takaoense-figure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and run offline tests
        run: |
          python -m py_compile \
            analysis/recover_chang2026_takaoense_figure.py \
            analysis/download_chang2026_figure1_image.py \
            analysis/recover_chang2026_takaoense_preprint.py \
            analysis/validate_chang2026_takaoense_voucher_evidence.py
          python -m unittest \
            tests/test_recover_chang2026_takaoense_figure.py \
            tests/test_download_chang2026_figure1_image.py \
            tests/test_recover_chang2026_takaoense_preprint.py \
            tests/test_validate_chang2026_takaoense_voucher_evidence.py \
            -v

      - name: Validate frozen voucher and source evidence
        run: |
          python analysis/validate_chang2026_takaoense_voucher_evidence.py
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/evidence/generated/"
              "chang2026_takaoense_voucher_evidence_summary.json"
          )
          summary = json.loads(path.read_text(encoding="utf-8"))
          print(f"voucher_rows={summary['voucher_rows']}")
          print(f"supplement_s6_exact_records={summary['supplement_s6_exact_records']}")
          print(f"supplement_s6_not_recovered={summary['supplement_s6_not_recovered']}")
          print(
              "s1_s6_herbarium_conflicts="
              + "|".join(summary['s1_s6_herbarium_conflicts'])
          )
          print(f"direct_sample_morph_assignments={summary['direct_sample_morph_assignments']}")

          if summary['voucher_rows'] != 6:
              raise SystemExit("Expected six voucher rows")
          if summary['supplement_s6_exact_records'] != 4:
              raise SystemExit("Expected four exact S6 collector records")
          if summary['supplement_s6_not_recovered'] != 2:
              raise SystemExit("Expected two collector numbers absent from S6")
          if summary['s1_s6_herbarium_conflicts'] != ['ccy3839']:
              raise SystemExit("Expected only the ccy3839 TCF/TNM conflict")
          if summary['direct_sample_morph_assignments'] != 0:
              raise SystemExit("No sample-level W/BP label is directly recovered yet")
          PY

      - name: Validate unresolved six-voucher figure ledger
        run: |
          python - <<'PY'
          import csv
          import tempfile
          from pathlib import Path
          from analysis.recover_chang2026_takaoense_figure import (
              OUTPUT_FIELDS,
              build_tip_rows,
              write_csv,
          )

          with tempfile.TemporaryDirectory() as tmp:
              output = Path(tmp) / "takaoense_tip_morph_recovery.csv"
              write_csv(output, build_tip_rows({}), OUTPUT_FIELDS)
              with output.open(encoding="utf-8-sig", newline="") as handle:
                  rows = list(csv.DictReader(handle))

          expected = {
              'ccy3559', 'ccy3807', 'ccy3835',
              'ccy3560', 'ccy3629', 'ccy3839'
          }
          if len(rows) != 6 or {row['voucher'] for row in rows} != expected:
              raise SystemExit("Six-voucher membership changed")
          if any(row['published_figure_label'] for row in rows):
              raise SystemExit("An unresolved voucher received an invented figure label")
          if any(
              row['review_status'] != 'unresolved_pending_figure_review'
              for row in rows
          ):
              raise SystemExit("Pre-recovery vouchers must remain unresolved")
          if any(
              'No assignment from geography' not in row['notes']
              for row in rows
          ):
              raise SystemExit("Geographic-inference guard is missing")
          print("validated_unresolved_vouchers=6")
          print("invented_morph_assignments=0")
          PY

  recover-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF and image readers
        run: python -m pip install --disable-pip-version-check PyMuPDF Pillow

      - name: Attempt official Springer Figure 1 PNG recovery
        id: official_image
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p data/evidence/generated/chang2026_takaoense_figure
          python analysis/download_chang2026_figure1_image.py \
            --outdir data/evidence/generated/chang2026_takaoense_figure \
            --force \
            2>&1 | tee data/evidence/generated/chang2026_takaoense_figure/official_image_recovery.log

      - name: Attempt Research Square/preprint fallback
        id: preprint_recovery
        if: steps.official_image.outcome != 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python analysis/recover_chang2026_takaoense_preprint.py \
            --outdir data/evidence/generated/chang2026_takaoense_figure \
            --force \
            2>&1 | tee data/evidence/generated/chang2026_takaoense_figure/preprint_recovery.log

      - name: Record live-recovery status
        if: always()
        env:
          OFFICIAL_OUTCOME: ${{ steps.official_image.outcome }}
          PREPRINT_OUTCOME: ${{ steps.preprint_recovery.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          outdir = Path("data/evidence/generated/chang2026_takaoense_figure")
          outdir.mkdir(parents=True, exist_ok=True)
          official = os.environ.get("OFFICIAL_OUTCOME", "not_run")
          preprint = os.environ.get("PREPRINT_OUTCOME", "not_run")
          image = outdir / "chang2026_figure1.png"
          if image.exists():
              status = "official_figure1_image_recovered"
              interpretation = (
                  "The official Springer Nature Figure 1 image was recovered. "
                  "Tip labels must be reviewed directly; no locality-based morph "
                  "assignment is permitted."
              )
          elif preprint == "success":
              status = "preprint_recovery_succeeded"
              interpretation = (
                  "The preprint/PDF fallback was recovered for direct figure review."
              )
          else:
              status = "external_source_unavailable_from_github_actions"
              interpretation = (
                  "Official Springer image/PDF and preprint endpoints rejected or "
                  "failed automated GitHub Actions recovery. No morph assignment was made."
              )
          payload = {
              "status": status,
              "official_image_outcome": official,
              "preprint_outcome": preprint,
              "official_image_exists": image.exists(),
              "interpretation": interpretation,
              "next_evidence": (
                  "Review the recovered Figure 1 image when present; otherwise use "
                  "herbarium vouchers or author confirmation. NCBI identities are "
                  "already linked one-to-one but contain no W/BP attribute."
              )
          }
          (outdir / "live_recovery_status.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(payload, indent=2))
          PY

      - name: Upload live-recovery evidence and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: chang2026-takaoense-figure-evidence-${{ github.run_id }}
          path: data/evidence/generated/chang2026_takaoense_figure
          if-no-files-found: error
          retention-days: 90
