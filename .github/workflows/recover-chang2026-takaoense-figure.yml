name: Recover Chang 2026 takaoense Figure 1

on:
  pull_request:
    paths:
      - "analysis/recover_chang2026_takaoense_figure.py"
      - "analysis/download_chang2026_figure1_image.py"
      - "analysis/recover_chang2026_takaoense_preprint.py"
      - "tests/test_recover_chang2026_takaoense_figure.py"
      - "tests/test_download_chang2026_figure1_image.py"
      - "tests/test_recover_chang2026_takaoense_preprint.py"
      - ".github/workflows/recover-chang2026-takaoense-figure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and run offline tests
        run: |
          python -m py_compile \
            analysis/recover_chang2026_takaoense_figure.py \
            analysis/download_chang2026_figure1_image.py \
            analysis/recover_chang2026_takaoense_preprint.py
          python -m unittest \
            tests/test_recover_chang2026_takaoense_figure.py \
            tests/test_download_chang2026_figure1_image.py \
            tests/test_recover_chang2026_takaoense_preprint.py \
            -v

      - name: Validate unresolved six-voucher evidence ledger
        run: |
          python - <<'PY'
          import csv
          import tempfile
          from pathlib import Path
          from analysis.recover_chang2026_takaoense_figure import (
              OUTPUT_FIELDS,
              build_tip_rows,
              write_csv,
          )

          with tempfile.TemporaryDirectory() as tmp:
              output = Path(tmp) / "takaoense_tip_morph_recovery.csv"
              write_csv(output, build_tip_rows({}), OUTPUT_FIELDS)
              with output.open(encoding="utf-8-sig", newline="") as handle:
                  rows = list(csv.DictReader(handle))

          expected = {
              'ccy3559', 'ccy3807', 'ccy3835',
              'ccy3560', 'ccy3629', 'ccy3839'
          }
          if len(rows) != 6 or {row['voucher'] for row in rows} != expected:
              raise SystemExit("Six-voucher membership changed")
          if any(row['published_figure_label'] for row in rows):
              raise SystemExit("An unresolved voucher received an invented figure label")
          if any(
              row['review_status'] != 'unresolved_pending_figure_review'
              for row in rows
          ):
              raise SystemExit("Pre-recovery vouchers must remain unresolved")
          if any(
              'No assignment from geography' not in row['notes']
              for row in rows
          ):
              raise SystemExit("Geographic-inference guard is missing")
          print("validated_unresolved_vouchers=6")
          print("invented_morph_assignments=0")
          PY

  recover-live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF and image readers
        run: python -m pip install --disable-pip-version-check PyMuPDF Pillow

      - name: Attempt Research Square preprint and Figure 1 recovery
        id: live_recovery
        continue-on-error: true
        run: |
          mkdir -p data/evidence/generated/chang2026_takaoense_figure
          python analysis/recover_chang2026_takaoense_preprint.py \
            --outdir data/evidence/generated/chang2026_takaoense_figure \
            --force \
            2>&1 | tee data/evidence/generated/chang2026_takaoense_figure/live_recovery.log

      - name: Record unavailable external source without failing the audit
        if: steps.live_recovery.outcome != 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          outdir = Path("data/evidence/generated/chang2026_takaoense_figure")
          outdir.mkdir(parents=True, exist_ok=True)
          payload = {
              "status": "external_source_unavailable_from_github_actions",
              "interpretation": (
                  "Springer media/PDF and ResearchGate preprint endpoints rejected "
                  "automated GitHub Actions clients. No morph assignment was made."
              ),
              "next_evidence": (
                  "Recover Figure 1 through an allowed browser/manual route, "
                  "NCBI BioSample metadata, herbarium vouchers, or author confirmation."
              )
          }
          (outdir / "live_recovery_status.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload live-recovery diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: chang2026-takaoense-figure-evidence-${{ github.run_id }}
          path: data/evidence/generated/chang2026_takaoense_figure
          if-no-files-found: error
          retention-days: 90
