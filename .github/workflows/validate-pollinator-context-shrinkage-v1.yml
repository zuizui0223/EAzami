name: Validate pollinator context shrinkage v1
on:
  pull_request:
    paths:
      - "analysis/validate_pollinator_context_shrinkage_v1.py"
      - "data/evidence/pollinator_context_shrinkage_v1.json"
      - "data/evidence/capitulum_pattern_reduction_targets_v2.csv"
      - "tests/test_pollinator_context_shrinkage_v1.py"
      - ".github/workflows/validate-pollinator-context-shrinkage-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests/test_pollinator_context_shrinkage_v1.py -v
