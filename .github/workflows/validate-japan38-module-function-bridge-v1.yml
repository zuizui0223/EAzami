name: Validate Japan38 module-function bridge v1

on:
  pull_request:
    paths:
      - "analysis/build_japan38_module_function_bridge_v1.py"
      - "data/evidence/japan38_module_function_bridge_v1.csv"
      - "data/evidence/japan38_module_function_bridge_summary_v1.json"
      - "data/evidence/japan38_fdt8_priority_targets_v1.csv"
      - "data/evidence/fdt_multitrait_execution_readiness_v16.json"
      - ".github/workflows/validate-japan38-module-function-bridge-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile bridge
        run: python -m py_compile analysis/build_japan38_module_function_bridge_v1.py
      - name: Build bridge from frozen canonical evidence
        run: |
          mkdir -p result
          python analysis/build_japan38_module_function_bridge_v1.py \
            --history data/evidence/japan38_multitrait_history_summary_v1.json \
            --functional-summary data/evidence/fdt1_broad_functional_calibration_summary_v1.json \
            --functional-seed data/evidence/fdt1_broad_functional_calibration_seed_v1.csv \
            --orientation-meta data/evidence/fdt1_orientation_net_fitness_two_study_meta_v1.json \
            --cirsium-interactions data/evidence/cirsium_interaction_evidence_seed_v1.csv \
            --concept-map data/evidence/japan38_comp1061_concept_map_v1.csv \
            --readiness data/evidence/fdt_multitrait_execution_readiness_v15.json \
            --bridge-output result/japan38_module_function_bridge_v1.csv \
            --priority-output result/japan38_fdt8_priority_targets_v1.csv \
            --summary-output result/japan38_module_function_bridge_summary_v1.json
      - name: Assert fail-closed decisions and frozen outputs when present
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          bridge=list(csv.DictReader(open('result/japan38_module_function_bridge_v1.csv',encoding='utf-8-sig')))
          assert len(bridge)==8
          assert {r['module'] for r in bridge}=={'orientation','phyllary_posture','stickiness','colour_lightness'}
          priorities=list(csv.DictReader(open('result/japan38_fdt8_priority_targets_v1.csv',encoding='utf-8-sig')))
          assert [r['paper_japan_member_id'] for r in priorities]==['JPN_36','JPN_06','JPN_34','JPN_15','JPN_24']
          summary=json.loads(Path('result/japan38_module_function_bridge_summary_v1.json').read_text())
          assert summary['module_decisions']['orientation']['transition_localizable'] is False
          assert summary['module_decisions']['phyllary_posture']['best_target']=='JPN_36'
          assert summary['module_decisions']['stickiness']['best_targets']==['JPN_06','JPN_36']
          assert summary['module_decisions']['colour_lightness']['history_ready'] is False
          frozen_bridge=Path('data/evidence/japan38_module_function_bridge_v1.csv')
          if frozen_bridge.exists():
              assert frozen_bridge.read_text()==Path('result/japan38_module_function_bridge_v1.csv').read_text()
              assert Path('data/evidence/japan38_fdt8_priority_targets_v1.csv').read_text()==Path('result/japan38_fdt8_priority_targets_v1.csv').read_text()
              assert json.loads(Path('data/evidence/japan38_module_function_bridge_summary_v1.json').read_text())==summary
              readiness=json.loads(Path('data/evidence/fdt_multitrait_execution_readiness_v16.json').read_text())
              assert readiness['mainline']['primary_repeated_evolution_modules']==['orientation','phyllary_posture','stickiness']
              assert readiness['mainline']['colour_role']=='secondary_negative_contrast'
              assert readiness['mainline']['highest_information_targets']==['JPN_36','JPN_06']
          print(json.dumps(summary,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: japan38-module-function-bridge-${{ github.run_id }}
          path: |
            result/japan38_module_function_bridge_v1.csv
            result/japan38_fdt8_priority_targets_v1.csv
            result/japan38_module_function_bridge_summary_v1.json
          if-no-files-found: error
          retention-days: 90
