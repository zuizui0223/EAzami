name: Validate Japan-38 image-authority orientation

on:
  pull_request:
    paths:
      - "analysis/validate_japan38_image_authority_orientation.py"
      - "data/evidence/japan38_image_authority_orientation_validation_v1.csv"
      - "data/evidence/japan38_image_authority_orientation_validation_v1.json"
      - ".github/workflows/validate-japan38-image-authority-orientation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy
      - name: Compile and rebuild
        run: |
          python -m py_compile analysis/validate_japan38_image_authority_orientation.py
          python analysis/validate_japan38_image_authority_orientation.py \
            --input data/evidence/japan38_image_authority_orientation_validation_v1.csv \
            --out /tmp/japan38_image_authority_orientation_validation_v1.json
      - name: Compare frozen result
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          a=json.loads(Path('/tmp/japan38_image_authority_orientation_validation_v1.json').read_text())
          b=json.loads(Path('data/evidence/japan38_image_authority_orientation_validation_v1.json').read_text())
          assert set(a)==set(b)
          for key in a:
              if isinstance(a[key], (int,float)) and not isinstance(a[key], bool):
                  assert math.isclose(float(a[key]),float(b[key]),rel_tol=1e-12,abs_tol=1e-12),(key,a[key],b[key])
              else:
                  assert a[key]==b[key],(key,a[key],b[key])
          assert a['down_minus_up_median_angle_difference'] > 0
          assert a['directional_positive_permutation_p'] > 0.05
          assert 'not significant' in a['claim_boundary']
          print(json.dumps(a,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: japan38-image-authority-orientation-${{ github.run_id }}
          path: data/evidence/japan38_image_authority_orientation_validation_v1.json
          retention-days: 90
