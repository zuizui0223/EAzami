name: Audit real world52 75 nuclear gene geographic concordance

on:
  pull_request:
    paths:
      - "analysis/audit_world52_75gene_original_NA_West_genetic_concordance_v1.py"
      - "tests/test_world52_75gene_original_NA_West_genetic_concordance_v1.py"
      - ".github/workflows/audit-world52-real75gene-geography-concordance-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  genuine-52-tip-75-gene-genetic-concordance:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install phylogenetic nucleotide provenance and numeric packages
        run: |
          python -m pip install --disable-pip-version-check biopython numpy
          python -m py_compile analysis/audit_world52_75gene_original_NA_West_genetic_concordance_v1.py
          python -m unittest discover -s tests -p 'test_world52_75gene_original_NA_West_genetic_concordance_v1.py' -v
      - name: Restore original corrected unique BioSample 75-locus real Compositae1061 alignment and immutable source gene coordinates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp/source52
          gh run download 40153095510 --repo zuizui0223/EAzami \
            --name world52-real-unique-biosample-176and75-nuclear-inputs-v1 \
            --dir .tmp/source52
          test -s .tmp/source52/world52_75loci_all12_external_uniqueBioSamples.fasta
          test -s .tmp/source52/world52_75frozen_gene_coordinate_ledger.csv
      - name: Compute every original 75 nuclear gene p-distance, exact 462-region-map source null and two suspicious loci omission
        run: |
          python analysis/audit_world52_75gene_original_NA_West_genetic_concordance_v1.py \
            --source75-fasta .tmp/source52/world52_75loci_all12_external_uniqueBioSamples.fasta \
            --source-gene-ledger .tmp/source52/world52_75frozen_gene_coordinate_ledger.csv \
            --outdir .tmp/actual75gene-geography
      - name: Verify all original source nuclear genes retained, 73-gene sensitivity, and no historical transition overclaims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path(".tmp/actual75gene-geography")
          x=json.loads((d/"world52_75vs73_genetic_region_concordance_result.json").read_text())
          a=x["full_75_original_nuclear_loci"]
          b=x["source_73_loci_same_SRR_disagreement_sensitivity"]
          assert a["n_entire_original_nuclear_gene_loci"]==75
          assert a["positive_gene_count"]==75
          assert b["n_entire_original_nuclear_gene_loci"]==73
          assert b["positive_gene_count"]==73
          assert a["source_label_map_at_or_more_extreme"]==1
          assert b["source_label_map_at_or_more_extreme"]==1
          assert a["source_region_label_exact_null_map_count"]==462
          assert a["exact_one_sided_source_label_exchangeability_p"]==1/462
          assert x["source_original_fasta_contains_single_copy_per_real_BioSample"]
          assert x["independent_U_to_D_or_D_to_U_phenotypic_event_counts_proven"] is False
          print("GENUINE real 75/75 source nuclear loci support selected NA-versus-West distance contrast; not 75 independent ecological origins.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: real-world52-original75-and-technical73-NAvsWest-gene-by-gene-pdist-v1
          path: .tmp/actual75gene-geography/
          retention-days: 90
          if-no-files-found: error
