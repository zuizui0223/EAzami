name: Validate standalone Chapter 2 diversity depth

on:
  pull_request:
    paths:
      - "analysis/validate_chapter2_diversity_depth_v1.py"
      - "analysis/build_chapter2_eazami_native_continuous_registry_v1.py"
      - "analysis/run_chapter2_eazami_native_continuous_history_diagnostic_v1.py"
      - "tests/test_validate_chapter2_diversity_depth_v1.py"
      - "tests/test_build_chapter2_eazami_native_continuous_registry_v1.py"
      - "tests/test_chapter2_eazami_native_continuous_history_diagnostic_v1.py"
      - "docs/chapter2/DIVERSITY_DEPTH_STANDALONE_V1.md"
      - "docs/chapter2/CHAPTER2_CORE_RESULT_RECOVERY_V1.md"
      - "docs/chapter2/CHAPTER2_RESOLUTION_AWARE_EVIDENCE_SPLIT_V1.md"
      - "docs/chapter2/META_SIM_DISPOSITION_V1.md"
      - "docs/chapter2/CHAPTER2_TO_CHAPTER3_RADSEQ_BRIDGE_V1.md"
      - "docs/chapter2/MANUSCRIPT_JEB_V4.md"
      - "data/evidence/chapter2_diversity_depth_contract_v1.json"
      - "data/evidence/chapter2_diversity_depth_inventory_v1.csv"
      - "data/evidence/chapter2_core_result_recovery_v1.csv"
      - "data/evidence/chapter2_analysis_disposition_v1.csv"
      - "data/evidence/chapter2_resolution_classification_v1.csv"
      - "data/evidence/meta_simulation_resolution_audit_v1.csv"
      - "data/evidence/chapter2_to_chapter3_radseq_bridge_v1.json"
      - "data/evidence/chapter2_to_chapter3_sampling_priorities_v1.csv"
      - "data/evidence/chapter2_eazami_native_continuous_trait_registry_v1.csv"
      - "data/evidence/chapter2_eazami_native_continuous_trait_registry_summary_v1.json"
      - "data/evidence/chapter2_eazami_native_continuous_history_design_v1.json"
      - "data/evidence/chapter2_eazami_native_continuous_history_diagnostic_v1.json"
      - "data/evidence/chapter2_eazami_native_continuous_history_diagnostic_by_topology_v1.csv"
      - "data/evidence/comp1061_six_au_nonrejected_trees_v1.nwk"
      - "data/evidence/comp1061_display_size_direct_seed_v1.csv"
      - "data/evidence/comp1061_phyllary_direct_seed_v1.csv"
      - "data/evidence/moreyra2025_japan_38_membership_audit_2026-08-10.csv"
      - "data/evidence/orientation_comp1061_20tip_source_crosswalk_v1.csv"
      - "data/evidence/japan38_nmns_capitulum_trait_seed_v1.csv"
      - "data/evidence/japan38_comp1061_primary_tree_acceptance_v1.json"
      - "data/evidence/jpn24_stickiness_extension_parsimony_v1.json"
      - "data/evidence/fdt4_eastasia_pgls_recovered_diagnostic_v1.json"
      - "data/evidence/fdt4_branchwise_niche_transition_concordance_v1.json"
      - "data/evidence/japan_cirsium_origin_meta_analysis_v1.json"
      - "data/evidence/japan38_authority_module_combinations_v1.json"
      - "data/evidence/jpn34_orientation_extension_parsimony_v1.json"
      - "data/evidence/japan38_multitrait_history_summary_v1.json"
      - "data/evidence/hmm2_population_aware_transition_test_v1.json"
      - "data/evidence/hmm2_population_aware_transition_test_v1.validation.json"
      - "data/evidence/japan38_cytotype_trait_overlap_v1.json"
      - "data/evidence/chapter2_time_axis_compute/japan38_latest_module_transition_overlap_v2.json"
      - "data/evidence/chapter2_time_axis_compute/japan38_latest_module_overlap_topology_sensitivity_v2.json"
      - ".github/workflows/validate-chapter2-diversity-depth-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install continuous-history dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.14.1 biopython==1.85
      - name: Validate fail-closed standalone contract
        run: |
          mkdir -p .tmp/chapter2-native
          python analysis/build_chapter2_eazami_native_continuous_registry_v1.py \
            --display data/evidence/comp1061_display_size_direct_seed_v1.csv \
            --phyllary data/evidence/comp1061_phyllary_direct_seed_v1.csv \
            --membership data/evidence/moreyra2025_japan_38_membership_audit_2026-08-10.csv \
            --orientation-crosswalk data/evidence/orientation_comp1061_20tip_source_crosswalk_v1.csv \
            --nmns-seed data/evidence/japan38_nmns_capitulum_trait_seed_v1.csv \
            --registry-output .tmp/chapter2-native/registry.csv \
            --summary-output .tmp/chapter2-native/summary.json
          cmp .tmp/chapter2-native/registry.csv data/evidence/chapter2_eazami_native_continuous_trait_registry_v1.csv
          cmp .tmp/chapter2-native/summary.json data/evidence/chapter2_eazami_native_continuous_trait_registry_summary_v1.json
          python analysis/run_chapter2_eazami_native_continuous_history_diagnostic_v1.py \
            --design data/evidence/chapter2_eazami_native_continuous_history_design_v1.json \
            --registry data/evidence/chapter2_eazami_native_continuous_trait_registry_v1.csv \
            --au-trees data/evidence/comp1061_six_au_nonrejected_trees_v1.nwk \
            --output-json .tmp/chapter2-native/history.json \
            --output-csv .tmp/chapter2-native/history.csv
          cmp .tmp/chapter2-native/history.json data/evidence/chapter2_eazami_native_continuous_history_diagnostic_v1.json
          cmp .tmp/chapter2-native/history.csv data/evidence/chapter2_eazami_native_continuous_history_diagnostic_by_topology_v1.csv
          python analysis/validate_chapter2_diversity_depth_v1.py
          python tests/test_validate_chapter2_diversity_depth_v1.py -v
          python tests/test_build_chapter2_eazami_native_continuous_registry_v1.py -v
          python tests/test_chapter2_eazami_native_continuous_history_diagnostic_v1.py -v
