name: Run Chapter 2 focal colour-RSDS concordance v1

on:
  pull_request:
    paths:
      - "data/evidence/chapter2_four_taxon_balanced_colour_environment_cohort_v1.csv"
      - "data/evidence/chapter2_colour_rsds_focal_concordance_contract_v1.json"
      - "data/evidence/chapter2_colour_rsds_chelsa_source_contract_v1.json"
      - "analysis/run_chapter2_colour_rsds_focal_concordance_v1.py"
      - ".github/workflows/run-chapter2-colour-rsds-focal-concordance-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas rasterio pyproj
          python -m py_compile analysis/run_chapter2_colour_rsds_focal_concordance_v1.py
      - name: Fetch pinned Azami CHELSA sampler
        run: |
          curl --fail --location --retry 5 \
            https://raw.githubusercontent.com/zuizui0223/azami/03ed29f1f476ca0d0a1ea8e14e75cb0050a213ef/analysis/sample_chelsa_process_environment.py \
            -o /tmp/sample_chelsa_process_environment.py
          python -m py_compile /tmp/sample_chelsa_process_environment.py
      - name: Attach frozen current CHELSA RSDS
        run: |
          mkdir -p /tmp/rsds /tmp/result
          python /tmp/sample_chelsa_process_environment.py \
            --environment data/evidence/chapter2_four_taxon_balanced_colour_environment_cohort_v1.csv \
            --source-contract data/evidence/chapter2_colour_rsds_chelsa_source_contract_v1.json \
            --out-csv /tmp/rsds/four_taxon_rsds.csv \
            --report /tmp/rsds/rsds_sampling_report.json
      - name: Test focal Azami-RSDS concordance
        run: |
          python analysis/run_chapter2_colour_rsds_focal_concordance_v1.py \
            --cohort /tmp/rsds/four_taxon_rsds.csv \
            --contract data/evidence/chapter2_colour_rsds_focal_concordance_contract_v1.json \
            --out-dir /tmp/result \
            | tee /tmp/result/run.log
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          root=Path('/tmp/result')
          x=json.loads((root/'chapter2_colour_rsds_focal_concordance_result_v1.json').read_text())
          c=pd.read_csv(root/'chapter2_colour_rsds_focal_system_contrasts_v1.csv')
          assert len(c)==2
          assert x['rsds_coverage'] >= 0.98
          assert x['classification'] in {
              'two_system_current_rsds_chroma_directional_concordance',
              'partial_current_rsds_chroma_directional_concordance',
              'focal_current_rsds_chroma_discordance',
          }
          print(json.dumps({
              'classification':x['classification'],
              'primary_concordant_systems':x['primary_concordant_systems'],
              'cell_concordant_systems':x['spatial_cell_concordant_systems'],
              'locality_robust':x['locality_robust_two_system_direction'],
              'pooled_within':x['pooled_within_taxon_secondary'],
          }, indent=2))
          PY
      - name: Upload public-data RSDS concordance results
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-colour-rsds-focal-concordance-${{ github.run_id }}
          path: |
            /tmp/rsds/four_taxon_rsds.csv
            /tmp/rsds/rsds_sampling_report.json
            /tmp/result/chapter2_four_taxon_colour_rsds_enriched_cohort_v1.csv
            /tmp/result/chapter2_colour_rsds_focal_system_contrasts_v1.csv
            /tmp/result/chapter2_colour_rsds_focal_concordance_result_v1.json
            /tmp/result/run.log
          if-no-files-found: error
          retention-days: 90
