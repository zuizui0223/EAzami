name: Freeze durable public candidate locus packs

on:
  pull_request:
    paths:
      - ".github/workflows/freeze-public-candidate-locus-packs.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  freeze:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Recover checksum-pinned source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/source/EA01 /tmp/source/EA02 /tmp/source/CNIPG
          curl --fail --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9175870949/zip" -o /tmp/EA01.zip
          curl --fail --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9175876315/zip" -o /tmp/EA02.zip
          curl --fail --location -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9174758977/zip" -o /tmp/CNIPG.zip
          echo "275fecf31e202ae28914441faff70a7faede3c2b8912901221d84e4aa6ef2232  /tmp/EA01.zip" | sha256sum -c -
          echo "6a9c0d91b2d98ed5ebc72bf96effd5f41c8c6f865747b1d1124ee3d59eb0d1bb  /tmp/EA02.zip" | sha256sum -c -
          echo "079e3bfaab1d5041ebc2dcb1919532c75eefde7ffe1f766ab0473845f2f9dd69  /tmp/CNIPG.zip" | sha256sum -c -
          unzip -q /tmp/EA01.zip -d /tmp/source/EA01
          unzip -q /tmp/EA02.zip -d /tmp/source/EA02
          unzip -q /tmp/CNIPG.zip -d /tmp/source/CNIPG
      - name: Build deterministic sharded text evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,csv,gzip,hashlib,json

          repo=Path.cwd()
          out=repo/'data/evidence/public_candidate_locus_packs_v1'
          out.mkdir(parents=True,exist_ok=True)
          for old in out.glob('*.part*.b64'):
              old.unlink()

          specs={
            'EA01': dict(root=Path('/tmp/source/EA01'),tip_id='PUBEA001',artifact_id=9175870949,artifact_sha256='275fecf31e202ae28914441faff70a7faede3c2b8912901221d84e4aa6ef2232',artifact_size=302827,summary='candidate_pack_summary.json'),
            'EA02': dict(root=Path('/tmp/source/EA02'),tip_id='PUBEA002',artifact_id=9175876315,artifact_sha256='6a9c0d91b2d98ed5ebc72bf96effd5f41c8c6f865747b1d1124ee3d59eb0d1bb',artifact_size=308899,summary='candidate_pack_summary.json'),
            'CNIPG': dict(root=Path('/tmp/source/CNIPG'),tip_id='AUG_ULLEUNG_CNIP2024',artifact_id=9174758977,artifact_sha256='079e3bfaab1d5041ebc2dcb1919532c75eefde7ffe1f766ab0473845f2f9dd69',artifact_size=109192,summary='cirsium_nipponicum_comp1061_locus_pack_summary.json'),
          }
          columns=['locus','sequence_length','fasta_sha256','sequence']
          def sha(data): return hashlib.sha256(data).hexdigest()
          manifest={
            'contract_version':'public_candidate_locus_packs_v1',
            'fasta_reconstruction':{'header_template':'>{tip_id}','line_width':80,'final_newline':True},
            'tsv_columns':columns,
            'candidates':{}
          }
          for cid,s in specs.items():
              root=s['root']; tip=s['tip_id']
              loci=[x for x in (root/'strict_recovered_loci.txt').read_text().splitlines() if x]
              rows=[]
              for locus in loci:
                  source=root/'loci'/f'{locus}.fasta'
                  lines=source.read_text().splitlines()
                  assert lines[0]==f'>{tip}',(cid,locus,lines[0])
                  seq=''.join(lines[1:]).upper()
                  reconstructed=(f'>{tip}\n'+'\n'.join(seq[i:i+80] for i in range(0,len(seq),80))+'\n').encode()
                  assert reconstructed==source.read_bytes(),(cid,locus)
                  rows.append({'locus':locus,'sequence_length':len(seq),'fasta_sha256':sha(source.read_bytes()),'sequence':seq})
              import io
              buf=io.StringIO(newline='')
              w=csv.DictWriter(buf,fieldnames=columns,delimiter='\t',lineterminator='\n')
              w.writeheader();w.writerows(rows)
              tsv=buf.getvalue().encode()
              compressed=gzip.compress(tsv,compresslevel=9,mtime=0)
              encoded=base64.b64encode(compressed).decode('ascii')
              parts=[]
              for i in range(0,len(encoded),16000):
                  payload=encoded[i:i+16000]
                  name=f'{cid}.part{i//16000+1:02}.b64'
                  (out/name).write_text(payload,encoding='ascii')
                  parts.append({'path':f'data/evidence/public_candidate_locus_packs_v1/{name}','sha256':sha(payload.encode()),'size_bytes':len(payload)})
              summary_path=root/s['summary']
              manifest['candidates'][cid]={
                'tip_id':tip,
                'artifact_id':s['artifact_id'],
                'artifact_sha256':s['artifact_sha256'],
                'artifact_size_bytes':s['artifact_size'],
                'source_artifact_expires_on':'2026-11-11',
                'summary_filename':s['summary'],
                'summary_sha256':sha(summary_path.read_bytes()),
                'strict_recovered_loci_sha256':sha((root/'strict_recovered_loci.txt').read_bytes()),
                'strict_locus_count':len(loci),
                'tsv_sha256':sha(tsv),
                'source_summary':json.loads(summary_path.read_text()),
                'payload_encoding':'base64(gzip(tsv))',
                'gzip_sha256':sha(compressed),
                'payload_parts':parts,
                'encoded_payload_sha256':sha(encoded.encode()),
              }
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps({k:{'loci':v['strict_locus_count'],'parts':len(v['payload_parts']),'tsv_sha256':v['tsv_sha256']} for k,v in manifest['candidates'].items()},indent=2))
          PY
      - name: Validate durable materialization is byte-identical
        run: |
          set -euo pipefail
          for cid in EA01 EA02 CNIPG; do
            python analysis/materialize_frozen_public_candidate_locus_pack.py --candidate "$cid" --output "/tmp/materialized/$cid"
          done
          python - <<'PY'
          from pathlib import Path
          import hashlib
          pairs={'EA01':'EA01','EA02':'EA02','CNIPG':'CNIPG'}
          for cid,srcname in pairs.items():
              src=Path('/tmp/source')/srcname
              dst=Path('/tmp/materialized')/cid
              summary='candidate_pack_summary.json' if cid!='CNIPG' else 'cirsium_nipponicum_comp1061_locus_pack_summary.json'
              assert (src/'strict_recovered_loci.txt').read_bytes()==(dst/'strict_recovered_loci.txt').read_bytes()
              assert (src/summary).read_bytes()==(dst/summary).read_bytes()
              source_loci=sorted((src/'loci').glob('*.fasta'))
              dest_loci=sorted((dst/'loci').glob('*.fasta'))
              assert [p.name for p in source_loci]==[p.name for p in dest_loci]
              assert all(a.read_bytes()==b.read_bytes() for a,b in zip(source_loci,dest_loci))
              print(cid,'byte_identity=passed','loci=',len(source_loci))
          PY
          python -m unittest tests/test_materialize_frozen_public_candidate_locus_pack.py -v
      - name: Commit durable evidence to PR branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evidence/public_candidate_locus_packs_v1/
          if git diff --cached --quiet; then
            echo "durable candidate pack evidence already frozen"
            exit 0
          fi
          git commit -m "Freeze durable public candidate locus packs"
          git push origin HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
