name: Validate doctoral core program
on:
  pull_request:
    paths:
      - "data/evidence/doctoral_core_program_v1.csv"
      - "data/evidence/doctoral_next_data_minimum_v1.csv"
      - "docs/DOCTORAL_RESEARCH_CORE_PROGRAM.md"
      - "docs/DOCTORAL_NEXT_DATA_GATE_2026-08-19.md"
      - "data/evidence/preliminary_hypothesis_registry_v1.csv"
      - "docs/PRELIMINARY_ANALYSIS_HYPOTHESIS_MAP.md"
      - "sampling/SAMPLING_DESIGN.md"
      - "sampling/README.md"
      - "PROJECT_STATUS.md"
      - "README.md"
      - ".github/workflows/validate-preliminary-hypothesis-registry.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Validate one-center three-Aim doctoral hierarchy and next-data gates
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          core=list(csv.DictReader(Path('data/evidence/doctoral_core_program_v1.csv').open(encoding='utf-8',newline='')))
          centers=[r for r in core if r['level']=='central']; aims=[r for r in core if r['level']=='aim']
          assert len(centers)==1 and centers[0]['id']=='CORE'
          assert [r['id'] for r in sorted(aims,key=lambda r:int(r['priority']))]==['AIM1','AIM2','AIM3']
          assert aims[0]['role']=='indispensable'
          assert aims[1]['role']=='indispensable_for_adaptive_claim'
          assert aims[2]['role']=='mechanistic_flagship'
          for r in centers+aims:
              assert r['core_question'].strip() and r['prediction'].strip() and r['required_data'].strip() and r['success_criterion'].strip()

          next_data=list(csv.DictReader(Path('data/evidence/doctoral_next_data_minimum_v1.csv').open(encoding='utf-8',newline='')))
          assert [r['aim'] for r in next_data]==['AIM1','AIM2','AIM3']
          assert len(next_data)==3
          by={r['aim']:r for r in next_data}
          assert 'core190' in by['AIM1']['minimum_scale']
          assert 'Japan38 same-library RAD sensitivity' in by['AIM1']['do_not_expand_yet']
          assert 'orientation first' in by['AIM2']['minimum_new_data']
          assert 'effective contact' in by['AIM2']['collect_now']
          assert 'at least 2 independent W/C transitions' in by['AIM3']['minimum_scale']
          assert 'late bud/pigmentation onset' in by['AIM3']['collect_now']

          support=list(csv.DictReader(Path('data/evidence/preliminary_hypothesis_registry_v1.csv').open(encoding='utf-8',newline='')))
          expected={'H-RAD1','H-EVOL1','H-CLIM1','H-PL1','H-COL1','H-RET1','H-MECH1','H-CYTO1','H-ADAPT1','H-RYK1'}
          assert {r['hypothesis_id'] for r in support}==expected

          doc=Path('docs/DOCTORAL_RESEARCH_CORE_PROGRAM.md').read_text(encoding='utf-8')
          for phrase in ['One central question','One central hypothesis','Aim 1 — Historical/genomic source','Aim 2 — Adaptive function','Aim 3 — Flower-colour reversibility','**Core = 190 individuals.**','**Full minimum = 222; recommended = 298.**','Supporting lanes, not extra Aims','13 independent studies, 10 taxa and 15 taxon-study rows']:
              assert phrase in doc, phrase

          gate=Path('docs/DOCTORAL_NEXT_DATA_GATE_2026-08-19.md').read_text(encoding='utf-8')
          sampling=Path('sampling/SAMPLING_DESIGN.md').read_text(encoding='utf-8')
          status=Path('PROJECT_STATUS.md').read_text(encoding='utf-8')
          for phrase in ['The only three unresolved doctoral gates','Core = 190','head orientation first','at least **two independent W/C transitions**']:
              assert phrase in gate, phrase
          for phrase in ['Sampling design — doctoral mainline','**Core = 190 individuals.**','Aim 2 is **not a separate field campaign**','Aim 3 material must be collected during flowering','Japan38 × 3 same-library RAD sensitivity']:
              assert phrase in sampling, phrase
          assert 'three unresolved new-data gates' in status

          readme=Path('README.md').read_text(encoding='utf-8')
          support_map=Path('docs/PRELIMINARY_ANALYSIS_HYPOTHESIS_MAP.md').read_text(encoding='utf-8')
          assert 'one doctoral-level question' in readme
          assert 'not the doctoral hypothesis hierarchy' in support_map
          assert '190 core individuals' in support_map
          print('doctoral_centers=1')
          print('doctoral_aims=3')
          print('next_data_gates=3')
          print('full_minimum_population_panel=222')
          PY
