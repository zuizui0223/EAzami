name: Validate doctoral core program
on:
  pull_request:
    paths:
      - "data/evidence/doctoral_core_program_v1.csv"
      - "data/evidence/doctoral_next_data_minimum_v1.csv"
      - "docs/DOCTORAL_RESEARCH_CORE_PROGRAM.md"
      - "docs/DOCTORAL_NEXT_DATA_GATE_2026-08-19.md"
      - "docs/AIM2_TRANCHE1_JOINT_OBSERVATION_PROTOCOL_2026-08-20.md"
      - "docs/AIM2_FIELD_NESTING_PLAN_2026-08-18.md"
      - "data/evidence/preliminary_hypothesis_registry_v1.csv"
      - "docs/PRELIMINARY_ANALYSIS_HYPOTHESIS_MAP.md"
      - "sampling/SAMPLING_DESIGN.md"
      - "sampling/README.md"
      - "sampling/SAMPLE_ID_CONVENTION.md"
      - "sampling/doctoral_field_tranche1_population_manifest_v1.csv"
      - "sampling/aim13_individual_sample_ledger_v1.csv"
      - "sampling/aim2_capitulum_field_ledger_v1.csv"
      - "sampling/aim2_capitulum_observation_bout_ledger_v1.csv"
      - "sampling/aim2_plant_display_predation_ledger_v1.csv"
      - "PROJECT_STATUS.md"
      - "README.md"
      - ".github/workflows/validate-preliminary-hypothesis-registry.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Validate doctoral hierarchy, next-data gates and tranche-1 sampling
        run: |
          python - <<'PY'
          import csv
          import re
          from collections import Counter
          from pathlib import Path

          def header(path):
              with Path(path).open(encoding='utf-8', newline='') as handle:
                  return next(csv.reader(handle))

          # Existing three biological-data aims remain protected. Reordering dissertation
          # chapters does not delete the sampling commitments they encode.
          core=list(csv.DictReader(Path('data/evidence/doctoral_core_program_v1.csv').open(encoding='utf-8',newline='')))
          centers=[r for r in core if r['level']=='central']; aims=[r for r in core if r['level']=='aim']
          assert len(centers)==1 and centers[0]['id']=='CORE'
          assert [r['id'] for r in sorted(aims,key=lambda r:int(r['priority']))]==['AIM1','AIM2','AIM3']
          assert aims[0]['role']=='indispensable'
          assert aims[1]['role']=='indispensable_for_adaptive_claim'
          assert aims[2]['role']=='mechanistic_flagship'
          for r in centers+aims:
              assert r['core_question'].strip() and r['prediction'].strip() and r['required_data'].strip() and r['success_criterion'].strip()

          next_data=list(csv.DictReader(Path('data/evidence/doctoral_next_data_minimum_v1.csv').open(encoding='utf-8',newline='')))
          assert [r['aim'] for r in next_data]==['AIM1','AIM2','AIM3']
          assert len(next_data)==3
          by={r['aim']:r for r in next_data}
          assert 'core190' in by['AIM1']['minimum_scale']
          assert 'Japan38 same-library RAD sensitivity' in by['AIM1']['do_not_expand_yet']
          assert 'orientation first' in by['AIM2']['minimum_new_data']
          assert 'effective contact' in by['AIM2']['collect_now']
          assert 'at least 2 independent W/C transitions' in by['AIM3']['minimum_scale']
          assert 'late bud/pigmentation onset' in by['AIM3']['collect_now']

          fields=header('sampling/aim13_individual_sample_ledger_v1.csv')
          required={
              'individual_id','population_id','taxon','voucher_id','visible_colour_standard',
              'uv_reflectance_file','natural_orientation_deg','involucre_spread_deg','spine_length_mm',
              'dna_sample_id','plastid_source_sample_id','flow_cytometry_sample_id','flow_cytometry_reference_id',
              'aim2_capitulum_ids','floral_rna_late_bud_sample_id','floral_rna_late_bud_preservation',
              'floral_rna_anthesis_sample_id','floral_rna_anthesis_preservation','pigment_sample_id','pigment_preservation'
          }
          assert required <= set(fields), required-set(fields)

          head_fields=header('sampling/aim2_capitulum_field_ledger_v1.csv')
          head_required={
              'individual_id','population_id','capitulum_id','natural_orientation_deg','orientation_treatment',
              'orientation_achieved_deg','visible_colour_standard','involucre_spread_deg','spine_length_mm',
              'wetting_or_rain_exposure','pollen_wetting_score','pollen_viability','visitor_count',
              'effective_contact_count','florivory_damage_fraction','seed_predator_damage_fraction',
              'total_achenes','filled_achenes'
          }
          assert head_required <= set(head_fields), head_required-set(head_fields)

          bout_fields=header('sampling/aim2_capitulum_observation_bout_ledger_v1.csv')
          bout_required={
              'individual_id','population_id','capitulum_id','observation_bout_id','observation_date',
              'start_time_local','end_time_local','time_window_class','orientation_treatment',
              'natural_orientation_deg','orientation_achieved_deg','microclimate_sensor_id',
              'air_temperature_c','relative_humidity_pct','wind_speed_m_s','incident_radiation_w_m2',
              'head_surface_temperature_c','rainfall_mm_previous_30min','capitulum_wetness_score',
              'pollen_presentation_state','pollen_wetting_score','pollen_viability_sample_id','pollen_viability',
              'pollinator_visit_count','effective_contact_count','dominant_pollinator_guild',
              'antagonist_visit_count','dominant_antagonist_guild','florivory_event_count',
              'seed_predator_event_count','damage_observed_during_bout','treatment_integrity'
          }
          assert bout_required <= set(bout_fields), bout_required-set(bout_fields)
          assert len(bout_fields)==len(set(bout_fields))
          assert 'total_achenes' not in bout_fields and 'filled_achenes' not in bout_fields

          plant_fields=header('sampling/aim2_plant_display_predation_ledger_v1.csv')
          plant_required={
              'individual_id','population_id','phenology_census_id','total_reproductive_capitula_current',
              'seasonal_capitula_produced_final','predated_capitula_fraction','filled_achenes_sampled',
              'estimated_plant_filled_achenes'
          }
          assert plant_required <= set(plant_fields), plant_required-set(plant_fields)

          manifest=list(csv.DictReader(Path('sampling/doctoral_field_tranche1_population_manifest_v1.csv').open(encoding='utf-8',newline='')))
          assert len(manifest)==14
          assert [r['population_id'] for r in manifest]==[f'P{i:03d}' for i in range(1,15)]
          assert all(r['tranche']=='core190' for r in manifest)
          assert sum(int(r['minimum_individuals']) for r in manifest)==190
          totals=Counter()
          for r in manifest:
              totals[r['taxon']]+=int(r['minimum_individuals'])
              assert re.fullmatch(r'EA26-P\d{3}-I###',r['individual_id_pattern'])
              if r['exact_locality_status']=='TBD_field_verified':
                  assert r['exact_locality']=='TBD_field_verified'
                  assert r['latitude']=='' and r['longitude']==''
          assert totals==Counter({'Cirsium brevicaule':60,'Cirsium irumtiense':60,'Cirsium pendulum':40,'Cirsium sieboldii':30})

          support=list(csv.DictReader(Path('data/evidence/preliminary_hypothesis_registry_v1.csv').open(encoding='utf-8',newline='')))
          expected={'H-RAD1','H-EVOL1','H-CLIM1','H-PL1','H-COL1','H-RET1','H-MECH1','H-CYTO1','H-ADAPT1','H-RYK1'}
          assert {r['hypothesis_id'] for r in support}==expected

          doc=Path('docs/DOCTORAL_RESEARCH_CORE_PROGRAM.md').read_text(encoding='utf-8')
          for phrase in ['One central question','One central hypothesis','Aim 1 — Historical/genomic source','Aim 2 — Adaptive function','Aim 3 — Flower-colour reversibility','**Core = 190 individuals.**','**Full minimum = 222; recommended = 298.**']:
              assert phrase in doc, phrase

          gate=Path('docs/DOCTORAL_NEXT_DATA_GATE_2026-08-19.md').read_text(encoding='utf-8')
          sampling=Path('sampling/SAMPLING_DESIGN.md').read_text(encoding='utf-8')
          protocol=Path('docs/AIM2_TRANCHE1_JOINT_OBSERVATION_PROTOCOL_2026-08-20.md').read_text(encoding='utf-8')
          fieldplan=Path('docs/AIM2_FIELD_NESTING_PLAN_2026-08-18.md').read_text(encoding='utf-8')
          status=Path('PROJECT_STATUS.md').read_text(encoding='utf-8')
          for phrase in ['The only three unresolved doctoral gates','Core = 190','head orientation first','at least **two independent W/C transitions**']:
              assert phrase in gate, phrase
          for phrase in ['Sampling design — doctoral mainline','**Core = 190 individuals.**','Aim 2 is **not a separate field campaign**','Four linked data levels','aim2_capitulum_observation_bout_ledger_v1.csv','Aim 3 material must be collected during flowering']:
              assert phrase in sampling, phrase
          for phrase in ['time-window pollination/thermal timing','pollen-viability sample ID','early-day','whole-day visit total']:
              assert phrase in protocol, phrase
          for phrase in ['time-window pollination + abiotic protection','18.3%','aim2_capitulum_observation_bout_ledger_v1.csv','no all-day visitation = no orientation effect shortcut']:
              assert phrase in fieldplan, phrase

          # Current dissertation ordering: history is Chapter 2; function is Chapter 3;
          # origin/convergence gates remain downstream and retain the same sampling design.
          for phrase in [
              'Chapter 1 — phenotype × present-day space/environment',
              'Chapter 2 — phenotype × evolutionary time/history',
              'Chapter 3 — phenotype × function/fitness',
              'origin discrimination',
              'nuclear population genomics',
              'plastid haplotype',
              'cytotype',
          ]:
              assert phrase in status, phrase

          sampling_readme=Path('sampling/README.md').read_text(encoding='utf-8')
          assert 'Orientation timing rule' in sampling_readme
          assert 'time_window_class' in sampling_readme
          assert 'aim2_capitulum_observation_bout_ledger_v1.csv' in sampling_readme

          print('doctoral_centers=1')
          print('doctoral_aims=3')
          print('dissertation_space_history_function_alignment=true')
          print('origin_sampling_gate_retained=true')
          print('aim2_orientation_time_window_schema_valid=true')
          print('tranche1_populations=14')
          print('tranche1_minimum_individuals=190')
          PY