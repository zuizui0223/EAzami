name: Validate Japan38 time calibration v1
on:
  pull_request:
    paths:
      - "analysis/audit_japan38_time_calibration_v1.py"
      - "tests/test_japan38_time_calibration_v1.py"
      - "data/evidence/japan38_comp1061_primary_tree_v1.nwk"
      - "data/evidence/japan38_comp1061_concept_map_v1.csv"
      - "data/evidence/japan38_comp1061_tree_provenance_v1.json"
      - "data/evidence/cirsium_ecological_event_windows_v1.csv"
      - "data/evidence/japan38_time_calibration_audit_v1.json"
      - ".github/workflows/validate-japan38-time-calibration-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install biopython==1.85
      - run: python -m unittest tests/test_japan38_time_calibration_v1.py -v
