name: Audit Chang 2026 takaoense BioSample morph metadata

on:
  pull_request:
    paths:
      - "analysis/recover_ncbi_project_runs.py"
      - "analysis/audit_chang2026_biosample_morph_metadata.py"
      - "tests/test_recover_ncbi_project_runs.py"
      - "tests/test_audit_chang2026_biosample_morph_metadata.py"
      - "data/evidence/chang2026_east_asia_accession_audit_*.csv"
      - ".github/workflows/audit-chang2026-takaoense-biosamples.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and run offline tests
        run: |
          python -m py_compile \
            analysis/recover_ncbi_project_runs.py \
            analysis/audit_chang2026_biosample_morph_metadata.py
          python -m unittest \
            tests/test_recover_ncbi_project_runs.py \
            tests/test_audit_chang2026_biosample_morph_metadata.py \
            -v

      - name: Recover PRJNA1311153 run metadata
        env:
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          set -euo pipefail
          python analysis/recover_ncbi_project_runs.py \
            --bioproject PRJNA1311153 \
            --outdir chang2026_ncbi_runinfo

      - name: Audit direct sample-level colour attributes
        env:
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          set -euo pipefail
          runinfo=$(find chang2026_ncbi_runinfo -name 'PRJNA1311153_runinfo.csv' -print -quit)
          test -n "$runinfo"
          python analysis/audit_chang2026_biosample_morph_metadata.py \
            --runinfo "$runinfo" \
            --outdir chang2026_takaoense_biosample_audit

      - name: Validate conservative evidence rules and summarize
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          outdir = Path("chang2026_takaoense_biosample_audit")
          audit_path = outdir / "takaoense_biosample_morph_audit.csv"
          long_path = outdir / "takaoense_biosample_attributes_long.csv"
          ambiguity_path = outdir / "takaoense_run_match_ambiguities.csv"
          summary_path = outdir / "biosample_morph_audit_summary.json"

          def rows(path):
              with path.open(encoding="utf-8-sig", newline="") as handle:
                  return list(csv.DictReader(handle))

          audit = rows(audit_path)
          attributes = rows(long_path)
          ambiguities = rows(ambiguity_path)
          summary = json.loads(summary_path.read_text(encoding="utf-8"))

          expected_vouchers = {
              "ccy3559", "ccy3807", "ccy3835",
              "ccy3560", "ccy3629", "ccy3839",
          }
          observed_vouchers = {row["voucher"] for row in audit}
          if len(audit) != 6 or observed_vouchers != expected_vouchers:
              raise SystemExit(
                  f"Expected the six published takaoense vouchers, observed {observed_vouchers}"
              )

          assigned = [row for row in audit if row["direct_ncbi_colour_label"]]
          for row in assigned:
              if row["review_status"] != "assigned_from_explicit_ncbi_attribute":
                  raise SystemExit(
                      f"Assigned voucher lacks explicit-attribute status: {row['voucher']}"
                  )
              if not row["morph_relevant_attributes"]:
                  raise SystemExit(
                      f"Assigned voucher lacks quoted NCBI attribute: {row['voucher']}"
                  )
              if row["direct_ncbi_colour_label"] not in {"W", "BP"}:
                  raise SystemExit(f"Unexpected morph label: {row}")

          for row in audit:
              if row["direct_ncbi_colour_label"]:
                  continue
              if row["binary_colour_code"] or row["flower_colour_state"]:
                  raise SystemExit(
                      f"Unresolved voucher received an inferred colour: {row['voucher']}"
                  )
              if "No assignment from locality" not in row["notes"]:
                  raise SystemExit(
                      f"Geographic-inference guard missing: {row['voucher']}"
                  )

          if summary["seed_vouchers"] != 6:
              raise SystemExit("Summary no longer reports six seed vouchers")
          if summary["direct_sample_colour_assignments"] != len(assigned):
              raise SystemExit("Summary and audit disagree on direct assignments")

          print(f"project_runinfo_rows={summary['project_runinfo_rows']}")
          print(f"candidate_takaoense_runs={summary['candidate_takaoense_run_rows']}")
          print(f"voucher_run_matches={summary['voucher_run_matches']}")
          print(f"ambiguous_voucher_run_matches={summary['ambiguous_voucher_run_matches']}")
          print(f"biosamples_with_attributes={summary['biosamples_with_attribute_records']}")
          print(f"all_attribute_rows={summary['attribute_rows']}")
          print(f"morph_relevant_attribute_rows={summary['morph_relevant_attribute_rows']}")
          print(f"direct_colour_assignments={len(assigned)}")
          print("assigned_vouchers=" + "|".join(row["voucher"] for row in assigned))
          print("unresolved_vouchers=" + "|".join(summary["unresolved_vouchers"]))
          print(f"run_match_ambiguity_rows={len(ambiguities)}")
          print(f"long_attribute_rows={len(attributes)}")
          PY

      - name: Upload NCBI morph audit
        uses: actions/upload-artifact@v4
        with:
          name: chang2026-takaoense-biosample-morph-audit-${{ github.run_id }}
          path: |
            chang2026_ncbi_runinfo/
            chang2026_takaoense_biosample_audit/
          if-no-files-found: error
          retention-days: 90
