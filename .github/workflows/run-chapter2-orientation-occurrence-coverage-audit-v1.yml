name: Run Chapter 2 orientation occurrence coverage audit v1

on:
  pull_request:
    paths:
      - "analysis/run_chapter2_orientation_occurrence_coverage_audit_v1.py"
      - "data/evidence/chapter2_orientation_occurrence_coverage_audit_contract_v1.json"
      - ".github/workflows/run-chapter2-orientation-occurrence-coverage-audit-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check pandas
      - name: Verify frozen source artifacts
        run: |
          set -euo pipefail
          test "$(gh api repos/zuizui0223/EAzami/actions/artifacts/9516784077 --jq .digest)" = "sha256:cb5717c90cbc769398f9ffce38787704a02e34253c1ff16cf8f368ba55aeda96"
          test "$(gh api repos/zuizui0223/EAzami/actions/artifacts/9520157997 --jq .digest)" = "sha256:819936ceeb6008f356c580622fb72972617700402afaa3d3ab125bff2e6d9106"
      - name: Recover frozen occurrence assets
        run: |
          mkdir -p recovered/japan recovered/taiwan .tmp/orientation_coverage
          gh run download 32716015605 --name fdt4-japan-orientation-niche-v1 --dir recovered/japan
          gh run download 32725842871 --name fdt4-taiwan-orientation-niche-v1 --dir recovered/taiwan
      - name: Compile audit
        run: python -m py_compile analysis/run_chapter2_orientation_occurrence_coverage_audit_v1.py
      - name: Run coverage audit
        run: |
          python analysis/run_chapter2_orientation_occurrence_coverage_audit_v1.py \
            --contract data/evidence/chapter2_orientation_occurrence_coverage_audit_contract_v1.json \
            --orientation data/evidence/orientation_comp1061_20tip_source_crosswalk_v1.csv \
            --japan-occurrences recovered/japan/focal_occurrences_environment_complete.csv \
            --taiwan-occurrences recovered/taiwan/focal_occurrences_environment_complete.csv \
            --out-json .tmp/orientation_coverage/result.json \
            --out-csv .tmp/orientation_coverage/taxa.csv
      - name: Validate audit output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('.tmp/orientation_coverage/result.json').read_text())
          assert x['version']=='chapter2_orientation_occurrence_coverage_audit_result_v1'
          assert set(x['threshold_summaries'])=={'10','5','3'}
          assert x['classification'] in {
              'relaxed_existing_coverage_materially_expands_state_diverse_panel',
              'relaxed_existing_coverage_does_not_enable_meaningful_specificity_expansion'
          }
          print(json.dumps(x, indent=2))
          PY
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-orientation-occurrence-coverage-audit-v1
          path: .tmp/orientation_coverage/
          if-no-files-found: error
          retention-days: 90
