name: Audit Chang 2026 BioSample morph metadata

on:
  pull_request:
    paths:
      - "analysis/recover_ncbi_project_runs.py"
      - "analysis/audit_chang2026_biosample_morph_metadata.py"
      - "analysis/audit_chang2026_biosample_morph_metadata_v2.py"
      - "tests/test_recover_ncbi_project_runs.py"
      - "tests/test_audit_chang2026_biosample_morph_metadata.py"
      - "tests/test_audit_chang2026_biosample_morph_metadata_v2.py"
      - "data/evidence/chang2026_east_asia_accession_audit_*.csv"
      - ".github/workflows/audit-chang2026-biosample-morph.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and run offline tests
        run: |
          python -m py_compile \
            analysis/recover_ncbi_project_runs.py \
            analysis/audit_chang2026_biosample_morph_metadata.py \
            analysis/audit_chang2026_biosample_morph_metadata_v2.py
          python -m unittest \
            tests/test_recover_ncbi_project_runs.py \
            tests/test_audit_chang2026_biosample_morph_metadata.py \
            tests/test_audit_chang2026_biosample_morph_metadata_v2.py \
            -v

      - name: Recover official PRJNA1311153 SRA runinfo
        env:
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          : > /tmp/no_focal_taxa.txt
          python analysis/recover_ncbi_project_runs.py \
            --bioproject PRJNA1311153 \
            --outdir ncbi_chang2026 \
            --focal-taxa /tmp/no_focal_taxa.txt

      - name: Link vouchers to runs and audit full BioSample attributes
        env:
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          runinfo=$(find ncbi_chang2026 -name '*_runinfo.csv' -print -quit)
          test -n "$runinfo"
          python analysis/audit_chang2026_biosample_morph_metadata_v2.py \
            --runinfo "$runinfo" \
            --outdir data/evidence/generated/chang2026_biosample_morph_audit
          cp "$runinfo" data/evidence/generated/chang2026_biosample_morph_audit/

      - name: Validate exact provenance and conservative morph rules
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          outdir = Path("data/evidence/generated/chang2026_biosample_morph_audit")
          summary = json.loads(
              (outdir / "biosample_morph_audit_summary.json").read_text(encoding="utf-8")
          )

          def rows(name):
              with (outdir / name).open(encoding="utf-8-sig", newline="") as handle:
                  return list(csv.DictReader(handle))

          audit = rows("takaoense_biosample_morph_audit.csv")
          attributes = rows("takaoense_biosample_attributes_long.csv")
          ambiguities = rows("takaoense_run_match_ambiguities.csv")

          print(f"project_runinfo_rows={summary['project_runinfo_rows']}")
          print(f"candidate_takaoense_run_rows={summary['candidate_takaoense_run_rows']}")
          print(f"voucher_run_matches={summary['voucher_run_matches']}")
          print(f"ambiguous_voucher_run_matches={summary['ambiguous_voucher_run_matches']}")
          print(f"biosamples_with_attribute_records={summary['biosamples_with_attribute_records']}")
          print(f"attribute_rows={summary['attribute_rows']}")
          print(f"morph_relevant_attribute_rows={summary['morph_relevant_attribute_rows']}")
          print(f"direct_sample_colour_assignments={summary['direct_sample_colour_assignments']}")
          print("unresolved_vouchers=" + "|".join(summary['unresolved_vouchers']))

          expected_vouchers = {
              'ccy3559', 'ccy3807', 'ccy3835',
              'ccy3560', 'ccy3629', 'ccy3839'
          }
          expected_pairs = {
              'ccy3559': ('SRR35152718', 'SAMN50798021'),
              'ccy3560': ('SRR35152717', 'SAMN50798022'),
              'ccy3629': ('SRR35152738', 'SAMN50798024'),
              'ccy3807': ('SRR35152736', 'SAMN50798026'),
              'ccy3835': ('SRR35152735', 'SAMN50798027'),
              'ccy3839': ('SRR35152734', 'SAMN50798028'),
          }

          if summary['seed_vouchers'] != 6 or len(audit) != 6:
              raise SystemExit("Expected six published takaoense voucher rows")
          if {row['voucher'] for row in audit} != expected_vouchers:
              raise SystemExit("Published takaoense voucher membership changed")
          if summary['project_runinfo_rows'] != 25:
              raise SystemExit("Expected 25 PRJNA1311153 runinfo rows")
          if summary['candidate_takaoense_run_rows'] != 6:
              raise SystemExit("Expected six takaoense SRA run rows")
          if summary['voucher_run_matches'] != 6:
              raise SystemExit("Every published voucher must link to one SRA run")
          if summary['ambiguous_voucher_run_matches'] != 0 or ambiguities:
              raise SystemExit("Voucher-to-run mapping must be one-to-one")
          if summary['biosamples_with_attribute_records'] != 6:
              raise SystemExit("Expected six BioSample attribute records")
          if summary['attribute_rows'] != 36:
              raise SystemExit("Expected six attributes for each of six BioSamples")
          if summary['morph_relevant_attribute_rows'] != 0:
              raise SystemExit("NCBI unexpectedly gained a morph-relevant attribute; review it")
          if summary['direct_sample_colour_assignments'] != 0:
              raise SystemExit("NCBI metadata must not invent W/BP assignments")
          if set(summary['unresolved_vouchers']) != expected_vouchers:
              raise SystemExit("All six morph labels should remain unresolved")

          for row in audit:
              expected_run, expected_biosample = expected_pairs[row['voucher']]
              if (row['run'], row['biosample']) != (expected_run, expected_biosample):
                  raise SystemExit(
                      f"Unexpected run/BioSample for {row['voucher']}: "
                      f"{row['run']}/{row['biosample']}"
                  )
              if row['run_match_basis'] != 'exact_takaoense_collector_number_in_sample_name':
                  raise SystemExit(f"Unexpected match basis for {row['voucher']}")
              if row['direct_ncbi_colour_label'] or row['flower_colour_state']:
                  raise SystemExit(f"{row['voucher']} received an unsupported morph label")
              if row['review_status'] != 'no_explicit_ncbi_colour_attribute':
                  raise SystemExit(f"Unexpected review status for {row['voucher']}")
              if 'No assignment from locality' not in row['notes']:
                  raise SystemExit("Geographic-inference guard is missing")

          relevant = [row for row in attributes if row['morph_relevant'] == 'yes']
          if relevant:
              raise SystemExit("No NCBI attribute should directly describe flower colour")
          PY

      - name: Upload official metadata audit
        uses: actions/upload-artifact@v4
        with:
          name: chang2026-prjna1311153-morph-audit-${{ github.run_id }}
          path: |
            ncbi_chang2026/
            data/evidence/generated/chang2026_biosample_morph_audit/
          if-no-files-found: error
          retention-days: 90
