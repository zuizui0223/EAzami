name: Validate functional-time existing materials

on:
  pull_request:
    paths:
      - "analysis/audit_functional_time_existing_materials_v1.py"
      - "analysis/meta_analyze_existing_capitulum_module_pollinator_analogs_v1.py"
      - "tests/test_functional_time_existing_materials_v1.py"
      - "tests/test_meta_analyze_existing_capitulum_module_pollinator_analogs_v1.py"
      - "data/evidence/japan38_nmns_capitulum_trait_seed_v1.csv"
      - "data/evidence/moreyra2025_japan_38_membership_audit_2026-08-10.csv"
      - "data/evidence/functional_diversity_time_meta_registry_v1.csv"
      - "data/evidence/functional_effect_existing_seed_registry_v1.csv"
      - "data/evidence/phyllary_posture_harmonization_contract_v1.json"
      - "data/evidence/experimental_pollinator_selection_gradients_v1.csv"
      - ".github/workflows/validate-functional-time-existing-materials-v1.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Recompute existing-material preflight
        run: |
          python analysis/audit_functional_time_existing_materials_v1.py --output /tmp/functional-time-existing-materials-v1.json
          cat /tmp/functional-time-existing-materials-v1.json
      - name: Recompute existing pollinator module analogs
        run: |
          python analysis/meta_analyze_existing_capitulum_module_pollinator_analogs_v1.py --output /tmp/existing-capitulum-module-pollinator-analogs-v1.json
          cat /tmp/existing-capitulum-module-pollinator-analogs-v1.json
      - name: Validate invariants
        run: |
          python -m pytest -q tests/test_functional_time_existing_materials_v1.py
          python -m pytest -q tests/test_meta_analyze_existing_capitulum_module_pollinator_analogs_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: functional-time-existing-materials-v1
          path: |
            /tmp/functional-time-existing-materials-v1.json
            /tmp/existing-capitulum-module-pollinator-analogs-v1.json
