name: Validate fixed-white target-capture panel

on:
  pull_request:
    paths:
      - "sampling/FIXED_WHITE_TARGET_CAPTURE_PANEL_V0_1.csv"
      - "sampling/FIXED_WHITE_A1_SAMPLE_INTAKE_V0_1.csv"
      - "analysis/validate_fixed_white_target_capture_panel.py"
      - "analysis/validate_fixed_white_tree_promotion_contract.py"
      - "analysis/validate_fixed_white_a1_sample_intake.py"
      - "analysis/evaluate_fixed_white_a1_recovery_qc.py"
      - "analysis/validate_fixed_white_public_nuclear_recovery_audit.py"
      - "analysis/validate_boninense_migseq_public_recovery_v1.py"
      - "analysis/cirsium_flower_colour_atlas_v0_3_readiness.json"
      - "data/evidence/flower_colour_rate_tree_contract_v0_2.json"
      - "data/evidence/fixed_white_tree_promotion_contract_v0_2.json"
      - "data/evidence/fixed_white_a1_priority_v2.csv"
      - "data/evidence/boninense_migseq_public_recovery_v1.json"
      - "data/evidence/fixed_white_public_nuclear_recovery_audit_2026-08-12.csv"
      - "tests/test_fixed_white_target_capture_panel.py"
      - "tests/test_fixed_white_tree_promotion_contract.py"
      - "tests/test_fixed_white_a1_sample_intake.py"
      - "tests/test_boninense_migseq_public_recovery_v1.py"
      - "tests/test_validate_fixed_white_public_nuclear_recovery_audit.py"
      - "docs/FIXED_WHITE_TIP_GATE_TARGET_CAPTURE_2026-08-12.md"
      - "docs/FIXED_WHITE_PUBLIC_DATA_RECOVERY_2026-08-12.md"
      - ".github/workflows/validate-fixed-white-target-capture-panel.yml"
  workflow_dispatch:

concurrency:
  group: validate-fixed-white-target-capture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test active fixed-white intake, promotion and recovery contracts
        run: |
          python -m py_compile \
            analysis/validate_fixed_white_target_capture_panel.py \
            analysis/validate_fixed_white_tree_promotion_contract.py \
            analysis/validate_fixed_white_a1_sample_intake.py \
            analysis/evaluate_fixed_white_a1_recovery_qc.py \
            analysis/validate_fixed_white_public_nuclear_recovery_audit.py \
            analysis/validate_boninense_migseq_public_recovery_v1.py
          python -m unittest \
            tests/test_fixed_white_target_capture_panel.py \
            tests/test_fixed_white_tree_promotion_contract.py \
            tests/test_fixed_white_a1_sample_intake.py \
            tests/test_boninense_migseq_public_recovery_v1.py \
            tests/test_validate_fixed_white_public_nuclear_recovery_audit.py \
            -v
      - name: Validate current external-data intake remains empty and fail-closed
        run: |
          set -euo pipefail
          python analysis/validate_fixed_white_a1_sample_intake.py \
            sampling/FIXED_WHITE_A1_SAMPLE_INTAKE_V0_1.csv \
            --output /tmp/fixed_white_a1_intake.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/fixed_white_a1_intake.json'))
          assert x['available_samples_by_taxon']=={'Cirsium boninense':0,'Cirsium wulongense':0}
          assert x['minimum_external_reads_available'] is False
          assert x['recovery_qc_allowed'] is False
          assert x['rate_fit_tip_promotion_allowed'] is False
          print('a1_external_samples_available=0')
          print('recovery_qc_allowed=false')
          PY
      - name: Validate active target-capture and tree-promotion gates
        run: |
          set -euo pipefail
          python analysis/validate_fixed_white_target_capture_panel.py \
            sampling/FIXED_WHITE_TARGET_CAPTURE_PANEL_V0_1.csv
          python analysis/validate_fixed_white_tree_promotion_contract.py \
            data/evidence/fixed_white_tree_promotion_contract_v0_2.json \
            --atlas analysis/cirsium_flower_colour_atlas_v0_3_readiness.json \
            --tree-contract data/evidence/flower_colour_rate_tree_contract_v0_2.json \
            --panel sampling/FIXED_WHITE_TARGET_CAPTURE_PANEL_V0_1.csv \
            --priority data/evidence/fixed_white_a1_priority_v2.csv \
            > /tmp/fixed_white_promotion_v02.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/fixed_white_promotion_v02.json'))
          assert x['contract_version']=='fixed_white_tree_promotion_v0_2'
          assert x['a1_taxa']==['Cirsium boninense','Cirsium wulongense']
          assert x['external_samples_available']==0
          assert x['sample_intake_manifest']=='sampling/FIXED_WHITE_A1_SAMPLE_INTAKE_V0_1.csv'
          assert x['frozen_loci']==153
          assert x['minimum_clean_recovered_loci_per_individual']==123
          assert x['minimum_passing_individuals_per_taxon']==2
          assert x['recovery_qc_evaluator']=='analysis/evaluate_fixed_white_a1_recovery_qc.py'
          assert x['final_taxa']==22
          assert x['final_states']=={'C':17,'W':5}
          assert x['target_tree_tips_with_root']==23
          assert x['current_rate_fit_execution_allowed'] is False
          print('promotion_contract=fixed_white_tree_promotion_v0_2')
          print('frozen_loci=153')
          print('minimum_clean_recovered_loci_per_individual=123')
          print('target_final_tree=22_focal_plus_1_root')
          PY
      - name: Assert public-data recovery still does not create an A1 rate tip
        run: |
          set -euo pipefail
          python analysis/validate_fixed_white_public_nuclear_recovery_audit.py \
            data/evidence/fixed_white_public_nuclear_recovery_audit_2026-08-12.csv \
            --output /tmp/fixed_white_public_recovery_status.json
          python analysis/validate_boninense_migseq_public_recovery_v1.py \
            --recovery data/evidence/boninense_migseq_public_recovery_v1.json \
            --priority data/evidence/fixed_white_a1_priority_v2.csv \
            --output /tmp/boninense_migseq_recovery_status.json
          python - <<'PY'
          import json
          old=json.load(open('/tmp/fixed_white_public_recovery_status.json'))
          bon=json.load(open('/tmp/boninense_migseq_recovery_status.json'))
          assert old['usable_nuclear_tip_recovered'] is False
          assert old['rate_fit_tip_promotion_allowed'] is False
          assert set(old['candidates'].values())=={'Cirsium boninense','Cirsium wulongense'}
          assert bon['boninense_method_confirmed']=='MIG-seq'
          assert bon['raw_or_genotype_data_recovered'] is False
          assert bon['compositae1061_tip_recovered'] is False
          assert bon['rate_fit_tip_promotion_allowed'] is False
          print('public_data_discovery_only=true')
          print('boninense_method=MIG-seq')
          print('a1_homologous_tip_recovered=false')
          print('rate_fit_tip_promotion_allowed=false')
          PY
