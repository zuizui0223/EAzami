name: Validate Chapter 2 dated-tree public recovery audit v1

on:
  pull_request:
    paths:
      - "analysis/validate_chapter2_dated_tree_public_recovery_audit_v1.py"
      - "analysis/validate_chapter2_selection_pressure_triangulation_v1.py"
      - "data/evidence/chapter2_dated_tree_public_recovery_audit_v1.csv"
      - "data/evidence/chapter2_dated_tree_request_manifest_v1.json"
      - "docs/chapter2/DATED_TREE_PUBLIC_RECOVERY_AUDIT_V1.md"
      - "docs/chapter2/DATED_TREE_AUTHOR_REQUEST_DRAFT_V1.md"
      - ".github/workflows/validate-chapter2-dated-tree-public-recovery-audit-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and validate dated-tree recovery boundary
        run: |
          set -euo pipefail
          python -m py_compile \
            analysis/validate_chapter2_selection_pressure_triangulation_v1.py \
            analysis/validate_chapter2_dated_tree_public_recovery_audit_v1.py
          python analysis/validate_chapter2_dated_tree_public_recovery_audit_v1.py
