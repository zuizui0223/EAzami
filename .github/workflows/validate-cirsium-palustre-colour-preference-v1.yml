name: Validate Cirsium palustre colour preference v1
on:
  pull_request:
    paths:
      - "analysis/reconstruct_cirsium_palustre_colour_preference_v1.py"
      - "data/evidence/cirsium_palustre_colour_preference_fig24_v1.csv"
      - "data/evidence/cirsium_palustre_colour_preference_fig24_v1.json"
      - "data/evidence/capitulum_pattern_reduction_targets_v2.csv"
      - "data/evidence/macro_interaction_pattern_targets_v2.csv"
      - "sampling/aim2_capitulum_field_ledger_v1.csv"
      - "sampling/aim2_capitulum_observation_bout_ledger_v1.csv"
      - "docs/AIM2_TRANCHE1_JOINT_OBSERVATION_PROTOCOL_2026-08-20.md"
      - "tests/test_cirsium_palustre_colour_preference_v1.py"
      - ".github/workflows/validate-cirsium-palustre-colour-preference-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate quantitative colour preference and field discriminator
        run: |
          python -m py_compile analysis/reconstruct_cirsium_palustre_colour_preference_v1.py
          python -m unittest tests/test_cirsium_palustre_colour_preference_v1.py -v
