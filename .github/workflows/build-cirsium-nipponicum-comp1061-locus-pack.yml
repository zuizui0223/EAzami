name: Build Cirsium nipponicum Compositae1061 locus pack

on:
  pull_request:
    paths:
      - "analysis/build_cirsium_nipponicum_comp1061_locus_pack.py"
      - "tests/test_build_cirsium_nipponicum_comp1061_locus_pack.py"
      - "data/evidence/cirsium_nipponicum_public_genome_comp1061_contract_v1.json"
      - "analysis/recover_comp1061_original_hybpiper_reference.py"
      - "analysis/recover_moreyra_author_repository.py"
      - "analysis/summarize_moreyra_locus_filter.py"
      - "analysis/export_moreyra_locus_manifests.py"
      - ".github/workflows/build-cirsium-nipponicum-comp1061-locus-pack.yml"
  workflow_dispatch:

concurrency:
  group: cnip-comp1061-pack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-public-genome-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and unit test
        run: |
          python -m py_compile analysis/build_cirsium_nipponicum_comp1061_locus_pack.py
          python -m unittest tests/test_build_cirsium_nipponicum_comp1061_locus_pack.py -v
      - name: Install genome-to-CDS and homology tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gffread diamond-aligner
          gffread --version
          diamond version
      - name: Recover frozen Compositae1061 reference and conservative 241-locus universe
        run: |
          mkdir -p /tmp/cnip/reference /tmp/cnip/locus_sets /tmp/cnip/source /tmp/cnip/work /tmp/cnip/output
          python analysis/recover_comp1061_original_hybpiper_reference.py --outdir /tmp/cnip/reference
          python analysis/recover_moreyra_author_repository.py --outdir /tmp/cnip/moreyra_author_repo --force
          python analysis/summarize_moreyra_locus_filter.py --audit-dir /tmp/cnip/moreyra_author_repo
          python analysis/export_moreyra_locus_manifests.py \
            --input /tmp/cnip/moreyra_author_repo/paralog_locus_filter_reconstruction.csv \
            --outdir /tmp/cnip/locus_sets
          test -s /tmp/cnip/reference/comp1061_hybpiper_reference.fasta
          echo '77d510ef101d08a7a23a4df391d077d3b7f75482c66f7f4bea6d32cf290ced2c  /tmp/cnip/reference/comp1061_hybpiper_reference.fasta' | sha256sum -c -
          test "$(wc -l < /tmp/cnip/locus_sets/moreyra_conservative_241_no_warning_loci.txt)" -eq 241
      - name: Download and checksum the public Ulleung genome, GFF3 and proteome
        run: |
          curl --fail --location --retry 4 --retry-delay 5 \
            'https://ndownloader.figshare.com/files/48979486' \
            -o /tmp/cnip/source/C.nipponicum_aa.fa
          curl --fail --location --retry 4 --retry-delay 5 \
            'https://ndownloader.figshare.com/files/48979489' \
            -o /tmp/cnip/source/C.nipponicum_softmasked_genome.fa
          curl --fail --location --retry 4 --retry-delay 5 \
            'https://ndownloader.figshare.com/files/48979519' \
            -o /tmp/cnip/source/C.nipponicum.gff3
          echo '5c76467d3ad7f15df94897463633ce4a  /tmp/cnip/source/C.nipponicum_aa.fa' | md5sum -c -
          echo 'e9390e23ffd0dc5e3da8271db4d1d3ca  /tmp/cnip/source/C.nipponicum_softmasked_genome.fa' | md5sum -c -
          echo '6bfb9bc256624aff95d03f9c67414bee  /tmp/cnip/source/C.nipponicum.gff3' | md5sum -c -
      - name: Reconstruct annotation-linked CDS and proteins
        run: |
          gffread /tmp/cnip/source/C.nipponicum.gff3 \
            -g /tmp/cnip/source/C.nipponicum_softmasked_genome.fa \
            -x /tmp/cnip/work/C.nipponicum_gffread_cds.fa \
            -y /tmp/cnip/work/C.nipponicum_gffread_aa.fa
          test -s /tmp/cnip/work/C.nipponicum_gffread_cds.fa
          test -s /tmp/cnip/work/C.nipponicum_gffread_aa.fa
          python - <<'PY'
          from pathlib import Path
          def nseq(p): return sum(1 for x in Path(p).open() if x.startswith('>'))
          cds=nseq('/tmp/cnip/work/C.nipponicum_gffread_cds.fa')
          aa=nseq('/tmp/cnip/work/C.nipponicum_gffread_aa.fa')
          pub=nseq('/tmp/cnip/source/C.nipponicum_aa.fa')
          print(f'gffread_cds={cds} gffread_aa={aa} published_aa={pub}')
          if cds < 25000 or aa < 25000 or pub < 25000:
              raise SystemExit('unexpectedly sparse public genome annotation/proteome')
          PY
      - name: Map Compositae1061 target references to the Ulleung predicted proteome
        run: |
          diamond makedb \
            --in /tmp/cnip/work/C.nipponicum_gffread_aa.fa \
            --db /tmp/cnip/work/Cnip_gffread
          diamond blastx \
            --query /tmp/cnip/reference/comp1061_hybpiper_reference.fasta \
            --db /tmp/cnip/work/Cnip_gffread \
            --out /tmp/cnip/work/comp1061_vs_cnip_gffread.tsv \
            --outfmt 6 qseqid sseqid pident length evalue bitscore qcovhsp \
            --max-target-seqs 25 \
            --evalue 1e-10 \
            --sensitive \
            --threads 4
          test -s /tmp/cnip/work/comp1061_vs_cnip_gffread.tsv
      - name: Build strict frozen-241 locus pack
        run: |
          python analysis/build_cirsium_nipponicum_comp1061_locus_pack.py \
            --target /tmp/cnip/reference/comp1061_hybpiper_reference.fasta \
            --locus-list /tmp/cnip/locus_sets/moreyra_conservative_241_no_warning_loci.txt \
            --gff-protein /tmp/cnip/work/C.nipponicum_gffread_aa.fa \
            --gff-cds /tmp/cnip/work/C.nipponicum_gffread_cds.fa \
            --published-protein /tmp/cnip/source/C.nipponicum_aa.fa \
            --diamond-hits /tmp/cnip/work/comp1061_vs_cnip_gffread.tsv \
            --outdir /tmp/cnip/output \
            | tee /tmp/cnip/output/build.log
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('/tmp/cnip/output/cirsium_nipponicum_comp1061_locus_pack_summary.json').read_text())
          assert s['frozen_candidate_loci']==241
          assert s['strict_recovered_loci'] >= 100
          assert s['augmentation_locus_pack_ready'] is True
          assert s['tip_id']=='AUG_ULLEUNG_CNIP2024'
          assert s['tree_tip_promotion_allowed'] is False
          files=list(Path('/tmp/cnip/output/loci').glob('*.fasta'))
          assert len(files)==s['strict_recovered_loci']
          print(json.dumps(s,indent=2))
          PY
      - name: Freeze compact provenance, not the 1-GB source genome
        run: |
          cp data/evidence/cirsium_nipponicum_public_genome_comp1061_contract_v1.json /tmp/cnip/output/source_contract.json
          cp /tmp/cnip/locus_sets/moreyra_conservative_241_no_warning_loci.txt /tmp/cnip/output/frozen_241_loci.txt
          sha256sum \
            /tmp/cnip/output/cirsium_nipponicum_comp1061_locus_audit.csv \
            /tmp/cnip/output/strict_recovered_loci.txt \
            > /tmp/cnip/output/artifact_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cirsium-nipponicum-comp1061-locus-pack-${{ github.run_id }}
          path: /tmp/cnip/output
          if-no-files-found: error
