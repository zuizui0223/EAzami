name: Run frozen Comp1061 topology concordance

on:
  pull_request:
    paths:
      - ".github/workflows/run-comp1061-topology-concordance.yml"
      - "data/evidence/full20_comp1061_topology_concordance_preflight_v1.json"
      - "tests/test_full20_comp1061_topology_concordance_preflight.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: comp1061-topology-concordance-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ALIGNMENT_RUN_ID: "32575064385"
  SOURCE_ALIGNMENT_ARTIFACT: "comp1061-saff-root-primary-tree-32575064385"
  SOURCE_ALIGNMENT_ARTIFACT_DIGEST: "sha256:d6dce360848c92fb4cadea83ce20add23dc4d8bddb166ef21bb5ca650b715afa"
  FROZEN_TREE: "data/evidence/full20_comp1061_primary_tree_v1.nwk"
  FROZEN_TREE_SHA256: "c80b66c1e19c91287d3fa243360ae1f4ab6a28613e2d8f1914c23565788bcac5"
  FROZEN_LOCI: "data/evidence/full20_comp1061_saff_root_153_loci_v1.txt"
  FROZEN_LOCI_SHA256: "1106051eca8bfa699f16e05d92024573cb358d7dbd151b89768e76c3d56cde82"

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate frozen topology-sensitivity contract
        run: |
          set -euo pipefail
          python tests/test_full20_comp1061_topology_concordance_preflight.py

  concordance:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned IQ-TREE
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: comp1061-concordance
          create-args: >-
            python=3.11
            iqtree=3.1.3
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          init-shell: none
          generate-run-shell: true
          cache-environment: true
          cache-downloads: true
          post-cleanup: all

      - name: Download immutable 153-locus alignment artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ALIGNMENT_ARTIFACT }}
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_ALIGNMENT_RUN_ID }}

      - name: Verify frozen tree, loci and alignment gate
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          tree=Path(os.environ['FROZEN_TREE'])
          loci=Path(os.environ['FROZEN_LOCI'])
          assert hashlib.sha256(tree.read_bytes()).hexdigest() == os.environ['FROZEN_TREE_SHA256']
          assert hashlib.sha256(loci.read_bytes()).hexdigest() == os.environ['FROZEN_LOCI_SHA256']
          observed=[p for p in Path('tree/alignments').glob('*.aln.fasta') if p.is_file()]
          assert len(observed) == 153, len(observed)
          assert Path('tree_inputs/eligible_loci.txt').read_bytes() == loci.read_bytes()
          aln=json.load(open('tree/alignment_qc/alignment_qc_summary.json'))
          concat=json.load(open('tree/concat/concat_summary.json'))
          assert aln['alignment_qc_passed'] is True and aln['passed_loci'] == 153 and aln['failed_loci'] == 0
          assert aln['posthoc_signal_filtering_applied'] is False
          assert concat['loci'] == 153 and concat['tree_tip_count'] == 21
          assert concat['root_outgroups'] == ['OUTGROUP_saff']
          assert Path('tree/concat/concat.fasta').is_file()
          PY

      - name: Resolve pinned IQ-TREE 3 executable
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          IQTREE_BIN=""
          for candidate in iqtree3 iqtree iqtree2; do
            if command -v "$candidate" >/dev/null 2>&1; then IQTREE_BIN="$(command -v "$candidate")"; break; fi
          done
          test -n "$IQTREE_BIN"
          VERSION="$($IQTREE_BIN --version 2>&1 | head -1)"
          printf 'IQTREE_BIN=%s\n' "$IQTREE_BIN" >> "$GITHUB_ENV"
          printf 'resolved_iqtree=%s\nversion=%s\n' "$IQTREE_BIN" "$VERSION" | tee topology_iqtree_tool.txt
          printf '%s\n' "$VERSION" | grep -Eq 'IQ-TREE.*3\.1\.3|version 3\.1\.3|Version 3\.1\.3'

      - name: Infer all 153 separate-locus ML gene trees
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p sensitivity
          "$IQTREE_BIN" \
            -S tree/alignments \
            -st DNA \
            --prefix sensitivity/loci \
            -T AUTO
          test -s sensitivity/loci.treefile
          python - <<'PY'
          from pathlib import Path
          text=Path('sensitivity/loci.treefile').read_text()
          trees=[x.strip() for x in text.splitlines() if x.strip()]
          assert len(trees) == 153, len(trees)
          assert all(x.endswith(';') for x in trees)
          PY

      - name: Calculate gene concordance factors on frozen primary tree
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          "$IQTREE_BIN" \
            -t "$FROZEN_TREE" \
            --gcf sensitivity/loci.treefile \
            --prefix sensitivity/gcf
          test -s sensitivity/gcf.cf.stat
          test -s sensitivity/gcf.cf.tree
          test -s sensitivity/gcf.cf.branch

      - name: Calculate likelihood-based site concordance factors
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          "$IQTREE_BIN" \
            -te "$FROZEN_TREE" \
            -s tree/concat/concat.fasta \
            --scfl 100 \
            -seed 20260822 \
            -m TIM3+F+R3 \
            --prefix sensitivity/scf \
            -T AUTO
          test -s sensitivity/scf.cf.stat
          test -s sensitivity/scf.cf.tree
          test -s sensitivity/scf.cf.branch

      - name: Write raw sensitivity execution manifest
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          files={
            'locus_trees':'sensitivity/loci.treefile',
            'gcf_stat':'sensitivity/gcf.cf.stat',
            'gcf_tree':'sensitivity/gcf.cf.tree',
            'scf_stat':'sensitivity/scf.cf.stat',
            'scf_tree':'sensitivity/scf.cf.tree',
          }
          hashes={k:hashlib.sha256(Path(v).read_bytes()).hexdigest() for k,v in files.items()}
          manifest={
            'contract_version':'full20_comp1061_topology_concordance_raw_execution_v1',
            'source_alignment_run_id':32575064385,
            'source_alignment_artifact_digest':os.environ['SOURCE_ALIGNMENT_ARTIFACT_DIGEST'],
            'primary_tree_sha256':os.environ['FROZEN_TREE_SHA256'],
            'frozen_loci_sha256':os.environ['FROZEN_LOCI_SHA256'],
            'gene_trees_completed':153,
            'gcf_completed':True,
            'likelihood_scf_completed':True,
            'scf_quartets_per_branch':100,
            'scf_seed':20260822,
            'scf_model_family':'TIM3+F+R3',
            'output_sha256':hashes,
            'data_driven_locus_filtering_applied':False,
            'data_driven_branch_filtering_applied':False,
            'topology_sensitivity_interpretation_pending':True,
            'rate_fit_execution_allowed':False,
            'claim_limit':'Raw gCF/sCF completion quantifies concordance but does not remove low-concordance branches or permit colour-rate fitting. Summary/interpretation is frozen only after the raw stat tables are inspected.'
          }
          Path('sensitivity/raw_execution_manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY

      - name: Upload raw topology-concordance evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comp1061-topology-concordance-${{ github.run_id }}
          path: |
            topology_iqtree_tool.txt
            sensitivity/loci.treefile
            sensitivity/loci.iqtree
            sensitivity/loci.log
            sensitivity/gcf.*
            sensitivity/scf.*
            sensitivity/raw_execution_manifest.json
          if-no-files-found: warn
          retention-days: 30
