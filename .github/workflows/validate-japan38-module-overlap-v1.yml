name: Validate Japan38 module transition overlap v1

on:
  pull_request:
    paths:
      - "analysis/run_japan38_module_transition_overlap_v1.py"
      - "analysis/run_japan38_module_overlap_topology_sensitivity_v1.py"
      - "analysis/summarize_japan38_transition_identifiability_v1.py"
      - "analysis/summarize_japan38_sampling_value_v1.py"
      - "tests/test_japan38_module_transition_overlap_v1.py"
      - "tests/test_japan38_sampling_value_v1.py"
      - ".github/workflows/validate-japan38-module-overlap-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: validate-japan38-module-overlap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FROZEN_JAPAN38_RUN_ID: "32845725038"
  FROZEN_JAPAN38_ARTIFACT: "japan38-comp1061-frozen-tree-retry-32845725038"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependency
        run: pip install biopython
      - name: Compile and test
        run: |
          python -m py_compile \
            analysis/run_japan38_module_transition_overlap_v1.py \
            analysis/run_japan38_module_overlap_topology_sensitivity_v1.py \
            analysis/summarize_japan38_transition_identifiability_v1.py \
            analysis/summarize_japan38_sampling_value_v1.py
          python -m unittest \
            tests/test_japan38_module_transition_overlap_v1.py \
            tests/test_japan38_sampling_value_v1.py -v
      - name: Download frozen completed Japan38 tree result
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FROZEN_JAPAN38_ARTIFACT }}
          path: frozen_japan38
          run-id: ${{ env.FROZEN_JAPAN38_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Run corrected overlap diagnostic on the real Japan38 ML tree
        run: |
          set -euo pipefail
          mkdir -p real_tree
          python analysis/run_japan38_module_transition_overlap_v1.py \
            --tree frozen_japan38/tree_result/japan38_comp1061.treefile \
            --concept-map frozen_japan38/work/japan38_subset/concept_map.csv \
            --trait-seed data/evidence/japan38_nmns_capitulum_trait_seed_v1.csv \
            --permutations 999 \
            --seed 20260825 \
            --output real_tree/japan38_module_transition_overlap_v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('real_tree/japan38_module_transition_overlap_v1.json').read_text())
          assert x['tree_diagnostic']['replicate_monophyly'] is False
          assert x['tree_diagnostic']['replicate_mode']=='pruned_fully_unresolved_replicated_concept'
          assert x['tree_diagnostic']['concept_tips']==36
          assert x['branch_identity']=='unique descendant-tip signature on the rooted analysis tree'
          assert set(x['pairwise_overlap'])=={
              'orientation__phyllary','orientation__stickiness','phyllary__stickiness'
          }
          print(json.dumps(x['pairwise_overlap'],indent=2))
          PY
      - name: Run topology-only sensitivity across all raw UFBoot trees
        run: |
          set -euo pipefail
          python analysis/run_japan38_module_overlap_topology_sensitivity_v1.py \
            --bootstrap-trees frozen_japan38/tree_result/japan38_comp1061.ufboot \
            --ml-tree frozen_japan38/tree_result/japan38_comp1061.treefile \
            --concept-map frozen_japan38/work/japan38_subset/concept_map.csv \
            --trait-seed data/evidence/japan38_nmns_capitulum_trait_seed_v1.csv \
            --output real_tree/japan38_module_overlap_topology_sensitivity_v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('real_tree/japan38_module_overlap_topology_sensitivity_v1.json').read_text())
          b=x['bootstrap_topology_sensitivity']
          assert b['bootstrap_trees_total']==1000
          assert b['jpn20_monophyletic_trees']==0
          os=x['ml_topology_equal_branch']['pairwise_overlap']['orientation__stickiness']['spearman_transition_posterior']
          assert os < 0
          d=b['pairwise_spearman_distributions']['orientation__stickiness']
          assert d['median'] < 0
          assert d['fraction_positive'] < 0.05
          print(json.dumps(x,indent=2))
          PY
      - name: Resolve transition identifiability and trait-completion priorities
        run: |
          set -euo pipefail
          python analysis/summarize_japan38_transition_identifiability_v1.py \
            --tree frozen_japan38/tree_result/japan38_comp1061.treefile \
            --bootstrap-trees frozen_japan38/tree_result/japan38_comp1061.ufboot \
            --concept-map frozen_japan38/work/japan38_subset/concept_map.csv \
            --trait-seed data/evidence/japan38_nmns_capitulum_trait_seed_v1.csv \
            --output real_tree/japan38_transition_identifiability_v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('real_tree/japan38_transition_identifiability_v1.json').read_text())
          ml=x['ml_minimum_reconstructions']
          assert ml['orientation']['minimum_steps']==6
          assert ml['orientation']['minimum_root_state_set']==['U']
          assert len(ml['orientation']['forced_change_edges'])==0
          assert ml['phyllary']['minimum_steps']==3
          assert any(e['edge_id']=='JPN_36' for e in ml['phyllary']['forced_change_edges'])
          assert ml['stickiness']['minimum_steps']==5
          assert any(e['edge_id']=='JPN_06' for e in ml['stickiness']['forced_change_edges'])
          b=x['bootstrap_identifiability']
          assert b['orientation']['minimum_root_state_set_frequencies']=={'U':1000}
          assert b['phyllary']['minimum_step_distribution']['min']==3
          assert b['phyllary']['minimum_step_distribution']['max']==3
          print(json.dumps({
            'bootstrap_identifiability':b,
            'raw_trait_completion':x['trait_completion_priorities'],
          },indent=2))
          PY
      - name: Convert inferential gaps into identity-gated sampling priorities
        run: |
          set -euo pipefail
          python analysis/summarize_japan38_sampling_value_v1.py \
            --identifiability real_tree/japan38_transition_identifiability_v1.json \
            --membership-audit data/evidence/moreyra2025_japan_38_membership_audit_2026-08-10.csv \
            --name-conflicts data/evidence/moreyra2025_name_conflicts_priority_2026-08-10.csv \
            --trait-seed data/evidence/japan38_nmns_capitulum_trait_seed_v1.csv \
            --output real_tree/japan38_sampling_value_v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('real_tree/japan38_sampling_value_v1.json').read_text())
          s=x['operational_shortlist']
          assert s['orientation']['primary']['paper_japan_member_id']=='JPN_34'
          assert s['orientation']['primary_objective']=='transition_localization'
          assert any(r['paper_japan_member_id']=='JPN_33' for r in s['orientation']['analytically_high_but_identity_caution'])
          assert s['phyllary']['primary_objective']=='ancestral_state_discrimination'
          assert s['phyllary']['primary']['paper_japan_member_id'] in {'JPN_15','JPN_18'}
          assert s['stickiness']['primary']['paper_japan_member_id']=='JPN_24'
          cross=x['cross_module_validation_targets']
          assert cross[0]['paper_japan_member_id']=='JPN_36'
          assert set(cross[0]['traits'])=={'orientation','phyllary','stickiness'}
          print(json.dumps({
            'operational_shortlist':s,
            'cross_module_validation_targets':cross,
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: japan38-module-overlap-real-tree-${{ github.run_id }}
          path: |
            real_tree/japan38_module_transition_overlap_v1.json
            real_tree/japan38_module_overlap_topology_sensitivity_v1.json
            real_tree/japan38_transition_identifiability_v1.json
            real_tree/japan38_sampling_value_v1.json
          if-no-files-found: error
          retention-days: 90
