name: Validate Chapter 2 exploratory trait-environment atlas pilot v1

on:
  pull_request:
    paths:
      - "analysis/run_chapter2_exploratory_trait_environment_atlas_pilot_v1.py"
      - "data/evidence/japan_radiation_pre_tree_trait_environment_snapshot_v1.csv"
      - "data/evidence/chapter2_exploratory_trait_environment_atlas_contract_v1.json"
      - "data/evidence/chapter2_exploratory_trait_environment_atlas_pilot_v1.json"
      - "data/evidence/chapter2_space_breadth_time_depth_contract_v1.json"
      - "docs/chapter2/EXPLORATORY_TRAIT_ENVIRONMENT_ATLAS_REFRAME_V1.md"
      - ".github/workflows/validate-chapter2-exploratory-trait-environment-atlas-pilot-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy
          python -m py_compile analysis/run_chapter2_exploratory_trait_environment_atlas_pilot_v1.py
      - name: Re-run complete 7 x 4 internal pilot
        run: |
          rm -rf /tmp/ch2_exploratory_pilot
          mkdir -p /tmp/ch2_exploratory_pilot
          python analysis/run_chapter2_exploratory_trait_environment_atlas_pilot_v1.py \
            --snapshot data/evidence/japan_radiation_pre_tree_trait_environment_snapshot_v1.csv \
            --minimum-environment-observations 10 \
            --out-json /tmp/ch2_exploratory_pilot/result.json \
            --out-csv /tmp/ch2_exploratory_pilot/result.csv
      - name: Validate frozen result and diagnostic boundary
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          frozen=json.loads(Path('data/evidence/chapter2_exploratory_trait_environment_atlas_pilot_v1.json').read_text())
          rerun=json.loads(Path('/tmp/ch2_exploratory_pilot/result.json').read_text())
          contract=json.loads(Path('data/evidence/chapter2_exploratory_trait_environment_atlas_contract_v1.json').read_text())
          parent=json.loads(Path('data/evidence/chapter2_space_breadth_time_depth_contract_v1.json').read_text())
          doc=Path('docs/chapter2/EXPLORATORY_TRAIT_ENVIRONMENT_ATLAS_REFRAME_V1.md').read_text()

          assert frozen['n_taxa']==rerun['n_taxa']==8
          assert frozen['n_tests']==rerun['n_tests']==28
          assert rerun['exact_permutations']==40320
          assert rerun['summary']['bh_supported_rows']==0
          assert rerun['summary']['raw_p_le_0_05_rows']==2
          strongest=rerun['summary']['strongest_raw_row']
          assert strongest['trait']=='shape_width_cv'
          assert strongest['environment']=='BIO12'
          assert math.isclose(strongest['spearman_rho'],0.857142857142857,abs_tol=1e-12)
          assert math.isclose(strongest['exact_two_sided_p'],0.010714285714285714,abs_tol=1e-12)
          assert math.isclose(strongest['bh_q_28'],0.30,abs_tol=1e-12)
          assert strongest['loo_sign_stable'] and strongest['loo_direction']=='positive'

          def key(r): return (r['trait'],r['environment'])
          fr={key(r):r for r in frozen['rows']}
          rr={key(r):r for r in rerun['rows']}
          assert fr.keys()==rr.keys()
          for k in fr:
              for field in ['spearman_rho','exact_two_sided_p','loo_rho_min','loo_rho_max','bh_q_28']:
                  assert math.isclose(fr[k][field],rr[k][field],abs_tol=1e-12),(k,field,fr[k][field],rr[k][field])
              assert fr[k]['status']==rr[k]['status']
              assert fr[k]['loo_direction']==rr[k]['loo_direction']

          assert contract['status']=='internal_exploratory_diagnostic_under_space_time_framework'
          assert contract['manuscript_role'].startswith('optional')
          assert parent['exploratory_environment_role']['not_required_for_final_results'] is True
          assert 'SUPERSEDED BEFORE MERGE' in doc
          assert 'spatial breadth / spatial structure' in doc
          print('chapter2_exploratory_atlas_pilot_v1=VALID_INTERNAL_DIAGNOSTIC')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chapter2-exploratory-trait-environment-atlas-pilot-${{ github.run_id }}
          path: /tmp/ch2_exploratory_pilot/
          if-no-files-found: error
          retention-days: 90
