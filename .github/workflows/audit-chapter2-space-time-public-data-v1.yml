name: Audit Chapter 2 space-time public data v1

on:
  pull_request:
    paths:
      - "analysis/audit_chapter2_space_time_public_data_v1.py"
      - "data/evidence/chapter2_space_time_public_data_contract_v1.json"
      - "data/evidence/source/**"
      - "data/evidence/chapter2_ecological_explanatory_reach_v1.json"
      - ".github/workflows/audit-chapter2-space-time-public-data-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas
          python -m pip check
      - name: Run source-preserving space-time audit
        run: |
          set -euo pipefail
          python -m py_compile analysis/audit_chapter2_space_time_public_data_v1.py
          python analysis/audit_chapter2_space_time_public_data_v1.py \
            --azami-root data/evidence/source \
            --azami-path data/evidence/source/azami_capitulum_space_eazami_targets_run33035785120.csv \
            --eazami-ecology data/evidence/chapter2_ecological_explanatory_reach_v1.json \
            --space-time-contract data/evidence/chapter2_space_time_public_data_contract_v1.json \
            --out-dir output/space_time_audit
      - name: Validate audit boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          p=json.loads(Path('output/space_time_audit/chapter2_space_time_public_data_audit_v1.json').read_text())
          c=pd.read_csv('output/space_time_audit/chapter2_space_time_azami_candidate_records_v1.csv')
          assert p['contract_version']=='chapter2_space_time_public_data_audit_v1'
          assert p['source_contract']=='chapter2_space_time_public_data_contract_v1'
          assert p['azami_files_scanned']>0
          assert p['eazami_current_state']['orientation_status']=='unresolved'
          assert p['provisional_cross_scale_status']['orientation_precipitation'].endswith('pending_BIO12_BIO15_partition')
          assert 'record_text' in c.columns
          assert 'numeric_fields_json' in c.columns
          print(json.dumps(p,indent=2,ensure_ascii=False))
          print(c.to_string(index=False, max_colwidth=160))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter2-space-time-public-data-audit-v1
          path: output/space_time_audit
          if-no-files-found: error
          retention-days: 90
