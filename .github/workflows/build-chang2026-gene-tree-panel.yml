name: Build Chang 2026 gene-tree panel

on:
  pull_request:
    paths:
      - "analysis/recover_ncbi_project_runs.py"
      - "analysis/recover_chang2026_published_runinfo.py"
      - "analysis/reconcile_chang2026_ncbi_runs.py"
      - "analysis/reconcile_chang2026_complete_runs.py"
      - "analysis/audit_chang2026_public_transcriptome_assemblies.py"
      - "analysis/normalize_chang2026_panel_taxa.py"
      - "analysis/build_chang2026_gene_tree_panel.py"
      - "analysis/run_chang2026_transcriptome_assembly.py"
      - "analysis/run_chang2026_layout_aware_transcriptome_assembly.py"
      - "analysis/prefix_fasta_headers.py"
      - "analysis/prepare_chang2026_single_copy_orthogroups.py"
      - "analysis/run_chang2026_single_copy_gene_trees.py"
      - "analysis/score_chang2026_gene_tree_hypotheses.py"
      - "analysis/validate_chang2026_gene_tree_workflow_contract.py"
      - "tests/test_recover_chang2026_published_runinfo.py"
      - "tests/test_reconcile_chang2026_ncbi_runs.py"
      - "tests/test_reconcile_chang2026_complete_runs.py"
      - "tests/test_audit_chang2026_public_transcriptome_assemblies.py"
      - "tests/test_normalize_chang2026_panel_taxa.py"
      - "tests/test_build_chang2026_gene_tree_panel.py"
      - "tests/test_run_chang2026_transcriptome_assembly.py"
      - "tests/test_prepare_chang2026_single_copy_orthogroups.py"
      - "tests/test_run_chang2026_single_copy_gene_trees.py"
      - "tests/test_score_chang2026_gene_tree_hypotheses.py"
      - "tests/test_chang2026_gene_tree_workflow_integration.py"
      - "tests/test_validate_chang2026_gene_tree_workflow_contract.py"
      - "data/evidence/chang2026_east_asia_accession_audit_*.csv"
      - "data/evidence/chang2026_takaoense_figure1_morph_assignments_*.csv"
      - "analysis/chang2026_takaoense_nearest_no_regain_topologies.csv"
      - "analysis/chang2026_takaoense_topology_robustness_summary.json"
      - "workflow/chang2026_gene_trees/**"
      - ".github/workflows/build-chang2026-gene-tree-panel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and run offline tests
        run: |
          python -m py_compile \
            analysis/recover_ncbi_project_runs.py \
            analysis/recover_chang2026_published_runinfo.py \
            analysis/reconcile_chang2026_ncbi_runs.py \
            analysis/reconcile_chang2026_complete_runs.py \
            analysis/audit_chang2026_public_transcriptome_assemblies.py \
            analysis/normalize_chang2026_panel_taxa.py \
            analysis/build_chang2026_gene_tree_panel.py \
            analysis/run_chang2026_transcriptome_assembly.py \
            analysis/run_chang2026_layout_aware_transcriptome_assembly.py \
            analysis/prefix_fasta_headers.py \
            analysis/prepare_chang2026_single_copy_orthogroups.py \
            analysis/run_chang2026_single_copy_gene_trees.py \
            analysis/score_chang2026_gene_tree_hypotheses.py \
            analysis/validate_chang2026_gene_tree_workflow_contract.py
          python -m unittest \
            tests/test_recover_chang2026_published_runinfo.py \
            tests/test_reconcile_chang2026_ncbi_runs.py \
            tests/test_reconcile_chang2026_complete_runs.py \
            tests/test_audit_chang2026_public_transcriptome_assemblies.py \
            tests/test_normalize_chang2026_panel_taxa.py \
            tests/test_build_chang2026_gene_tree_panel.py \
            tests/test_run_chang2026_transcriptome_assembly.py \
            tests/test_prepare_chang2026_single_copy_orthogroups.py \
            tests/test_run_chang2026_single_copy_gene_trees.py \
            tests/test_score_chang2026_gene_tree_hypotheses.py \
            tests/test_chang2026_gene_tree_workflow_integration.py \
            tests/test_validate_chang2026_gene_tree_workflow_contract.py \
            -v

      - name: Recover complete runs and public assembly links
        env:
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          python analysis/recover_chang2026_published_runinfo.py \
            --bioproject PRJNA1311153 \
            --supplement data/evidence/chang2026_east_asia_accession_audit_2026-08-10.csv \
            --outdir /tmp/chang2026_ncbi
          runinfo=$(find /tmp/chang2026_ncbi -name '*_published_complete_runinfo.csv' -print -quit)
          if [[ -z "$runinfo" ]]; then
            echo "No complete published runinfo recovered" >&2
            exit 1
          fi
          python analysis/reconcile_chang2026_complete_runs.py \
            --runinfo "$runinfo" \
            --outdir /tmp/chang2026_reconciliation
          python analysis/audit_chang2026_public_transcriptome_assemblies.py \
            --manifest /tmp/chang2026_reconciliation/chang2026_sample_run_reconciliation.csv \
            --outdir /tmp/chang2026_public_assemblies

      - name: Build analysis panel and competing hypotheses
        run: |
          mkdir -p /tmp/chang2026_gene_tree_panel
          python analysis/normalize_chang2026_panel_taxa.py \
            --input /tmp/chang2026_reconciliation/chang2026_sample_run_reconciliation.csv \
            --output /tmp/chang2026_gene_tree_panel/chang2026_panel_taxon_normalized_reconciliation.csv \
            --summary /tmp/chang2026_gene_tree_panel/chang2026_panel_taxon_normalization_summary.json
          python analysis/build_chang2026_gene_tree_panel.py \
            --reconciliation /tmp/chang2026_gene_tree_panel/chang2026_panel_taxon_normalized_reconciliation.csv \
            --assembly-audit /tmp/chang2026_public_assemblies/chang2026_public_transcriptome_assembly_audit.csv \
            --outdir /tmp/chang2026_gene_tree_panel

      - name: Validate execution contract and Snakemake DAG
        run: |
          set -o pipefail
          python -m pip install --disable-pip-version-check snakemake==9.23.1
          python analysis/validate_chang2026_gene_tree_workflow_contract.py \
            --panel /tmp/chang2026_gene_tree_panel/chang2026_sinocirsium_gene_tree_panel.csv \
            --hypotheses /tmp/chang2026_gene_tree_panel/chang2026_takaoense_gene_tree_hypotheses.csv \
            --snakefile workflow/chang2026_gene_trees/Snakefile \
            --results-dir /tmp/chang2026_gene_tree_dry_run_results \
            --config-output /tmp/chang2026_gene_tree_panel/chang2026_gene_tree_workflow_config.json \
            --summary-output /tmp/chang2026_gene_tree_panel/chang2026_gene_tree_workflow_contract.json
          snakemake --version | tee /tmp/chang2026_gene_tree_panel/snakemake_version.txt
          snakemake \
            --snakefile workflow/chang2026_gene_trees/Snakefile \
            --configfile /tmp/chang2026_gene_tree_panel/chang2026_gene_tree_workflow_config.json \
            --cores 1 \
            --dry-run \
            --printshellcmds \
            2>&1 | tee /tmp/chang2026_gene_tree_panel/snakemake_dry_run.log

      - name: Validate frozen biological and execution design
        run: |
          python - <<'PY'
          import csv
          import json
          from collections import Counter
          from pathlib import Path

          reconciliation = json.loads(
              Path(
                  "/tmp/chang2026_reconciliation/"
                  "chang2026_ncbi_reconciliation_summary.json"
              ).read_text(encoding="utf-8")
          )
          assembly = json.loads(
              Path(
                  "/tmp/chang2026_public_assemblies/"
                  "chang2026_public_assembly_audit_summary.json"
              ).read_text(encoding="utf-8")
          )
          outdir = Path("/tmp/chang2026_gene_tree_panel")
          normalization = json.loads(
              (outdir / "chang2026_panel_taxon_normalization_summary.json")
              .read_text(encoding="utf-8")
          )
          summary = json.loads(
              (outdir / "chang2026_gene_tree_panel_summary.json").read_text(
                  encoding="utf-8"
              )
          )
          contract = json.loads(
              (outdir / "chang2026_gene_tree_workflow_contract.json").read_text(
                  encoding="utf-8"
              )
          )
          snakemake_version = (
              outdir / "snakemake_version.txt"
          ).read_text(encoding="utf-8").strip()
          dry_run_log = (
              outdir / "snakemake_dry_run.log"
          ).read_text(encoding="utf-8")

          def rows(name):
              with (outdir / name).open(encoding="utf-8-sig", newline="") as handle:
                  return list(csv.DictReader(handle))

          normalized = rows("chang2026_panel_taxon_normalized_reconciliation.csv")
          panel = rows("chang2026_sinocirsium_gene_tree_panel.csv")
          pilot = rows("chang2026_takaoense6_assembly_pilot.csv")
          hypotheses = rows("chang2026_takaoense_gene_tree_hypotheses.csv")
          roles = Counter(row["panel_role"] for row in panel)
          panel_layouts = Counter(row["library_layout"] for row in panel)
          read_relations = Counter(row["read_count_relation"] for row in panel)

          print(f"reconciled_samples={reconciliation['verified_or_probable_rows']}")
          print(
              "reconciled_library_layouts="
              + json.dumps(reconciliation["official_library_layout_counts"], sort_keys=True)
          )
          print(f"assembly_audit_samples={assembly['sample_rows']}")
          print(
              "autonym_rows_collapsed_to_species_panel="
              f"{normalization['autonym_rows_collapsed_to_species_panel']}"
          )
          print(f"panel_samples={len(panel)}")
          print(f"unique_runs={len({row['matched_run'] for row in panel})}")
          print("panel_library_layouts=" + json.dumps(dict(panel_layouts), sort_keys=True))
          print("panel_read_count_relations=" + json.dumps(dict(read_relations), sort_keys=True))
          print(f"takaoense_pilot_samples={len(pilot)}")
          print(f"hypotheses={len(hypotheses)}")
          print("roles=" + json.dumps(dict(sorted(roles.items())), sort_keys=True))
          print(f"workflow_contract_version={contract['contract_version']}")
          print(
              "contract_library_layouts="
              + json.dumps(contract["official_library_layout_counts"], sort_keys=True)
          )
          print("snakefile_rules=" + "|".join(contract["snakefile_rules"]))
          print(f"snakemake_version={snakemake_version}")
          print(f"snakemake_dry_run_bytes={len(dry_run_log.encode('utf-8'))}")
          for row in normalization["changed_rows"]:
              print(
                  "PANEL_TAXON_MAP "
                  f"{row['code']} {row['voucher']} "
                  f"{row['source_taxon']} -> {row['panel_taxon']}"
              )
          for row in pilot:
              print(
                  "PILOT "
                  f"{row['sample_id']} {row['morph']} {row['matched_run']} "
                  f"layout={row['library_layout']} de_novo={row['de_novo_required']}"
              )

          expected_taxa = {
              "cirsium japonicum": 2,
              "cirsium japonicum var. albescens": 2,
              "cirsium japonicum var. takaoense": 6,
              "cirsium japonicum var. australe": 3,
              "cirsium japonicum var. fukienense": 4,
              "cirsium lineare": 2,
          }
          expected_changed = {
              ("FKK", "ccy4204"),
              ("ASO", "ccy4220"),
          }
          expected_rules = [
              "all",
              "assemble_transcriptomes",
              "orthofinder",
              "prepare_single_copy_orthogroups",
              "infer_rooted_gene_trees",
              "score_competing_takaoense_histories",
          ]
          observed_changed = {
              (row["code"], row["voucher"])
              for row in normalization["changed_rows"]
          }
          if reconciliation["verified_or_probable_rows"] != 33:
              raise SystemExit("Expected complete 33-sample reconciliation")
          if reconciliation["unique_matched_runs"] != 33:
              raise SystemExit("Expected 33 unique reconciled runs")
          if reconciliation["official_library_layout_counts"] != {"PAIRED": 33}:
              raise SystemExit(
                  "All 33 reconciled Chang runs must be officially paired-end"
              )
          if assembly["sample_rows"] != 33:
              raise SystemExit("Expected 33 public-assembly audit rows")
          if normalization["input_rows"] != 33 or normalization["output_rows"] != 33:
              raise SystemExit("Taxon normalization changed row count")
          if normalization["autonym_rows_collapsed_to_species_panel"] != 2:
              raise SystemExit("Expected exactly two japonicum autonym rows")
          if observed_changed != expected_changed:
              raise SystemExit(f"Unexpected panel taxon mappings: {observed_changed}")
          if any(not row["source_taxon"] for row in normalized):
              raise SystemExit("Source taxon was not preserved for every row")
          if summary["sample_count"] != 19 or len(panel) != 19:
              raise SystemExit("Expected 19 analysis-panel samples")
          if summary["taxon_counts"] != expected_taxa:
              raise SystemExit(f"Unexpected taxon counts: {summary['taxon_counts']}")
          if summary["unique_official_run_count"] != 19:
              raise SystemExit("Expected 19 unique official SRA runs")
          if summary["official_library_layout_counts"] != {"PAIRED": 19}:
              raise SystemExit("Expected 19 officially paired panel runs")
          if dict(panel_layouts) != {"PAIRED": 19}:
              raise SystemExit("Panel CSV lost official layout metadata")
          if len(pilot) != 6:
              raise SystemExit("Expected six takaoense pilot samples")
          if {row["morph"] for row in pilot} != {"W", "BP"}:
              raise SystemExit("Pilot does not contain both published morphs")
          if sum(row["morph"] == "W" for row in pilot) != 3:
              raise SystemExit("Expected three white takaoense samples")
          if sum(row["morph"] == "BP" for row in pilot) != 3:
              raise SystemExit("Expected three bluish-purple takaoense samples")
          if summary["de_novo_required_count"] != 19:
              raise SystemExit("Expected de novo assembly for all 19 panel samples")
          if any(row["de_novo_required"] != "true" for row in panel):
              raise SystemExit("A panel row unexpectedly has a public assembly source")
          if len(hypotheses) != 8:
              raise SystemExit("Expected one regain and seven nearest loss-only hypotheses")
          if hypotheses[0]["hypothesis_id"] != "H_REG_PUBLISHED":
              raise SystemExit("Primary published topology is not first")
          if sum(
              row["history_class"] == "nearest_loss_only_topology"
              for row in hypotheses
          ) != 7:
              raise SystemExit("Expected seven nearest loss-only alternatives")
          if contract["panel_rows"] != 19 or contract["unique_official_runs"] != 19:
              raise SystemExit("Workflow contract does not preserve the 19-run panel")
          if contract["official_library_layout_counts"] != {"PAIRED": 19}:
              raise SystemExit("Workflow contract lost official layout metadata")
          if contract["focal_morph_counts"] != {"BP": 3, "W": 3}:
              raise SystemExit("Workflow contract focal morph counts changed")
          if contract["hypothesis_count"] != 8:
              raise SystemExit("Workflow contract hypothesis count changed")
          if contract["snakefile_rules"] != expected_rules:
              raise SystemExit("Snakemake DAG rule order changed")
          if contract["heavy_computation_executed"]:
              raise SystemExit("CI contract must not claim heavy computation")
          if contract["contract_version"] != "chang2026_gene_tree_workflow_v3_restartable_sra":
              raise SystemExit("Unexpected workflow contract version")
          if snakemake_version != "9.23.1":
              raise SystemExit(f"Unexpected Snakemake version: {snakemake_version}")
          if not dry_run_log.strip():
              raise SystemExit("Snakemake dry-run log is empty")
          for forbidden in (
              "MissingInputException",
              "WorkflowError",
              "RuleException",
              "SyntaxError",
          ):
              if forbidden in dry_run_log:
                  raise SystemExit(f"Snakemake dry-run contains {forbidden}")
          PY

      - name: Upload complete gene-tree input and dry-run package
        uses: actions/upload-artifact@v4
        with:
          name: chang2026-complete-gene-tree-workflow-${{ github.run_id }}
          path: |
            /tmp/chang2026_ncbi/
            /tmp/chang2026_reconciliation/
            /tmp/chang2026_public_assemblies/
            /tmp/chang2026_gene_tree_panel/
          if-no-files-found: error
          retention-days: 90
