name: Validate East Asia colour rate information v1
on:
  pull_request:
    paths:
      - "analysis/diagnose_east_asia_colour_rate_information_v1.py"
      - "data/evidence/east_asia_fixed_colour_dated_scaffold_v1.json"
      - "data/evidence/east_asia_colour_rate_information_v1.json"
      - "tests/test_east_asia_colour_rate_information_v1.py"
      - ".github/workflows/validate-east-asia-colour-rate-information-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install numpy
      - name: Run unit tests
        run: python -m unittest tests/test_east_asia_colour_rate_information_v1.py -v
      - name: Recompute expanded rate profile
        run: |
          python analysis/diagnose_east_asia_colour_rate_information_v1.py \
            --scaffold data/evidence/east_asia_fixed_colour_dated_scaffold_v1.json \
            --output east_asia_colour_rate_information_v1.json
      - name: Validate scientific boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('east_asia_colour_rate_information_v1.json').read_text())
          assert x['n_fixed_tips']==10
          assert x['state_counts']=={'C':7,'W':3}
          assert x['n_nuisance_topology_scenarios']==36
          assert x['all_profile_LR95_hit_upper_grid_boundary'] is True
          assert x['diagnostics']['expanded_fixed_tip_context_identifies_transition_rate'] is False
          assert x['diagnostics']['expanded_fixed_tip_context_identifies_arenicola_ancestor_without_rate_constraint'] is False
          assert x['sampling_implication']['immediate_new_core190_populations']==0
          print('q_best_range=',x['profile_best_q_range_per_myr'])
          print('LR95_q_lower_range=',x['profile_LR95_q_lower_range_per_myr'])
          print('P_C_profile_range=',x['profile_LR95_P_C_arenicola_global_range'])
          print('reference_P_C=',x['reference_P_C_arenicola_ranges'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: east-asia-colour-rate-information-v1
          path: east_asia_colour_rate_information_v1.json
          retention-days: 90
