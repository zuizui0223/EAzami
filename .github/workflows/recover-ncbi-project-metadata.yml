name: Recover NCBI project metadata

on:
  pull_request:
    paths:
      - "analysis/recover_ncbi_project_runs.py"
      - "analysis/recover_published_phylogeny_artifacts.py"
      - "analysis/build_moreyra2025_sample_audit.py"
      - "analysis/build_east_asia_nuclear_coverage.py"
      - "tests/test_recover_ncbi_project_runs.py"
      - "tests/test_recover_published_phylogeny_artifacts.py"
      - "tests/test_build_moreyra2025_sample_audit.py"
      - "tests/test_build_east_asia_nuclear_coverage.py"
      - "data/regional_master_taxa_seed.csv"
      - "data/evidence/focal_taxa_prjna957074.txt"
      - "data/evidence/published_phylogeny_artifact_manifest_*.csv"
      - "data/evidence/prjna957074_focal_tip_recovery_*.csv"
      - "data/evidence/chang2025_nipponocirsium_accession_audit_*.csv"
      - "data/evidence/chang2026_east_asia_accession_audit_*.csv"
      - ".github/workflows/recover-ncbi-project-metadata.yml"
  workflow_dispatch:
    inputs:
      bioproject:
        description: NCBI BioProject accession
        required: true
        default: PRJNA957074
      enrich_biosample:
        description: Fetch BioSample locality/date metadata
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and run offline tests
        run: |
          python -m py_compile \
            analysis/recover_ncbi_project_runs.py \
            analysis/recover_published_phylogeny_artifacts.py \
            analysis/build_moreyra2025_sample_audit.py \
            analysis/build_east_asia_nuclear_coverage.py
          python -m unittest \
            tests/test_recover_ncbi_project_runs.py \
            tests/test_recover_published_phylogeny_artifacts.py \
            tests/test_build_moreyra2025_sample_audit.py \
            tests/test_build_east_asia_nuclear_coverage.py \
            -v

      - name: Recover public SRA and BioSample metadata
        env:
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PROJECT: ${{ inputs.bioproject }}
          DISPATCH_ENRICH: ${{ inputs.enrich_biosample }}
        shell: bash
        run: |
          set -euo pipefail
          project="${DISPATCH_PROJECT:-PRJNA957074}"
          if [[ -z "$project" ]]; then
            project="PRJNA957074"
          fi
          args=(
            --bioproject "$project"
            --outdir ncbi_metadata_output
            --focal-taxa data/evidence/focal_taxa_prjna957074.txt
          )
          if [[ "$EVENT_NAME" == "pull_request" || "${DISPATCH_ENRICH:-true}" == "true" ]]; then
            args+=(--enrich-biosample)
          fi
          python analysis/recover_ncbi_project_runs.py "${args[@]}"

      - name: Recover Moreyra Supplementary Data 1
        shell: bash
        run: |
          set -euo pipefail
          python analysis/recover_published_phylogeny_artifacts.py \
            --manifest data/evidence/published_phylogeny_artifact_manifest_2026-08-10.csv \
            --outdir published_artifact_output \
            --force
          python - <<'PY'
          import csv
          from pathlib import Path

          summary = Path("published_artifact_output/artifact_recovery_summary.csv")
          with summary.open(encoding="utf-8-sig", newline="") as handle:
              rows = {row["artifact_key"]: row for row in csv.DictReader(handle)}
          row = rows["moreyra2025_supplement"]
          expected_hash = "34d15286b4ba0952932c55df3a03a286a0d3dc5fb26ead204e6a1ea16a35f4f1"
          if row["status"] != "downloaded":
              raise SystemExit(f"Moreyra supplement was not downloaded: {row}")
          if row["sha256"] != expected_hash:
              raise SystemExit(f"Moreyra supplement hash changed: {row['sha256']}")
          if row["size_bytes"] != "10761775":
              raise SystemExit(f"Moreyra supplement size changed: {row['size_bytes']}")
          if row["extracted_table_count"] != "3":
              raise SystemExit(f"Expected three extracted tables: {row['extracted_table_count']}")
          PY
          test -s published_artifact_output/moreyra2025_supplement/extracted/table_001.csv

      - name: Join supplement sample table to project runinfo
        shell: bash
        run: |
          set -euo pipefail
          runinfo=$(find ncbi_metadata_output -name '*_runinfo.csv' -print -quit)
          python analysis/build_moreyra2025_sample_audit.py \
            --supplement-table published_artifact_output/moreyra2025_supplement/extracted/table_001.csv \
            --runinfo "$runinfo" \
            --focal-taxa data/evidence/focal_taxa_prjna957074.txt \
            --outdir moreyra_sample_audit_output

      - name: Integrate Moreyra and Chang nuclear coverage
        shell: bash
        run: |
          set -euo pipefail
          python analysis/build_east_asia_nuclear_coverage.py
          test -s data/evidence/generated/east_asia_nuclear_coverage_current.csv
          test -s data/evidence/generated/east_asia_nuclear_coverage_summary.json

      - name: Validate and summarize recovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          outdir = Path("ncbi_metadata_output")
          runinfo = next(outdir.glob("*_runinfo.csv"))
          taxa = next(outdir.glob("*_taxon_summary.csv"))
          raw_audit = next(outdir.glob("*_focal_taxon_audit.csv"))
          joined_audit = Path("moreyra_sample_audit_output/moreyra2025_focal_taxon_audit.csv")
          committed_audit = Path("data/evidence/prjna957074_focal_tip_recovery_2026-08-10.csv")
          summary_path = Path("moreyra_sample_audit_output/moreyra2025_sample_audit_summary.json")
          coverage_path = Path("data/evidence/generated/east_asia_nuclear_coverage_current.csv")
          coverage_summary_path = Path("data/evidence/generated/east_asia_nuclear_coverage_summary.json")

          def rows(path):
              with path.open(encoding="utf-8-sig", newline="") as handle:
                  return list(csv.DictReader(handle))

          run_rows = rows(runinfo)
          taxon_rows = rows(taxa)
          raw_audit_rows = rows(raw_audit)
          joined_rows = rows(joined_audit)
          committed_rows = rows(committed_audit)
          coverage_rows = rows(coverage_path)
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          coverage_summary = json.loads(coverage_summary_path.read_text(encoding="utf-8"))

          exact = [
              row for row in joined_rows
              if row["project_tip_status"] == "exact_sra_project_tip_verified"
          ]
          resolved = [
              row for row in coverage_rows
              if row["species_backbone_gap_class"]
              == "species_placement_resolved_in_modern_nuclear_data"
          ]
          gap_candidates = coverage_summary["priority_A_species_gap_candidates"]

          print(f"run_records={len(run_rows)}")
          print(f"unique_scientific_names={len(taxon_rows)}")
          print(f"raw_focal_taxa={len(raw_audit_rows)}")
          print(f"joined_focal_taxa={len(joined_rows)}")
          print(f"exact_focal_matches={len(exact)}")
          print(f"supplement_sample_rows={summary['supplement_sample_rows']}")
          print(f"linked_supplement_samples={summary['supplement_samples_with_runinfo']}")
          print(f"core_east_asia_samples={summary['core_east_asia_sample_rows']}")
          print(f"northeast_asia_bridge_samples={summary['northeast_asia_bridge_sample_rows']}")
          print(f"integrated_master_taxa={len(coverage_rows)}")
          print(f"resolved_integrated_taxa={len(resolved)}")
          print(f"priority_A_species_gap_candidates={len(gap_candidates)}")
          if gap_candidates:
              print("priority_A_gap_taxa=" + "|".join(gap_candidates))

          if len(run_rows) != 455:
              raise SystemExit(f"Expected 455 project runs, observed {len(run_rows)}")
          if len(taxon_rows) != 327:
              raise SystemExit(f"Expected 327 submitted scientific names, observed {len(taxon_rows)}")
          if summary["supplement_sample_rows"] != 299:
              raise SystemExit("Moreyra Supplementary Table S1 no longer has 299 rows")
          if summary["supplement_samples_with_runinfo"] != 286:
              raise SystemExit("Supplement-to-runinfo linkage count changed unexpectedly")
          if summary["core_east_asia_sample_rows"] != 43:
              raise SystemExit("Core East Asia sample count changed unexpectedly")
          if summary["northeast_asia_bridge_sample_rows"] != 7:
              raise SystemExit("Northeast Asia bridge sample count changed unexpectedly")
          if len(exact) != 10:
              raise SystemExit(f"Expected 10 exact focal matches, observed {len(exact)}")
          if joined_rows != committed_rows:
              raise SystemExit("Generated focal audit differs from committed evidence table")
          if len(coverage_rows) != coverage_summary["taxa"]:
              raise SystemExit("Integrated coverage table and summary disagree")
          PY
          ls -lh ncbi_metadata_output moreyra_sample_audit_output data/evidence/generated

      - name: Upload metadata and reconciliation tables
        uses: actions/upload-artifact@v4
        with:
          name: ncbi-${{ inputs.bioproject || 'PRJNA957074' }}-metadata-${{ github.run_id }}
          path: |
            ncbi_metadata_output/
            moreyra_sample_audit_output/
            published_artifact_output/artifact_recovery_summary.csv
            data/evidence/generated/east_asia_nuclear_coverage_current.csv
            data/evidence/generated/east_asia_nuclear_coverage_summary.json
          if-no-files-found: error
          retention-days: 90
