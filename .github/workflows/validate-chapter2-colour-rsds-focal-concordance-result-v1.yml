name: Validate Chapter 2 focal colour-RSDS result v1

on:
  pull_request:
    paths:
      - "data/evidence/chapter2_colour_rsds_focal_concordance_result_v1.json"
      - "data/evidence/chapter2_colour_rsds_focal_system_contrasts_v1.csv"
      - "docs/chapter2/COLOUR_RSDS_FOCAL_CONCORDANCE_RESULT_V1.md"
      - "analysis/validate_chapter2_colour_rsds_focal_concordance_result_v1.py"
      - ".github/workflows/validate-chapter2-colour-rsds-focal-concordance-result-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate frozen result
        run: |
          python -m py_compile analysis/validate_chapter2_colour_rsds_focal_concordance_result_v1.py
          python analysis/validate_chapter2_colour_rsds_focal_concordance_result_v1.py
