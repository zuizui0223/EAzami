name: Run Chapter 2 exploratory trait-environment topology gate v1

on:
  pull_request:
    paths:
      - "analysis/run_chapter2_exploratory_trait_environment_topology_gate_v1.py"
      - "data/evidence/chapter2_exploratory_topology_mapping_v1.json"
      - ".github/workflows/run-chapter2-exploratory-trait-environment-topology-gate-v1.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy biopython
          python -m py_compile analysis/run_chapter2_exploratory_trait_environment_topology_gate_v1.py
      - name: Recover frozen common9 result and Japan38 tree bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ch2_topology/common9 /tmp/ch2_topology/trees /tmp/ch2_topology/out
          curl -L --fail-with-body \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9788634414/zip \
            -o /tmp/ch2_topology/common9.zip
          unzip -q /tmp/ch2_topology/common9.zip -d /tmp/ch2_topology/common9
          curl -L --fail-with-body \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9590650447/zip \
            -o /tmp/ch2_topology/trees.zip
          unzip -q /tmp/ch2_topology/trees.zip -d /tmp/ch2_topology/trees
          test -s /tmp/ch2_topology/common9/out/chapter2_exploratory_trait_environment_atlas_common9_v1.json
          test -s /tmp/ch2_topology/common9/out/chapter2_exploratory_common9_taxon_medians_v1.csv
          test -s /tmp/ch2_topology/trees/tree_result/japan38_comp1061.treefile
          test -s /tmp/ch2_topology/trees/tree_result/japan38_comp1061.ufboot
      - name: Run all-row ML plus UFBoot topology gate
        run: |
          set -euo pipefail
          python analysis/run_chapter2_exploratory_trait_environment_topology_gate_v1.py \
            --atlas-json /tmp/ch2_topology/common9/out/chapter2_exploratory_trait_environment_atlas_common9_v1.json \
            --taxon-medians /tmp/ch2_topology/common9/out/chapter2_exploratory_common9_taxon_medians_v1.csv \
            --mapping data/evidence/chapter2_exploratory_topology_mapping_v1.json \
            --ml-tree /tmp/ch2_topology/trees/tree_result/japan38_comp1061.treefile \
            --ufboot /tmp/ch2_topology/trees/tree_result/japan38_comp1061.ufboot \
            --out-json /tmp/ch2_topology/out/chapter2_exploratory_trait_environment_topology_gate_v1.json \
            --out-csv /tmp/ch2_topology/out/chapter2_exploratory_trait_environment_topology_gate_v1.csv \
            | tee /tmp/ch2_topology/out/run_summary.log
      - name: Fail closed on topology contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/ch2_topology/out/chapter2_exploratory_trait_environment_topology_gate_v1.json').read_text())
          assert x['n_rows']==63, x['n_rows']
          assert x['n_exact_tree_taxa']==7, x['n_exact_tree_taxa']
          assert x['ufboot_trees']==1000, x['ufboot_trees']
          assert x['ml_exact_permutations_per_row']==5040
          assert 'Cirsium japonicum' in x['excluded_from_tree_gate']
          assert all(r['exact_tree_n_taxa']==7 for r in x['rows'])
          assert all(0 <= r['ufboot1000_same_sign_fraction_vs_ml'] <= 1 for r in x['rows'])
          assert all('ml_bh_q_63' in r for r in x['rows'])
          print(json.dumps(x['summary'],indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chapter2-exploratory-trait-environment-topology-gate-${{ github.run_id }}
          path: /tmp/ch2_topology/out/
          if-no-files-found: error
          retention-days: 90
