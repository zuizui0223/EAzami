name: Build Chapter 2 JEB V10 new figures

on:
  pull_request:
    paths:
      - "analysis/make_chapter2_jeb_figures_v10_new.py"
      - ".github/workflows/build-chapter2-jeb-v10-new-figures.yml"
  workflow_dispatch:

concurrency:
  group: build-chapter2-jeb-v10-new-figures-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install matplotlib
          python -m py_compile analysis/make_chapter2_jeb_figures_v10_new.py
          mkdir -p /tmp/v10
          python analysis/make_chapter2_jeb_figures_v10_new.py --out /tmp/v10
          test -s /tmp/v10/figure3_v10_functional_interfaces.png
          test -s /tmp/v10/figure4_v10_orientation_transition_regime.png
          test -s /tmp/v10/figure5_v10_origin_trigger_falsification.png
      - uses: actions/upload-artifact@v4
        with:
          name: chapter2-jeb-v10-new-figures
          path: /tmp/v10/
          if-no-files-found: error
