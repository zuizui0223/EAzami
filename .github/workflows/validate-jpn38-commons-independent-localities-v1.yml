name: Validate JPN38 Commons independent locality audit v1

on:
  pull_request:
    paths:
      - "analysis/audit_jpn38_commons_independent_localities_v1.py"
      - "tests/test_jpn38_commons_independent_localities_v1.py"
      - "data/evidence/jpn38_commons_independent_locality_audit_v1.json"
      - "data/evidence/fdt_multitrait_execution_readiness_v6.json"
      - ".github/workflows/validate-jpn38-commons-independent-localities-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-jpn38-commons-locality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and unit test
        run: |
          python -m py_compile analysis/audit_jpn38_commons_independent_localities_v1.py
          python -m unittest tests/test_jpn38_commons_independent_localities_v1.py -v
      - name: Audit live Commons category metadata
        run: |
          set -euo pipefail
          mkdir -p result
          python analysis/audit_jpn38_commons_independent_localities_v1.py \
            --csv-output result/jpn38_commons_independent_locality_audit_v1.csv \
            --json-output result/jpn38_commons_independent_locality_audit_v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('result/jpn38_commons_independent_locality_audit_v1.json').read_text())
          assert x['files_total']==8
          assert x['open_license_files']==8
          assert x['explicit_japan_locality_files']==3
          assert x['known_fukushima_aizu_files']==3
          assert x['other_explicit_japan_files']==0
          assert x['independent_japan_locality_candidates']==0
          assert x['explicit_korea_files']==1
          assert x['explicit_korea_titles']==['File:Cirsium pendulum.JPG']
          assert x['location_unresolved_files']==4
          assert set(x['location_unresolved_titles'])=={
            'File:Cirsium pendulum 2.JPG','File:Cirsium pendulum 3.JPG',
            'File:Cirsium pendulum 4.JPG','File:Cirsium pendulum 5.JPG'
          }
          assert x['dalgial_2008_09_15_files']==5

          f=json.loads(Path('data/evidence/jpn38_commons_independent_locality_audit_v1.json').read_text())
          for key in [
            'files_total','open_license_files','explicit_japan_locality_files',
            'known_fukushima_aizu_files','other_explicit_japan_files',
            'explicit_korea_files','location_unresolved_files',
            'independent_japan_locality_candidates'
          ]:
              assert f[key]==x[key], (key,f[key],x[key])

          r=json.loads(Path('data/evidence/fdt_multitrait_execution_readiness_v6.json').read_text())
          c=r['colour']['jpn38_commons_exhaustion']
          assert c['commons_files_total']==x['files_total']
          assert c['open_license_files']==x['open_license_files']
          assert c['known_fukushima_aizu_files']==x['known_fukushima_aizu_files']
          assert c['other_explicit_japan_files']==x['other_explicit_japan_files']
          assert c['independent_japan_locality_candidates']==0
          assert c['status']=='commons_source_exhausted_for_independent_japan_locality'
          print(json.dumps(x,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jpn38-commons-independent-locality-audit-${{ github.run_id }}
          path: |
            result/jpn38_commons_independent_locality_audit_v1.csv
            result/jpn38_commons_independent_locality_audit_v1.json
          if-no-files-found: error
          retention-days: 90
