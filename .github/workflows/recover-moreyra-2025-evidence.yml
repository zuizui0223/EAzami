name: Recover Moreyra 2025 supplement and public tips

on:
  pull_request:
    paths:
      - "analysis/recover_moreyra2025_evidence.py"
      - "analysis/recover_ncbi_project_runs.py"
      - "tests/test_recover_moreyra2025_evidence.py"
      - "tests/test_recover_ncbi_project_runs.py"
      - "data/evidence/moreyra2025_east_asia_name_map_*.csv"
      - "data/evidence/focal_taxa_prjna957074.txt"
      - "data/evidence/published_phylogeny_artifact_manifest_*.csv"
      - ".github/workflows/recover-moreyra-2025-evidence.yml"
  workflow_dispatch:
    inputs:
      enrich_biosample:
        description: Fetch BioSample locality and collection fields
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  recover-moreyra-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile and run offline tests
        run: |
          python -m py_compile \
            analysis/recover_ncbi_project_runs.py \
            analysis/recover_moreyra2025_evidence.py
          python -m unittest \
            tests/test_recover_ncbi_project_runs.py \
            tests/test_recover_moreyra2025_evidence.py \
            -v

      - name: Recover PRJNA957074 public run metadata
        env:
          ENRICH_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.enrich_biosample || 'true' }}
        run: |
          mkdir -p /tmp/moreyra2025/ncbi
          ENRICH_FLAG=""
          if [ "$ENRICH_INPUT" = "true" ]; then
            ENRICH_FLAG="--enrich-biosample"
          fi
          python analysis/recover_ncbi_project_runs.py \
            --bioproject PRJNA957074 \
            --focal-taxa data/evidence/focal_taxa_prjna957074.txt \
            --outdir /tmp/moreyra2025/ncbi \
            $ENRICH_FLAG

      - name: Download supplement, extract Table S1 and reconcile East Asian names
        run: |
          python analysis/recover_moreyra2025_evidence.py \
            --supplement-url "https://ars.els-cdn.com/content/image/1-s2.0-S1055790325000028-mmc1.docx" \
            --runinfo /tmp/moreyra2025/ncbi/PRJNA957074_runinfo.csv \
            --name-map data/evidence/moreyra2025_east_asia_name_map_2026-08-11.csv \
            --outdir /tmp/moreyra2025/processed \
            --force

      - name: Summarize recovery
        run: |
          python - <<'PY'
          import csv
          import json
          from collections import Counter
          from pathlib import Path

          summary = json.loads(
              Path("/tmp/moreyra2025/processed/recovery_summary.json").read_text(encoding="utf-8")
          )
          print(json.dumps(summary, indent=2, ensure_ascii=False))

          audit_path = Path("/tmp/moreyra2025/processed/east_asia_focal_taxon_audit.csv")
          with audit_path.open(encoding="utf-8", newline="") as handle:
              audit = list(csv.DictReader(handle))
          states = Counter(row["combined_evidence_state"] for row in audit)
          for state, count in sorted(states.items()):
              print(f"{state}={count}")
          for row in audit:
              if row["priority_class"].startswith("A"):
                  print(
                      f"FOCAL {row['accepted_taxon']} :: {row['combined_evidence_state']} :: "
                      f"supplement_rows={row['supplement_row_count']} runs={row['ncbi_runs']}"
                  )
          PY

      - name: Upload Moreyra evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: moreyra-2025-evidence-${{ github.run_id }}
          path: /tmp/moreyra2025
          if-no-files-found: error
          retention-days: 90
