name: Run FDT4 orientation phylogeny saturation v1

on:
  pull_request:
    paths:
      - "analysis/run_fdt4_orientation_phylogeny_saturation_v1.py"
      - "data/evidence/chang2026_orientation_overlap_pruned_topology_v1.nwk"
      - ".github/workflows/run-fdt4-orientation-phylogeny-saturation-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  saturation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: comp1061-saff-root-primary-tree-32575064385
          path: inputs/full20_primary
          github-token: ${{ github.token }}
          repository: zuizui0223/EAzami
          run-id: 32575064385

      - uses: actions/download-artifact@v4
        with:
          name: comp1061-topology-concordance-32614242600
          path: inputs/concordance
          github-token: ${{ github.token }}
          repository: zuizui0223/EAzami
          run-id: 32614242600

      - uses: actions/download-artifact@v4
        with:
          name: comp1061-alt-topology-au-32614839764
          path: inputs/au
          github-token: ${{ github.token }}
          repository: zuizui0223/EAzami
          run-id: 32614839764

      - uses: actions/download-artifact@v4
        with:
          name: fdt4-japan-orientation-niche-v1
          path: inputs/japan_occ
          github-token: ${{ github.token }}
          repository: zuizui0223/EAzami
          run-id: 32716015605

      - uses: actions/download-artifact@v4
        with:
          name: fdt4-taiwan-orientation-niche-v1
          path: inputs/taiwan_occ
          github-token: ${{ github.token }}
          repository: zuizui0223/EAzami
          run-id: 33225237163

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: topology-saturation
          create-args: >-
            python=3.12
            iqtree=2.4.0
            openjdk=17
            numpy
            pandas
            scipy
            biopython
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          init-shell: none
          generate-run-shell: true
          cache-environment: true
          cache-downloads: true
          post-cleanup: all

      - name: Validate public input contracts
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python -m py_compile analysis/run_fdt4_orientation_phylogeny_saturation_v1.py
          test -s inputs/full20_primary/tree/concat/concat.fasta
          test -s inputs/concordance/sensitivity/loci.treefile
          test $(wc -l < inputs/concordance/sensitivity/loci.treefile) -eq 153
          test -s inputs/concordance/sensitivity/scf.treefile
          test -s inputs/au/au.trees
          test $(wc -l < inputs/au/au.trees) -eq 9
          test -s inputs/japan_occ/focal_occurrences_environment_complete.csv
          test -s inputs/taiwan_occ/focal_occurrences_environment_complete.csv
          test -s inputs/taiwan_occ/multisource_sensitivity/tbn_native_additions_environment_complete.csv
          test -s inputs/taiwan_occ/multisource_sensitivity/tbn_non_gbif_additions_environment_complete.csv

      - name: Reconstruct full20 concatenated 1000-UFBoot ensemble
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p output/full20_bootstrap
          IQTREE_BIN="$(command -v iqtree2)"
          "$IQTREE_BIN" \
            -s inputs/full20_primary/tree/concat/concat.fasta \
            -m MFP \
            -B 1000 \
            --alrt 1000 \
            -wbt \
            -T AUTO \
            -seed 20260829 \
            -o OUTGROUP_saff \
            --prefix output/full20_bootstrap/full20_comp1061
          test -s output/full20_bootstrap/full20_comp1061.treefile
          test -s output/full20_bootstrap/full20_comp1061.ufboot
          test $(wc -l < output/full20_bootstrap/full20_comp1061.ufboot) -eq 1000

      - name: Validate regenerated ML topology and raw UFBoot representation
        shell: micromamba-shell {0}
        run: |
          python - <<'PY'
          from Bio import Phylo
          from pathlib import Path

          def splits(path):
              tr=Phylo.read(path,'newick')
              taxa={x.name for x in tr.get_terminals()}
              out=set()
              for cl in tr.get_nonterminals():
                  s=frozenset(x.name for x in cl.get_terminals())
                  if len(s)<=1 or len(s)>=len(taxa)-1:
                      continue
                  c=frozenset(taxa-s)
                  a,b=tuple(sorted(s)),tuple(sorted(c))
                  out.add(min(a,b))
              return out

          old=splits('inputs/concordance/sensitivity/scf.treefile')
          new=splits('output/full20_bootstrap/full20_comp1061.treefile')
          assert old == new, f'regenerated ML topology differs: old-only={old-new}, new-only={new-old}'

          lines=[x.strip() for x in Path('output/full20_bootstrap/full20_comp1061.ufboot').read_text().splitlines() if x.strip()]
          assert len(lines)==1000
          assert all(':' not in x for x in lines), 'raw .ufboot unexpectedly contains branch lengths; revisit representation contract'
          print('Regenerated ML split set matches accepted full20 primary; raw UFBoot is topology-only')
          PY

      - name: Build ASTRAL-III species tree from all 153 public locus trees
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          mkdir -p tools output/astral153
          curl -L --fail --retry 3 \
            -o tools/Astral.5.7.8.zip \
            https://raw.githubusercontent.com/smirarab/ASTRAL/068a4b2497f61c866c4727bfbfd78b4361ba27c8/Astral.5.7.8.zip
          sha256sum tools/Astral.5.7.8.zip | tee output/astral153/astral_5_7_8_zip_sha256.txt
          unzip -q tools/Astral.5.7.8.zip -d tools/astral
          ASTRAL_JAR=$(find tools/astral -name 'astral.5.7.8.jar' -print -quit)
          test -n "$ASTRAL_JAR"
          GENE_TREES=$(realpath inputs/concordance/sensitivity/loci.treefile)
          OUT_TREE=$(realpath output/astral153)/astral153.tre
          OUT_LOG=$(realpath output/astral153)/astral153.log
          ASTRAL_DIR=$(dirname "$ASTRAL_JAR")
          ASTRAL_NAME=$(basename "$ASTRAL_JAR")
          (
            cd "$ASTRAL_DIR"
            java -Xmx4G -jar "$ASTRAL_NAME" -i "$GENE_TREES" -o "$OUT_TREE" 2>"$OUT_LOG"
          )
          test -s output/astral153/astral153.tre
          grep -q 'Cirsium_brevicaule' output/astral153/astral153.tre
          grep -q 'OUTGROUP_saff' output/astral153/astral153.tre

      - name: Run candidate, UFBoot, locus-tree and coalescent/external topology saturation
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python analysis/run_fdt4_orientation_phylogeny_saturation_v1.py \
            --japan-occ inputs/japan_occ/focal_occurrences_environment_complete.csv \
            --taiwan-gbif inputs/taiwan_occ/focal_occurrences_environment_complete.csv \
            --tbn-native inputs/taiwan_occ/multisource_sensitivity/tbn_native_additions_environment_complete.csv \
            --tbn-broad inputs/taiwan_occ/multisource_sensitivity/tbn_non_gbif_additions_environment_complete.csv \
            --orientation data/evidence/orientation_comp1061_20tip_source_crosswalk_v1.csv \
            --au-trees inputs/au/au.trees \
            --accepted-count 6 \
            --ufboot-trees output/full20_bootstrap/full20_comp1061.ufboot \
            --gene-trees inputs/concordance/sensitivity/loci.treefile \
            --extra-tree astral153_from_public_loci output/astral153/astral153.tre \
            --extra-tree chang2026_astral_pruned_topology data/evidence/chang2026_orientation_overlap_pruned_topology_v1.nwk \
            --min-n 10 \
            --out-dir output/saturation

      - name: Freeze concordance context
        shell: micromamba-shell {0}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          g=pd.read_csv('inputs/concordance/sensitivity/gcf.cf.stat', sep='\t', comment='#')
          s=pd.read_csv('inputs/concordance/sensitivity/scf.cf.stat', sep='\t', comment='#')
          gcol=next(c for c in g.columns if c.lower()=='gcf')
          scol=next(c for c in s.columns if c.lower()=='scf')
          payload={
            'contract_version':'full20_comp1061_concordance_context_v1',
            'gene_trees':153,
            'internal_branches_gcf':int(len(g)),
            'gcf_median':float(g[gcol].median()),
            'gcf_mean':float(g[gcol].mean()),
            'gcf_min':float(g[gcol].min()),
            'gcf_max':float(g[gcol].max()),
            'internal_branches_scf':int(len(s)),
            'scf_median':float(s[scol].median()),
            'scf_mean':float(s[scol].mean()),
            'scf_min':float(s[scol].min()),
            'scf_max':float(s[scol].max()),
            'interpretation':'Low concordance demonstrates strong public gene-tree discordance; it does not make gene trees independent ecological replicates.'
          }
          Path('output/saturation/full20_comp1061_concordance_context_v1.json').write_text(json.dumps(payload,indent=2)+'\n')
          print(json.dumps(payload,indent=2))
          PY

      - name: Fail closed on topology saturation structure
        shell: micromamba-shell {0}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('output/saturation/fdt4_orientation_phylogeny_saturation_v1.json').read_text())
          assert p['ensemble_sizes']['au_candidates']==9
          assert p['ensemble_sizes']['au_nonrejected']==6
          assert p['ensemble_sizes']['concatenated_ufboot']==1000
          assert p['ensemble_sizes']['public_locus_trees']==153
          assert set(p['ensemble_sizes']['extra_topologies']) == {'astral153_from_public_loci','chang2026_astral_pruned_topology'}
          assert p['panels']['gbif']['n_taxa']==9
          assert p['panels']['native_tbn']['n_taxa']==11
          assert p['panels']['broad_non_gbif_tbn']['n_taxa']==11
          assert 'branch' not in p['layers']['concatenated_ufboot']['gbif']
          assert p['ufboot_branch_length_status'].startswith('absent_in_raw_iqtree_ufboot')
          for panel in ('gbif','native_tbn','broad_non_gbif_tbn'):
              assert p['locus_tree_coverage'][panel]['complete_panel_gene_trees'] >= 100
          print('FDT4 phylogeny saturation structural contract PASS')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fdt4-orientation-phylogeny-saturation-v1
          path: output
          if-no-files-found: error
          retention-days: 90
