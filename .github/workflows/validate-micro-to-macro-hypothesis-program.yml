name: Validate micro-to-macro hypothesis program

on:
  pull_request:
    paths:
      - "analysis/summarize_micro_to_macro_evidence.py"
      - "data/evidence/micro_to_macro_evidence_matrix_v1.csv"
      - "data/evidence/micro_to_macro_evidence_synthesis_v1.json"
      - "data/evidence/micro_to_macro_evidence_synthesis_v1.validation.json"
      - "data/evidence/cirsium_flower_colour_atlas_v0_2.csv"
      - "data/evidence/japan_cirsium_origin_meta_analysis_v1.json"
      - "analysis/chang2026_takaoense_topology_robustness_summary.json"
      - "docs/ideas/MICRO_TO_MACRO_HYPOTHESIS_PROGRAM_2026-08-15.md"
      - ".github/workflows/validate-micro-to-macro-hypothesis-program.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build cross-scale evidence synthesis
        run: |
          python -m py_compile analysis/summarize_micro_to_macro_evidence.py
          python analysis/summarize_micro_to_macro_evidence.py \
            --output /tmp/micro_to_macro_evidence_synthesis_v1.json
      - name: Assert evidence-class and hypothesis boundaries
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/micro_to_macro_evidence_synthesis_v1.json'))
          assert d['contract_version']=='micro_to_macro_evidence_synthesis_v1'
          cc=d['evidence_matrix']['class_counts']
          assert cc['published_conclusion'] >= 4
          assert cc['EAzami_reanalysis'] >= 5
          assert d['japan_origin_meta']['dominant_radiation_species']==36
          assert d['japan_origin_meta']['japanese_species_sampled']==38
          assert d['japan_origin_meta']['lineare_analysis_support']==[3,3]
          assert d['japan_origin_meta']['lineare_independent_group_support']==[2,2]
          assert d['takaoense_topology_meta']['rooted_topologies']==945
          assert d['takaoense_topology_meta']['regain_required']==270
          assert d['takaoense_topology_meta']['published_history']=='1L+1R'
          assert d['macro_trait_atlas']['takaoense_sample_state_counts'].get('W')==3
          assert d['macro_trait_atlas']['takaoense_sample_state_counts'].get('C')==3
          assert len(d['EAzami_discovered_problems'])==5
          assert set(d['EAzami_hypotheses'])=={'HMM1','HMM2','HMM3','HMM4','HMM5'}
          for h in d['EAzami_hypotheses'].values():
              assert h['prediction'] and h['falsifier'] and h['derived_from']
          assert 'future-work' in d['claim_boundary'] or 'future work' in d['claim_boundary']
          print(json.dumps(d,indent=2,ensure_ascii=False))
          PY
      - name: Require regenerated result to equal frozen evidence
        run: |
          cmp /tmp/micro_to_macro_evidence_synthesis_v1.json \
            data/evidence/micro_to_macro_evidence_synthesis_v1.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          result=Path('data/evidence/micro_to_macro_evidence_synthesis_v1.json')
          manifest=json.loads(Path('data/evidence/micro_to_macro_evidence_synthesis_v1.validation.json').read_text())
          digest=hashlib.sha256(result.read_bytes()).hexdigest()
          assert digest == manifest['result_sha256'], (digest, manifest['result_sha256'])
          assert manifest['validation_state'] == 'success'
          print('frozen_result_sha256='+digest)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: micro-to-macro-evidence-synthesis-${{ github.run_id }}
          path: /tmp/micro_to_macro_evidence_synthesis_v1.json
          if-no-files-found: error
          retention-days: 90
