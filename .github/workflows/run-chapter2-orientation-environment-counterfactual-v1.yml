name: Run Chapter 2 orientation-environment counterfactual v1

on:
  pull_request:
    paths:
      - "analysis/run_chapter2_orientation_environment_counterfactual_v1.py"
      - "data/evidence/chapter2_orientation_environment_counterfactual_contract_v1.json"
      - "data/evidence/orientation_comp1061_20tip_source_crosswalk_v1.csv"
      - "data/evidence/chapter2_ecological_explanatory_reach_v1.json"
      - "docs/chapter2/ORIENTATION_ENVIRONMENT_COUNTERFACTUAL_V1.md"
      - ".github/workflows/run-chapter2-orientation-environment-counterfactual-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen analysis dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy pandas scipy biopython
          python -m pip check
      - name: Verify frozen artifact identities
        run: |
          set -euo pipefail
          test "$(gh api repos/zuizui0223/EAzami/actions/artifacts/9516784077 --jq .digest)" = "sha256:cb5717c90cbc769398f9ffce38787704a02e34253c1ff16cf8f368ba55aeda96"
          test "$(gh api repos/zuizui0223/EAzami/actions/artifacts/9520157997 --jq .digest)" = "sha256:819936ceeb6008f356c580622fb72972617700402afaa3d3ab125bff2e6d9106"
          test "$(gh api repos/zuizui0223/EAzami/actions/artifacts/9486643703 --jq .digest)" = "sha256:d90f30e4fcc3a2a0296a7d0cfa13d0f3ecc008b36d28298ac9782a001e6f63c5"
      - name: Recover frozen ecological and topology artifacts
        run: |
          mkdir -p recovered/japan recovered/taiwan recovered/au
          gh run download 32716015605 --name fdt4-japan-orientation-niche-v1 --dir recovered/japan
          gh run download 32725842871 --name fdt4-taiwan-orientation-niche-v1 --dir recovered/taiwan
          gh run download 32614839764 --name comp1061-alt-topology-au-32614839764 --dir recovered/au
      - name: Compile analysis
        run: python -m py_compile analysis/run_chapter2_orientation_environment_counterfactual_v1.py
      - name: Run exhaustive counterfactual test
        run: |
          mkdir -p .tmp/chapter2-orientation-counterfactual
          python analysis/run_chapter2_orientation_environment_counterfactual_v1.py \
            --contract data/evidence/chapter2_orientation_environment_counterfactual_contract_v1.json \
            --occurrences recovered/japan/focal_occurrences_environment_complete.csv recovered/taiwan/focal_occurrences_environment_complete.csv \
            --orientation data/evidence/orientation_comp1061_20tip_source_crosswalk_v1.csv \
            --au-trees recovered/au/au.trees \
            --frozen-ecology data/evidence/chapter2_ecological_explanatory_reach_v1.json \
            --out-json .tmp/chapter2-orientation-counterfactual/result.json \
            --out-csv .tmp/chapter2-orientation-counterfactual/assignments.csv
      - name: Validate result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('.tmp/chapter2-orientation-counterfactual/result.json').read_text())
          assert x['version']=='chapter2_orientation_environment_counterfactual_result_v1'
          assert x['panel']['n_taxa']==9
          assert x['panel']['n_assignments']==126
          assert x['frozen_result_reproduction']['status']=='exact_within_1e-10'
          assert x['classification'] in {
              'counterfactual_correspondence_strongly_strengthened',
              'counterfactual_correspondence_strengthened_but_history_overlap_remains',
              'counterfactual_correspondence_not_strengthened_beyond_history',
          }
          for axis in ['chelsa_bio15','chelsa_bio01']:
              assert set(x['axis_results'][axis]['pools']) == {
                  'all_126_count_preserving','recurrence_profile_matched','history_nearest_quartile'
              }
          print(json.dumps(x, indent=2))
          PY
      - name: Upload frozen counterfactual outputs
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-orientation-environment-counterfactual-v1
          path: .tmp/chapter2-orientation-counterfactual/
          if-no-files-found: error
