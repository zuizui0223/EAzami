name: Validate colour-rate Compositae1061 HPC bundle
on:
  pull_request:
    paths:
      - "analysis/build_colour_rate_comp1061_hpc_bundle.py"
      - "analysis/build_colour_rate_comp1061_hpc_bundle_v0_2.py"
      - "analysis/augment_colour_rate_comp1061_tree_stages.py"
      - "analysis/prepare_colour_rate_comp1061_tree_inputs.py"
      - "analysis/concatenate_colour_rate_comp1061_alignments.py"
      - "analysis/validate_colour_atlas_branch_length_tree.py"
      - "tests/test_build_colour_rate_comp1061_hpc_bundle.py"
      - "tests/test_build_colour_rate_comp1061_hpc_bundle_v0_2.py"
      - "tests/test_augment_colour_rate_comp1061_tree_stages.py"
      - "tests/test_prepare_colour_rate_comp1061_tree_inputs.py"
      - "tests/test_concatenate_colour_rate_comp1061_alignments.py"
      - "tests/test_validate_colour_atlas_branch_length_tree.py"
      - "data/evidence/colour_rate_comp1061_bridge_artifact_contract_v1.json"
      - "data/evidence/moreyra_public_locus_set_manifest_v1.json"
      - ".github/workflows/validate-colour-rate-comp1061-hpc-bundle.yml"
  workflow_dispatch:
concurrency:
  group: validate-colour-rate-comp1061-hpc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Build and validate bundle through tree-acceptance stage
        run: |
          python -m py_compile \
            analysis/build_colour_rate_comp1061_hpc_bundle.py \
            analysis/build_colour_rate_comp1061_hpc_bundle_v0_2.py \
            analysis/augment_colour_rate_comp1061_tree_stages.py \
            analysis/prepare_colour_rate_comp1061_tree_inputs.py \
            analysis/concatenate_colour_rate_comp1061_alignments.py \
            analysis/validate_colour_atlas_branch_length_tree.py
          python -m unittest \
            tests/test_build_colour_rate_comp1061_hpc_bundle.py \
            tests/test_build_colour_rate_comp1061_hpc_bundle_v0_2.py \
            tests/test_augment_colour_rate_comp1061_tree_stages.py \
            tests/test_prepare_colour_rate_comp1061_tree_inputs.py \
            tests/test_concatenate_colour_rate_comp1061_alignments.py \
            tests/test_validate_colour_atlas_branch_length_tree.py \
            -v
          python analysis/build_colour_rate_comp1061_hpc_bundle_v0_2.py \
            --bridge-contract data/evidence/colour_rate_comp1061_bridge_artifact_contract_v1.json \
            --locus-manifest data/evidence/moreyra_public_locus_set_manifest_v1.json \
            --outdir /tmp/colour_rate_hpc_bundle
          python analysis/augment_colour_rate_comp1061_tree_stages.py \
            --bundle-dir /tmp/colour_rate_hpc_bundle
          for f in /tmp/colour_rate_hpc_bundle/*.sh; do bash -n "$f"; done
          python - <<'PY'
          import csv,json
          from pathlib import Path
          r=Path('/tmp/colour_rate_hpc_bundle')
          rows=list(csv.DictReader((r/'primary_runs.csv').open()))
          x=json.loads((r/'execution_manifest.json').read_text())
          prep=(r/'00_prepare_inputs_slurm.sh').read_text()
          accept=(r/'08_accept_tree_slurm.sh').read_text()
          submit=(r/'submit_tree_chain.sh').read_text()
          assert len(rows)==20 and len({z['run'] for z in rows})==20
          assert sum(z['binary_colour_code']=='W' for z in rows)==3
          assert x['bundle_version']=='colour_rate_comp1061_hpc_bundle_v0_3_tree_stage'
          assert x['current_stage_end']=='tree_acceptance_scripts_prepared'
          assert x['branch_length_tree_completed'] is False and x['rate_fit_execution_allowed'] is False
          assert x['tree_stage']['frozen_locus_universe']==241
          assert x['tree_stage']['current_occupancy_gate']==0.8
          assert x['tree_stage']['minimum_eligible_loci_to_launch']==100
          assert 'export REPO_ROOT RESULT_ROOT ENV_PREFIX' in prep
          assert 'summarize_moreyra_locus_filter.py' in prep
          assert '--input "$RESULT_ROOT/inputs/moreyra_author_repo/paralog_locus_filter_reconstruction.csv"' in prep
          assert '--locus-filter' not in prep
          assert 'validate_colour_atlas_branch_length_tree.py' in accept
          assert 'tree_provenance.json' in accept
          assert 'afterok:$gene:$concat' in submit
          print('bundle_contract=v0.3_tree_stage_valid')
          print('branch_length_tree_completed=false')
          print('rate_fit_execution_allowed=false')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: colour-rate-comp1061-hpc-bundle-${{ github.run_id }}
          path: /tmp/colour_rate_hpc_bundle/
          if-no-files-found: error
          retention-days: 90
