name: Review real NA nuclear source six multi-trait climate associations with taxon LOO

on:
  pull_request:
    paths:
      - "analysis/validate_NA62_nuclear_9trait_env_associations_LOO_v1.py"
      - ".github/workflows/real-NA62-nine-trait-environment-LOO-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nuclear-source-phylogenetic-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original NA molecular statistics dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy scipy biopython
          python -m py_compile analysis/validate_NA62_nuclear_9trait_env_associations_LOO_v1.py
      - name: Refit original six key associations across every leave-one-taxon-out phylogenetic NA nuclear tree and condition on climate
        run: |
          python analysis/validate_NA62_nuclear_9trait_env_associations_LOO_v1.py \
            --assets .tmp/original_na_tree_nine_and_environment_2023 \
            --outdir .tmp/source-NA62-all-six-original-phylotrait-LOO
      - name: Verify sensitivity retains original complete 62-tip source and never promotes singleton colour classes to independent evolution
        run: |
          python - <<'PY'
          import json,csv
          from pathlib import Path
          d=Path(".tmp/source-NA62-all-six-original-phylotrait-LOO")
          report=json.loads((d/"NA62_nuclear_6candidate_morphology_environment_leaveone_report.json").read_text())
          assert report["n_original_nuclear_ingroup_species"]==62
          assert len(report["associations"])==6
          assert report["no_global_Moreyra_294tip_nuclear_tree"] is True
          with (d/"NA62_original_nuclear_selected_morphology_env_leave1taxon.csv").open() as f:
            rows=list(csv.DictReader(f))
          assert len(rows)==372 and len({(r["morphology"],r["environment"]) for r in rows})==6
          assert any(r["rarest_source_category_n"]==1 for r in report["associations"])
          for row in report["associations"]:
            assert row["n_individually_dropped_source_taxa"]==62
          print("EMPIRICAL SOURCE NA62 FULL LEAVE-ONE-OUT PHYLOGENETIC TRAIT × ENVIRONMENT CHECK PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NA62-real-nuclear-six-morph-environment-LOO-and-partial-v1
          path: .tmp/source-NA62-all-six-original-phylotrait-LOO/
          retention-days: 90
          if-no-files-found: error
