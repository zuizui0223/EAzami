name: Materialize Chapter 2 final integrated evidence v3 fast

on:
  pull_request:
    paths:
      - "analysis/build_chapter2_final_integrated_evidence_v3.py"
      - "data/evidence/chapter2_orientation_origin_envelope_result_v1.json"
      - ".github/workflows/materialize-chapter2-final-integrated-evidence-v3-fast.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ch2-final-integrated-v3-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate audited orientation summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('data/evidence/chapter2_orientation_origin_envelope_result_v1.json').read_text())
          assert x['source_workflow_run_id']==33403515236
          assert x['source_artifact_id']==9762830184
          assert x['source_artifact_sha256']=='65ff0756f9682efce2640ea7269d7e43c632b87a16714e71e804d81ca4c71570'
          assert x['chronology']['n_valid_age_pairs']==94
          assert x['cross_scenario_summary']['n_region_by_chronology_scenarios']==376
          assert x['cross_scenario_summary']['classification']=='origin_trajectory_unresolved_under_public_chronology_and_paleolocation_uncertainty'
          assert set(x['region_summaries'])=={'taiwan','ryukyu_corridor','southern_japan','east_asia_core_corridor'}
          print(json.dumps(x['cross_scenario_summary'], indent=2))
          PY
      - name: Render orientation summary and build V3 integration
        run: |
          set -euo pipefail
          python -m py_compile analysis/build_chapter2_final_integrated_evidence_v3.py
          python - <<'PY'
          import csv,json
          from pathlib import Path
          x=json.loads(Path('data/evidence/chapter2_orientation_origin_envelope_result_v1.json').read_text())
          rows=[]
          for region,s in x['region_summaries'].items():
              rows.append({'region':region,'n_grid_cells':s['n_grid_cells'],'n_chronology_scenarios':s['n_chronology_scenarios'],'cosine_q05':s['cosine_similarity']['q05'],'cosine_median':s['cosine_similarity']['median'],'cosine_q95':s['cosine_similarity']['q95'],'fraction_cosine_positive':s['fraction_cosine_positive'],'null_percentile_median':s['cosine_null_percentile']['median'],'fraction_null_ge_0_95':s['fraction_null_percentile_ge_0_95'],'fraction_null_le_0_05':s['fraction_null_percentile_le_0_05']})
          with Path('data/evidence/chapter2_orientation_origin_envelope_region_summary_v1.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          c=x['cross_scenario_summary']
          Path('docs/chapter2/ORIENTATION_ORIGIN_ENVELOPE_RESULT_V1.md').write_text(f'''# Orientation origin chronology × paleolocation envelope v1\n\nAudited public-data source: workflow `33403515236`, artifact `9762830184`, SHA256 `65ff0756f9682efce2640ea7269d7e43c632b87a16714e71e804d81ca4c71570`. The successful source run used checksum-locked PALEO-PGEM BIO1/BIO4/BIO12/BIO15.\n\n## Decision\n\n`{c['classification']}`\n\n- valid chronology pairs: {x['chronology']['n_valid_age_pairs']}\n- region × chronology scenarios: {c['n_region_by_chronology_scenarios']}\n- cosine q05 / median / q95: {c['cosine_similarity']['q05']:.4f} / {c['cosine_similarity']['median']:.4f} / {c['cosine_similarity']['q95']:.4f}\n- cosine-positive fraction: {c['fraction_cosine_positive']:.3f}\n- null-percentile median: {c['cosine_null_percentile']['median']:.4f}\n\nHistorical origin remains unresolved across chronology and paleolocation scenarios. This does not establish selection, adaptation, convergence or an exact transition date. Full 376-scenario rows remain in the immutable source artifact; the repository stores the audited decision summary.\n''',encoding='utf-8')
          PY
          python analysis/build_chapter2_final_integrated_evidence_v3.py \
            --orientation-origin data/evidence/chapter2_orientation_origin_envelope_result_v1.json \
            --out-csv data/evidence/chapter2_final_integrated_evidence_v3.csv \
            --out-json data/evidence/chapter2_final_integrated_evidence_v3.json \
            --out-story docs/chapter2/PUBLIC_DATA_FINAL_CHAPTER2_STORY_AND_ANALYSIS_PLAN_V3.md
      - name: Validate integrated result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          final=json.loads(Path('data/evidence/chapter2_final_integrated_evidence_v3.json').read_text())
          image=json.loads(Path('data/evidence/chapter2_four_taxon_azami_measurement_result_v1.json').read_text())
          rsds=json.loads(Path('data/evidence/chapter2_colour_rsds_focal_concordance_result_v1.json').read_text())
          assert final['n_rows']==7
          assert final['orientation_origin_classification']=='origin_trajectory_unresolved_under_public_chronology_and_paleolocation_uncertainty'
          assert final['colour_public_image_assay_gate'] is True
          assert final['colour_current_rsds_classification']=='partial_current_rsds_chroma_directional_concordance'
          assert final['chapter_model']=='modular_hierarchical_selection_mosaic_with_partial_coordinated_remodelling'
          rows={r['trait_driver']:r for r in final['rows']}
          assert rows['orientation × hydric exposure']['final_class']=='history_resolved_current_hydric_candidate_origin_driver_unresolved'
          assert '1/2' in rows['flower colour × radiative environment']['key_quantitative_result']
          assert 'universal_ST1_persistent_RSDS_driver_weakened' in rows['flower colour × radiative environment']['process_model']
          assert image['repeated_same_direction_across_two_sister_systems']['shape_circularity']=='white_higher'
          assert image['repeated_same_direction_across_two_sister_systems']['shape_solidity']=='white_higher'
          assert image['repeated_same_direction_across_two_sister_systems']['visible_floret_fraction_extended']=='white_lower'
          assert rsds['systems']['ARENICOLA_BREVICAULE_IRUMTIENSE']['observation_level']['azami_direction_concordant'] is True
          assert rsds['systems']['TAIWAN_KAWAKAMII_TATAKAENSE']['observation_level']['azami_direction_concordant'] is False
          assert rows['whole capitulum × common syndrome versus modular mosaic']['final_class']=='partial_module_covariation_universal_synchronized_syndrome_not_supported'
          assert all(r['causal_claim_allowed']=='no' for r in final['rows'])
          story=Path('docs/chapter2/PUBLIC_DATA_FINAL_CHAPTER2_STORY_AND_ANALYSIS_PLAN_V3.md').read_text()
          for phrase in ['hierarchical scale dependence','modular hierarchical selection-mosaic model','Arenicola versus Taiwan colour natural experiment','not complete independence','does **not** establish adaptation']:
              assert phrase in story, phrase
          print(json.dumps({'status':'VALID','chapter_model':final['chapter_model']},indent=2))
          PY
      - name: Commit generated V3 package
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/evidence/chapter2_orientation_origin_envelope_region_summary_v1.csv docs/chapter2/ORIENTATION_ORIGIN_ENVELOPE_RESULT_V1.md data/evidence/chapter2_final_integrated_evidence_v3.csv data/evidence/chapter2_final_integrated_evidence_v3.json docs/chapter2/PUBLIC_DATA_FINAL_CHAPTER2_STORY_AND_ANALYSIS_PLAN_V3.md
          if git diff --cached --quiet; then
            echo 'V3 package unchanged.'
          else
            git commit -m 'Materialize Chapter 2 final integrated evidence v3'
            git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
          fi
