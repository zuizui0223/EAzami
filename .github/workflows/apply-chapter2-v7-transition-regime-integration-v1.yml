name: Apply Chapter 2 V7 transition-regime integration v1

on:
  pull_request:
    paths:
      - "analysis/apply_chapter2_transition_regime_v7_integration_v1.py"
      - "analysis/normalize_chapter2_v7_legacy_guard_phrases_v1.py"
      - "analysis/ensure_chapter2_legacy_route_references_v1.py"
      - "analysis/validate_manuscript_jeb_v7_transition_regime_v2.py"
      - ".github/workflows/apply-chapter2-v7-transition-regime-integration-v1.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-and-validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect existing integration
        id: integration_state
        run: |
          if grep -Fq "## Fixed transition-regime concordance and falsification tests" docs/chapter2/MANUSCRIPT_JEB_V7_WORKING.md; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply deterministic manuscript and figure-map integration
        if: steps.integration_state.outputs.already != 'true'
        run: python analysis/apply_chapter2_transition_regime_v7_integration_v1.py
      - name: Normalize legacy guard wording
        if: steps.integration_state.outputs.already != 'true'
        run: python analysis/normalize_chapter2_v7_legacy_guard_phrases_v1.py
      - name: Preserve superseded audit route references
        run: python analysis/ensure_chapter2_legacy_route_references_v1.py
      - name: Validate legacy V7 contracts
        run: python analysis/validate_manuscript_jeb_v7_working_v1.py
      - name: Validate transition-regime promotion
        run: python analysis/validate_manuscript_jeb_v7_transition_regime_v2.py
      - name: Check patch hygiene
        run: git diff --check
      - name: Commit generated integration when needed
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/chapter2/MANUSCRIPT_JEB_V7_WORKING.md docs/chapter2/JEB_V7_FIGURE_MAP.md docs/chapter2/README.md; then
            echo "Integration and audit routes already present; validators passed; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/chapter2/MANUSCRIPT_JEB_V7_WORKING.md docs/chapter2/JEB_V7_FIGURE_MAP.md docs/chapter2/README.md
          git commit -m "Chapter 2: integrate transition-regime evidence into V7 [skip ci]"
          git push origin "HEAD:${{ github.head_ref }}"
