name: Collect Azami public artifacts v1

on:
  pull_request:
    paths:
      - "analysis/collect_azami_public_artifacts_v1.py"
      - "analysis/audit_chapter2_spacetime_public_data_v1.py"
      - ".github/workflows/collect-azami-public-artifacts-v1.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install recovery dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests pyarrow openpyxl
          python -m pip check

      - name: Inventory and selectively recover public Azami artifacts
        run: |
          set -euo pipefail
          rm -rf output/azami_public_artifacts
          python analysis/collect_azami_public_artifacts_v1.py \
            --repository zuizui0223/azami \
            --out-dir output/azami_public_artifacts \
            --max-total-mb 1200 \
            --max-artifact-mb 300 \
            --min-score 2 \
            --max-artifacts 40

      - name: Audit extracted artifact tables for Chapter 2 variables
        run: |
          set -euo pipefail
          rm -rf output/azami_artifact_spacetime_audit
          python analysis/audit_chapter2_spacetime_public_data_v1.py \
            --azami-root output/azami_public_artifacts/extracted \
            --eazami-root . \
            --out-dir output/azami_artifact_spacetime_audit

      - name: Validate recovery structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          inv=json.loads(Path('output/azami_public_artifacts/azami_public_artifact_inventory_v1.json').read_text())
          aud=json.loads(Path('output/azami_artifact_spacetime_audit/chapter2_spacetime_public_data_audit_v1.json').read_text())
          assert inv['contract_version']=='azami_public_artifact_inventory_v1'
          assert inv['all_artifacts_inventory_count']>=inv['nonexpired_count']
          assert isinstance(inv['selected_artifacts'], list)
          assert aud['contract_version']=='chapter2_spacetime_public_data_audit_v1'
          assert aud['n_table_schemas']>=0
          print(json.dumps({
              'all_artifacts':inv['all_artifacts_inventory_count'],
              'nonexpired':inv['nonexpired_count'],
              'selected':len(inv['selected_artifacts']),
              'extracted_files':inv['extracted_analysis_files'],
              'strict_candidate_counts':{k:len(v) for k,v in aud['candidate_tables'].items()},
          },indent=2))
          PY

      - name: Freeze compact inventory and schema audit on PR branch
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          cp output/azami_public_artifacts/azami_public_artifact_inventory_v1.json \
            data/evidence/azami_public_artifact_inventory_v1.json
          cp output/azami_artifact_spacetime_audit/chapter2_spacetime_public_data_audit_v1.json \
            data/evidence/chapter2_spacetime_public_artifact_audit_v1.json
          cp output/azami_artifact_spacetime_audit/CHAPTER2_SPACETIME_PUBLIC_DATA_AUDIT_V1.md \
            docs/chapter2/CHAPTER2_SPACETIME_PUBLIC_ARTIFACT_AUDIT_V1.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            data/evidence/azami_public_artifact_inventory_v1.json \
            data/evidence/chapter2_spacetime_public_artifact_audit_v1.json \
            docs/chapter2/CHAPTER2_SPACETIME_PUBLIC_ARTIFACT_AUDIT_V1.md
          if ! git diff --cached --quiet; then
            git commit -m "Freeze Azami public-artifact inventory [skip artifact-collect]"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: azami-public-artifacts-and-spacetime-audit-v1
          path: |
            output/azami_public_artifacts/azami_public_artifact_inventory_v1.csv
            output/azami_public_artifacts/azami_public_artifact_inventory_v1.json
            output/azami_public_artifacts/azami_public_artifact_extraction_manifest_v1.csv
            output/azami_artifact_spacetime_audit
          if-no-files-found: error
          retention-days: 90
