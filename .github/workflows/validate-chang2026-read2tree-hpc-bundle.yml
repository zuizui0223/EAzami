name: Validate Chang 2026 Read2Tree HPC bundle

on:
  pull_request:
    paths:
      - "analysis/build_chang2026_read2tree_hpc_bundle.py"
      - "tests/test_build_chang2026_read2tree_hpc_bundle.py"
      - "sampling/chang2026_takaoense6_read2tree_panel_v1.csv"
      - "data/evidence/chang2026_takaoense_morph_linked_public_samples_v1.csv"
      - "sampling/read2tree_oma_reference_set_v0_2.csv"
      - "workflow/chang2026_read2tree/prepare_six_trimmed_reads.sh"
      - "workflow/chang2026_read2tree/prepare_from_validated_marker_pack.sh"
      - "workflow/chang2026_read2tree/envs/read_prep.yml"
      - "workflow/chang2026_read2tree/envs/read2tree.yml"
      - "analysis/run_chang2026_read2tree_scoring_contract.py"
      - "analysis/score_chang2026_read2tree_topology.py"
      - ".github/workflows/validate-chang2026-read2tree-hpc-bundle.yml"
  workflow_dispatch:

concurrency:
  group: validate-chang2026-read2tree-hpc-bundle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and unit-test bundle builder
        run: |
          python -m py_compile analysis/build_chang2026_read2tree_hpc_bundle.py
          python -m unittest tests/test_build_chang2026_read2tree_hpc_bundle.py -v

      - name: Build executable contract bundle
        run: |
          rm -rf /tmp/eazami_read2tree_hpc_bundle
          python analysis/build_chang2026_read2tree_hpc_bundle.py \
            --panel sampling/chang2026_takaoense6_read2tree_panel_v1.csv \
            --evidence data/evidence/chang2026_takaoense_morph_linked_public_samples_v1.csv \
            --references sampling/read2tree_oma_reference_set_v0_2.csv \
            --outdir /tmp/eazami_read2tree_hpc_bundle
          for script in /tmp/eazami_read2tree_hpc_bundle/*.sh; do
            bash -n "$script"
          done

      - name: Audit execution boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/eazami_read2tree_hpc_bundle')
          manifest = json.loads((root / 'execution_manifest.json').read_text())
          if manifest['bundle_version'] != 'chang2026_read2tree_static400_hpc_bundle_v1':
              raise SystemExit('Unexpected bundle version')
          if manifest['sample_count'] != 6 or manifest['morph_counts'] != {'BP': 3, 'W': 3}:
              raise SystemExit('Six-sample 3BP/3W contract drifted')
          if manifest['execution_order'] != ['trim', 'read2tree_iqtree', 'score']:
              raise SystemExit('Stage order drifted')
          external = manifest['required_external_input']
          if external['expected_marker_count'] != 400 or external['expected_oma_release'] != 'May2026':
              raise SystemExit('Static400 execution contract drifted')
          if manifest['frozen_hypothesis_sha256'] != '5dbd081b5c360f73d824221f2dbc09892666f23ecc74a706620943f4c881692f':
              raise SystemExit('Frozen hypothesis hash drifted')
          if manifest['environment_contracts']['read2tree_source_commit'] != 'e19ad8f32a438ff7a38d9ee1d41832e1fc326a3c':
              raise SystemExit('Read2Tree source pin drifted')

          trim = (root / 'run_01_trim_slurm.sh').read_text()
          r2t = (root / 'run_02_read2tree_slurm.sh').read_text()
          score = (root / 'run_03_score_slurm.sh').read_text()
          submit = (root / 'submit_slurm_chain.sh').read_text()
          if 'Trinity' in trim:
              raise SystemExit('Trinity leaked into the fast trim stage')
          if 'prepare_six_trimmed_reads.sh' not in trim or 'MIN_FREE_DISK_GIB:-150' not in trim:
              raise SystemExit('Trim safety contract incomplete')
          if 'prepare_from_validated_marker_pack.sh' not in r2t or 'run_read2tree_fast_screen.sh' not in r2t:
              raise SystemExit('Read2Tree stage incomplete')
          if 'workflow/chang2026_read2tree/envs/read2tree.yml' not in r2t:
              raise SystemExit('Pinned Read2Tree environment missing')
          if '--thresholds 0,50,70,90' not in score:
              raise SystemExit('Support-collapse scoring contract drifted')
          if 'dependency=afterok:"$trim_job"' not in submit or 'dependency=afterok:"$r2t_job"' not in submit:
              raise SystemExit('Slurm dependency chain is not restart-safe')

          print('bundle_sample_count=6')
          print('morphs=BP3_W3')
          print('stages=trim|read2tree_iqtree|score')
          print('static400_external_pack=true')
          print('read2tree_commit=e19ad8f32a438ff7a38d9ee1d41832e1fc326a3c')
          print('heavy_execution_performed=false')
          PY

      - name: Upload HPC execution bundle
        uses: actions/upload-artifact@v4
        with:
          name: chang2026-read2tree-static400-hpc-bundle-${{ github.run_id }}
          path: /tmp/eazami_read2tree_hpc_bundle/
          if-no-files-found: error
          retention-days: 90
