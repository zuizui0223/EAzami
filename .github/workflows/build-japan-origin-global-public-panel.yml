name: Build Japan-origin global public panel

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download frozen Moreyra full-reconciliation artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/moreyra31400324674
          gh run download 31400324674 \
            --repo "${GITHUB_REPOSITORY}" \
            --name ncbi-PRJNA957074-metadata-31400324674 \
            --dir /tmp/moreyra31400324674
          test -s /tmp/moreyra31400324674/moreyra_sample_audit_output/moreyra2025_all_sample_reconciliation.csv
      - name: Build and validate 302-sample source-safe panel
        run: |
          python -m py_compile analysis/build_japan_origin_global_public_panel.py
          rm -rf /tmp/japan_origin_global_public_panel
          python analysis/build_japan_origin_global_public_panel.py \
            --moreyra-reconciliation /tmp/moreyra31400324674/moreyra_sample_audit_output/moreyra2025_all_sample_reconciliation.csv \
            --outdir /tmp/japan_origin_global_public_panel \
            | tee /tmp/japan_origin_global_public_panel.log
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path('/tmp/japan_origin_global_public_panel')
          rows=list(csv.DictReader((root/'japan_origin_global_public_panel_v1.csv').open()))
          s=json.loads((root/'japan_origin_global_public_panel_summary_v1.json').read_text())
          assert len(rows)==302
          assert s['biological_samples']==302
          assert s['public_run_accessions']==303
          assert s['unique_source_preserving_analysis_taxon_labels']==270
          assert s['source_counts']=={'Chang2025':13,'Chang2026':33,'Moreyra2025':256}
          assert s['moreyra_excluded_source_conflict_rows']==1
          assert s['global_common_locus_tree_executed'] is False
          assert s['new_china_sampling_freeze_allowed'] is False
          for tax in ('Cirsium brevicaule','Cirsium irumtiense','Cirsium dipsacolepis','Cirsium lineare'):
              assert any(r['analysis_taxon_label']==tax for r in rows), tax
          print(json.dumps(s,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: japan-origin-global-public-panel-${{ github.run_id }}
          path: |
            /tmp/japan_origin_global_public_panel
            /tmp/japan_origin_global_public_panel.log
          if-no-files-found: error
