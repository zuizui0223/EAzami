name: Validate Moreyra-based sequencing panel

on:
  pull_request:
    paths:
      - "analysis/classify_moreyra2025_sampling_gaps.py"
      - "tests/test_classify_moreyra2025_sampling_gaps.py"
      - "data/evidence/moreyra2025_east_asia_focal_taxon_audit_*.csv"
      - "sampling/SEQUENCING_PANEL_V0_3_MOREYRA_AUDIT.csv"
      - ".github/workflows/validate-moreyra-sampling-gaps.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: |
          python -m py_compile analysis/classify_moreyra2025_sampling_gaps.py
          python -m unittest tests/test_classify_moreyra2025_sampling_gaps.py -v

      - name: Regenerate and compare sequencing panel semantically
        run: |
          cp sampling/SEQUENCING_PANEL_V0_3_MOREYRA_AUDIT.csv /tmp/panel.expected.csv
          python analysis/classify_moreyra2025_sampling_gaps.py
          python - <<'PY'
          import csv
          from pathlib import Path

          def rows(path):
              with Path(path).open(encoding="utf-8-sig", newline="") as handle:
                  return list(csv.DictReader(handle))

          expected = rows("/tmp/panel.expected.csv")
          observed = rows("sampling/SEQUENCING_PANEL_V0_3_MOREYRA_AUDIT.csv")
          if expected != observed:
              raise SystemExit("Regenerated sequencing panel differs from committed rows")
          if not observed:
              raise SystemExit("Sequencing panel is empty")
          scores = [float(row["decision_score"]) for row in observed]
          if scores != sorted(scores, reverse=True):
              raise SystemExit("Sequencing panel is not sorted by descending score")
          print(f"validated_panel_rows={len(observed)}")
          print(f"top_taxon={observed[0]['accepted_taxon']}")
          print(f"top_score={observed[0]['decision_score']}")
          PY
